name: APK derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Güvenlik politikası (CSP) ekle
        run: node araclar/csp-ekle.js web/index.html

      - name: Debug APK derle
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: powerserv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı "apk" dalına koy (proje dosyalarına aktarmak için)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p /tmp/apk && cp app/build/outputs/apk/debug/app-debug.apk "/tmp/apk/PowerServ-$SURUM.apk"
          cd /tmp/apk
          git init -q -b apk
          git add .
          git -c user.name="APK derle" -c user.email="actions@users.noreply.github.com" commit -qm "PowerServ+ $SURUM APK"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk

  pc:
    # Windows kurulum dosyası (PowerServ-Kurulum-<sürüm>.exe): masaüstü kısayolu ve DN logosu ile.
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Windows kurulum dosyası derle
        run: |
          SURUM=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          node araclar/csp-ekle.js web/index.html
          cd masaustu
          mkdir -p app
          cp ../web/index.html app/index.html
          cp build/icon.png app/icon.png
          npm pkg set version="$SURUM"
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: powerserv-windows
          path: masaustu/dist/*.exe

      - name: Kurulum dosyasını "pc" dalına koy (proje dosyalarına aktarmak için)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pc && cp masaustu/dist/*.exe /tmp/pc/
          cd /tmp/pc
          git init -q -b pc
          git add .
          git -c user.name="APK derle" -c user.email="actions@users.noreply.github.com" commit -qm "PowerServ+ Windows kurulum dosyası"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pc

  yayin:
    # 2.26: Ana dala birleşen sürüm "son-surum" yayınına konur (APK + Windows kurulum + taşınabilir).
    # Program yeni sürüm bildirimini bu yayının adından ("PowerServ+ <sürüm>") ve dosyalarından okur.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, pc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dosyalar

      - name: Son sürüm yayınını yenile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir yayin
          cp dosyalar/powerserv-debug-apk/app-debug.apk "yayin/PowerServ-$SURUM.apk"
          cp dosyalar/powerserv-windows/*.exe yayin/
          ls -la yayin
          gh release delete son-surum --cleanup-tag --yes || true
          gh release create son-surum yayin/* \
            --title "PowerServ+ $SURUM" \
            --notes "Sürüm $SURUM, main dalı ${GITHUB_SHA::7}. Telefona PowerServ-$SURUM.apk, bilgisayara PowerServ-Kurulum-$SURUM.exe (ya da kurulumsuz PowerServ-Tasinabilir-$SURUM.exe). Program yeni sürümü bu sayfadan denetler." \
            --target "$GITHUB_SHA"
