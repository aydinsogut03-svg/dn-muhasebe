.yan-arac button{display:flex;align-items:center;gap:6px;border:0;background:var(--kart);box-shadow:var(--golge);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--yazi)}
.yan-arac button svg{width:16px;height:16px;color:var(--mavi)}
@media (min-width:1200px){
  #icerik.yanli{display:grid;grid-template-columns:minmax(0,1fr) 92px;column-gap:22px;align-items:start}
  #icerik.yanli>*{grid-column:1}
  #icerik.yanli>.btn-izgara,#icerik.yanli>.yan-arac{grid-column:2;grid-row:1/span 40;position:sticky;top:70px;display:flex;flex-direction:column;gap:8px;margin:0}
  #icerik.yanli>.btn-izgara button,#icerik.yanli>.yan-arac button{flex-direction:column;justify-content:center;gap:5px;padding:10px 4px;font-size:11.5px;text-align:center;min-height:62px;width:100%}
  #icerik.yanli>.yan-arac button svg,#icerik.yanli>.btn-izgara button svg{width:20px;height:20px}
  #icerik.yanli>.btn-izgara button:hover,#icerik.yanli>.yan-arac button:hover{background:color-mix(in srgb,var(--mavi) 9%,var(--kart))}
}
/* Liste raporu çıktısı */
.liste-kagit{font-size:10px}
.liste-kagit .lk-ust{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1f2f5a;padding-bottom:8px;margin-bottom:8px}
.liste-kagit .lk-ust img{height:42px}
.liste-kagit .lk-ust b{font-size:11.5px}
.liste-kagit .lk-baslik{margin-left:auto;text-align:right}
.liste-kagit .lk-baslik h3{margin:0;font-size:15px;color:#1f2f5a}
.liste-kagit th{background:#1f2f5a;color:#fff;font-size:9px;padding:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.liste-kagit td{padding:3px 4px;font-size:9.5px}
.liste-kagit tbody tr:nth-child(even) td{background:#f3f5f9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.liste-kagit .lk-dip{text-align:right;color:#888;font-size:8px;margin-top:8px}
/* Fişler (gelir, gider, tahsilat makbuzu) */
.fis-kagit{--fs:#1f2f5a;width:680px;max-width:none;font-size:11px;line-height:1.4;color:#111;border:1px solid #c9ced8;border-radius:6px;padding:20px 22px}
#yazdirAlani .fis-kagit{width:auto;border:1.5px solid #1f2f5a}
.fis-gider{--fs:#7a2430}.fis-tahsilat{--fs:#1f5a3a}
.fis-kagit .fs-ust{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center}
.fis-kagit .fs-logo{width:120px;max-height:56px;object-fit:contain}
.fis-kagit .fs-firma{font-size:9.5px;color:#444}
.fis-kagit .fs-firma b{display:block;font-size:11.5px;color:#111;margin-bottom:2px}
.fis-kagit .fs-kutu{border:2px solid var(--fs);border-radius:6px;padding:6px 10px;min-width:180px}
.fis-kagit .fs-kutu h3{margin:0 0 4px;font-size:14px;color:var(--fs);letter-spacing:.04em;white-space:nowrap}
.fis-kagit .fs-kutu table{margin:0;width:auto;font-size:10.5px}
.fis-kagit .fs-kutu td{border:0;padding:0 8px 0 0}
.fis-kagit .fs-kutu td:first-child{color:#555;font-weight:700}
.fis-kagit .fs-bar{background:var(--fs);color:#fff;font-weight:700;font-size:10px;padding:3px 8px;margin:14px 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fis-kagit .fs-ikili{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.fis-kagit .fs-alan{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.fis-kagit .fs-alan span{color:#555;font-weight:700;min-width:104px;white-space:nowrap}
.fis-kagit .fs-alan b{flex:1;font-weight:500;border-bottom:1px dotted #999;min-height:1.4em}
.fis-kagit .fs-tutar{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:12px 0 8px;border:1.5px solid var(--fs);border-radius:6px;padding:8px 12px;align-items:center}
.fis-kagit .fs-tutar span{display:block;font-size:9px;font-weight:700;color:#555}
.fis-kagit .fs-tutar>div:first-child b{font-size:20px;color:var(--fs);white-space:nowrap}
.fis-kagit .fs-yazi{border-left:1px solid #ccc;padding-left:12px}
.fis-kagit .fs-yazi b{font-style:italic;font-weight:600}
.fis-kagit .fs-beyan{font-size:9.5px;color:#444;margin:6px 0 10px;font-style:italic}
.fis-kagit .fs-imzalar{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fis-kagit .fs-ib{border:1px solid #888;text-align:center;font-weight:700;font-size:9px;padding:3px}
.fis-kagit .fs-ia{border:1px solid #888;border-top:0;height:58px}
.fis-kagit .fs-dip{text-align:center;color:#888;font-size:8px;margin-top:8px}
@media print{#yazdirAlani .fis-kagit{zoom:.95;font-size:11px;padding:18px 20px;border:1.5px solid var(--fs);border-radius:6px}#yazdirAlani .liste-kagit{font-size:10px}}

/* ================= Tema 2.5: kurumsal (ticari yazılım) =================
   Keskin köşeler, ince kenarlıklar, gölgesiz düz yüzeyler, sıkı yerleşim ve kısa geçişler. */
:root{
  --bg:#edf0f4;--kart:#fff;--kart2:#f6f7f9;--kenar:#d5dbe3;--ayirici:#e3e7ec;--dolgu:#eef1f5;--dolgu2:#dde3ea;
  --yazi:#17202b;--ikincil:#5b6573;--ucuncul:#9aa3ae;
  --mavi:#1d5fbf;--marka:#1d5fbf;--altin:#1d5fbf;--altin2:#1d5fbf;
  --yesil:#1f8a4c;--yesil-yazi:#1a7a42;--kirmizi:#c8352e;--turuncu:#c76a00;
  --golge:none;--egri:cubic-bezier(.25,.8,.25,1);
  --cam:#fff;--r:6px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191b1f;--kart:#22252a;--kart2:#2a2d33;--kenar:#383c44;--ayirici:#30343b;--dolgu:#2c3036;--dolgu2:#3a3f47;
  --yazi:#eceef1;--ikincil:#a2a9b3;--ucuncul:#6c737d;--mavi:#5b9bf0;--cam:#22252a;
}}
html,body{font-size:14.5px;letter-spacing:0}
header,header.kaydi{background:var(--kart);box-shadow:none;border-bottom:1px solid var(--kenar);-webkit-backdrop-filter:none;backdrop-filter:none}
header .orta-baslik{font-size:16px;font-weight:700}
#cekmece,body:not(.profilde) #cekmece{background:var(--kart)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-right:1px solid var(--kenar)}
.c-ust{border-bottom:1px solid var(--kenar);padding:14px 16px 12px}
.c-ust .kare[class*=r-]{border-radius:6px;background:var(--mavi);box-shadow:none}
.c-ayrac{height:1px;background:var(--ayirici);margin:10px 16px}
.c-liste{padding:0 8px;gap:0}
.c-liste:first-of-type{margin-top:8px}
.c-liste a{border-radius:4px;min-height:38px;font-size:14px;font-weight:550;position:relative}
.c-liste a.secili{background:color-mix(in srgb,var(--mavi) 10%,transparent);color:var(--mavi);font-weight:700}
.c-liste a.secili::before{display:block!important;content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0;background:var(--mavi)}
.c-liste .kare[class*=r-]{width:24px;height:24px;border-radius:5px;box-shadow:none}
.c-liste .kare svg{width:14px;height:14px}
.c-liste .rozet.uyar{border-radius:4px;box-shadow:none}
.c-alt-menu{margin:0 0 6px 20px;border-left:1px solid var(--kenar);animation:none}
.c-alt-menu a{border-radius:3px;font-size:13px!important}
.c-alt-menu a.secili{background:color-mix(in srgb,var(--mavi) 10%,transparent)}
.c-alt-baslik{text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.c-alt-menu a .m-kare{width:26px;height:26px;border-radius:4px;position:relative;box-shadow:none!important;background:color-mix(in srgb,var(--c) 14%,transparent)!important;color:var(--c)!important}
.c-alt-menu a .m-kare>svg,.c-alt-menu a.secili .m-kare>svg{width:17px;height:17px;stroke-width:2;color:var(--c)}
.m-arti{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--kart,#fff)}
.m-arti svg{width:8px;height:8px;stroke:#fff;stroke-width:2;fill:none}
.grup,.kart,.metrik,.tutar-kutu,.btn-izgara button,.profil-kart,.yeni-satir button,.cip,.alt-serit button,.rl-ozet div,.liste-kap,.yan-arac button,.rl-tarih input,.takvim button{border:1px solid var(--kenar)!important;box-shadow:none!important;border-radius:var(--r)!important}
.kahraman{border-radius:var(--r);box-shadow:none;background:linear-gradient(135deg,#1f63c6,#184f9e)}
.kahraman::after{box-shadow:none}
.metrik{background:var(--kart)!important;border-top:3px solid var(--c,var(--mavi))!important}
.bolum{text-transform:uppercase;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ikincil);margin:20px 2px 6px}
.hucre{min-height:42px}
.kare{border-radius:5px}
@supports (background:color-mix(in srgb,red 10%,transparent)){.kare[class*=r-]{background:var(--c);box-shadow:none}.avatar[class*=r-]{border-radius:6px}}
.avatar{border-radius:6px}
.hap{border-radius:3px;font-size:11px;padding:2px 6px;font-weight:700}
.btn{border-radius:var(--r);min-height:40px;font-weight:650;box-shadow:none!important}
.btn:not(.renkli):not(.yesil-acik):not(.kirmizi-acik){background:var(--mavi)}
.btn.yesil-acik{background:var(--yesil)}
.btn.renkli,.btn.kirmizi-acik{border:1px solid var(--kenar)!important;background:var(--kart)}
.segment{border-radius:var(--r);border:1px solid var(--kenar);background:var(--kart2);padding:2px}
.segment button,.segment label,.segment label span{border-radius:4px}
.segment .secili,.segment input:checked+span{background:var(--mavi)!important;color:#fff!important;box-shadow:none!important}
.arama{border-radius:var(--r);border:1px solid var(--kenar);background:var(--kart)}
.cip.secili,.alt-serit button.secili{background:var(--mavi);border-color:var(--mavi)!important}
.alt-serit button{border-radius:var(--r)!important;padding:6px 11px}
.alt-serit{border-bottom:1px solid var(--kenar);padding-bottom:14px}
.ay-secici button{border-radius:var(--r);border:1px solid var(--kenar)}
.liste-kap{border-radius:var(--r)!important}
.liste-tablo{font-size:13px}
.liste-tablo th{background:#f0f3f7;color:#2a3442;text-transform:uppercase;font-size:11px;letter-spacing:.03em;border-bottom:1px solid var(--kenar)}
.liste-tablo td{border-bottom:1px solid var(--ayirici);padding:8px 12px}
.liste-tablo td+td,.liste-tablo th+th{border-left:1px solid var(--ayirici)}
@media (prefers-color-scheme:dark){.liste-tablo th{background:var(--kart2);color:var(--yazi)}}
.liste-tablo td.islem button{border-radius:4px}
.modal:not(.sayfa-modal){border-radius:8px 8px 0 0}
.eylem .grup,.eylem button.iptal{border-radius:8px!important}
.sayfa-modal .modal-ust,.modal-alt{background:var(--kart);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--kenar)}
.modal-alt .btn{border-radius:var(--r)}
.bildirim{border-radius:6px;background:#1f2a37;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.logo,#kilitEkran .logo,.karsilama .logo{border-radius:10px;background:var(--mavi);box-shadow:none}
#kilitEkran{background:linear-gradient(160deg,#1f63c6,#163f80)}
.tus-takim button{border-radius:8px}
.sayfa-modal .grup.cift{border-radius:var(--r)}
/* Kısa ve sade geçişler */
#icerik>*,.metrikler .metrik,.c-alt-menu{animation:none!important}
.modal,.sayfa-modal{transition:transform .22s var(--egri)!important}
.perde{transition:background .2s}
.hucre:active,.metrik:active,.btn:active,.btn-izgara button:active,.yeni-satir button:active,.profil-kart:active,a.kart:active,.cip:active,.hizli button:active{transform:none!important;filter:brightness(.96)}
.anahtar span:before{transition:transform .15s}
/* ================= 2.6: ortak veritabanı — giriş ekranı, kilit uyarısı ================= */
#girisEkran,#ekranKilit{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#girisEkran .giris-kutu,#ekranKilit .giris-kutu{width:100%;max-width:400px;background:var(--kart);border:1px solid var(--kenar);border-radius:var(--r,6px);padding:28px 22px 20px}
#girisEkran .giris-logo,#ekranKilit .giris-logo{display:block;height:46px;max-width:180px;object-fit:contain;margin:0 auto 14px}
#girisEkran h2,#ekranKilit h2{margin:0;text-align:center;font-size:22px}
#girisEkran .giris-kutu > p,#ekranKilit .giris-kutu > p{margin:4px 0 18px;text-align:center;color:var(--ikincil);font-size:14px}
#girisEkran .grup,#ekranKilit .grup{margin:0 0 6px}
#girisEkran .btn,#ekranKilit .btn{width:100%;margin-top:6px}
.giris-uyari{background:rgba(240,140,0,.12);color:var(--yazi);border-left:3px solid var(--turuncu);padding:9px 12px;margin:0 0 14px;font-size:14px}
.giris-hata{min-height:18px;margin:6px 2px;font-size:13.5px;color:var(--kirmizi)}
.giris-alt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
#ekranKilit{z-index:96}
.kilit-simge{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:rgba(0,90,180,.1);color:var(--mavi);display:flex;align-items:center;justify-content:center}.kilit-simge .i{width:24px;height:24px}
.kucuk{font-size:12.5px}
/* ================= 2.7: tasarım düzeltmeleri ================= */
.bildirim{width:max-content;max-width:min(560px,calc(100vw - 32px));text-align:left;line-height:1.35}
.bildirim svg{flex:none}
.grafik .ek{font-size:12px}
.grafik svg{max-height:none}
/* ================= 2.7: telefon uygulaması (APK) — iOS tarzı düğmeler ve dokunma hissi ================= */
html.apk{--r:12px}
html.apk .btn{border-radius:12px;min-height:46px;font-weight:600;letter-spacing:-.01em}
html.apk .modal-alt .btn{border-radius:14px;min-height:50px}
html.apk .yan-arac button,html.apk .alt-serit button,html.apk .cip,html.apk .hizli button,html.apk .btn-izgara button,html.apk .yeni-satir button{border-radius:999px!important}
html.apk .segment{border-radius:10px}html.apk .segment button,html.apk .segment label,html.apk .segment label span{border-radius:8px}
html.apk .btn,html.apk .yan-arac button,html.apk .alt-serit button,html.apk .cip,html.apk .hizli button,html.apk .btn-izgara button,html.apk .yeni-satir button,html.apk .metrik,html.apk a.kart,html.apk .segment button,html.apk .tus-takim button,html.apk button.bag,html.apk .ust-arac button{transition:transform .32s cubic-bezier(.2,.9,.3,1.25),opacity .2s,filter .2s;-webkit-tap-highlight-color:transparent}
html.apk .btn:active,html.apk .yan-arac button:active,html.apk .alt-serit button:active,html.apk .cip:active,html.apk .hizli button:active,html.apk .btn-izgara button:active,html.apk .yeni-satir button:active,html.apk .segment button:active,html.apk .tus-takim button:active,html.apk .ust-arac button:active{transform:scale(.94)!important;opacity:.82;transition:transform .08s,opacity .08s}
html.apk .metrik:active,html.apk a.kart:active{transform:scale(.97)!important;filter:brightness(.97)}
html.apk button.bag:active{opacity:.45}
html.apk .hucre{transition:background-color .25s;-webkit-tap-highlight-color:transparent}
html.apk .bildirim{border-radius:14px}
/* ================= 2.8: sıkı yerleşim ve EŞİTLE düğmesi ================= */
/* 2.8.1: yana açılan kırılım menü */
.uc-menu{position:fixed;left:310px;top:80px;z-index:70;display:none;align-items:flex-start;gap:0;pointer-events:none}
.uc-menu.acik{display:flex}
.uc-kolon{pointer-events:auto;background:var(--kart);border:1px solid var(--kenar);box-shadow:0 10px 32px rgba(15,25,45,.18);border-radius:var(--r,6px);padding:6px;min-width:230px;max-height:calc(100vh - 24px);overflow-y:auto;animation:belir .16s ease both}
.uc-alt{display:none;margin-left:-1px;min-width:250px}
.uc-alt.acik{display:block}
.uc-baslik{font-size:11px;font-weight:700;color:var(--ikincil);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px 4px}
.uc-oge{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 10px;border-radius:6px;font:inherit;font-size:14.5px;font-weight:500;color:var(--yazi);text-align:left;cursor:pointer;min-height:38px}
.uc-oge .kare{width:26px;height:26px;border-radius:7px;flex:none}.uc-oge .kare svg{width:15px;height:15px}
.uc-oge .ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-oge .rozet{font-size:11.5px;color:var(--ikincil)}
.uc-oge .rozet.uyar{background:var(--kirmizi);color:#fff;border-radius:99px;padding:1px 7px}
.uc-oge .c-ok{width:14px;height:14px;color:var(--ucuncul)}
.uc-oge:hover,.uc-oge.uc-secili{background:color-mix(in srgb,var(--mavi) 10%,transparent);color:var(--mavi)}
.uc-kolon .c-alt-menu{margin:0;padding:0;border:0;animation:none}
.uc-kolon .c-alt-menu a{min-height:34px!important;font-size:14px!important;color:var(--yazi)!important;text-decoration:none!important}
.c-alt-menu a{text-decoration:none!important}
.uc-kolon .c-alt-menu a:hover{background:color-mix(in srgb,var(--mavi) 10%,transparent)}
.uc-kolon .c-alt-baslik,.c-agac .c-alt-baslik{font-size:10.5px;font-weight:700;color:var(--ikincil);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 3px}
#cekmece [data-grup] .c-ok{width:15px;height:15px;color:var(--ucuncul);margin-left:auto;transition:transform .2s}
#cekmece [data-grup].acik .c-ok{transform:rotate(90deg)}
#cekmece [data-grup].uc-acik{background:color-mix(in srgb,var(--mavi) 12%,transparent)}
.c-agac{margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid var(--kenar)}
.c-agac-oge{display:flex;align-items:center}
.c-agac-oge .uc-oge{flex:1;min-width:0}
.c-ac{border:0;background:none;padding:8px 10px;color:var(--ikincil);cursor:pointer}
.c-ac .c-ok{width:15px;height:15px;transition:transform .2s}.c-ac .c-ok.don{transform:rotate(90deg)}
.c-agac .c-alt-menu{margin:0 0 4px 30px}
/* 2.8: alt menü şeridi iki satır — İşlemler ve Raporlar */
.alt-serit{display:block!important;overflow:visible!important}
.alt-serit .as-satir{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-width:0}
.alt-serit .as-baslik{flex:none;width:68px;font-size:11px;font-weight:700;color:var(--ikincil);text-transform:uppercase;letter-spacing:.05em}
.alt-serit .as-dugmeler{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
@media (max-width:759px){.alt-serit .as-satir{display:block}.alt-serit .as-baslik{display:block;width:auto;margin:0 0 4px 2px}.alt-serit .as-dugmeler{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}.alt-serit .as-dugmeler::-webkit-scrollbar{display:none}}
.c-liste a{font-size:15px}
.esitle-btn{gap:5px!important;font-weight:600;border:1px solid var(--kenar)!important;border-radius:var(--r,6px)!important;padding:5px 10px!important;margin-left:6px;font-size:13.5px!important}
.esitle-btn .i{width:17px;height:17px}
.esitle-btn.donuyor .i{animation:don .8s linear infinite}
.esitle-btn.hatali{color:var(--kirmizi)!important;border-color:var(--kirmizi)!important}
@media (max-width:420px){.esitle-btn span{display:none}.esitle-btn{padding:5px 8px!important}}
.hucre{min-height:38px}
.hucre .ic{padding:6px 0}
.hucre .ic small{font-size:12px}
.grup{margin-bottom:12px}
.kart{padding:10px 12px;margin-bottom:10px}
.ikili{margin-bottom:10px;gap:8px}
.bolum{margin-top:12px!important;margin-bottom:5px!important}
.dev{font-size:22px}
.dev.orta{font-size:19px}
.metrik{padding:9px 11px 8px!important}
.segment{margin-bottom:10px}
.btn{min-height:36px}
.c-liste a{min-height:34px!important;padding-top:3px;padding-bottom:3px}
.c-alt-menu a{padding-top:4px!important;padding-bottom:4px!important}
.btn-izgara{gap:6px!important}
.btn-izgara button{padding:7px 4px!important;min-height:0!important}
@media (min-width:960px){
  main{max-width:1560px!important;padding:6px 24px 40px!important}
  .grup .hucre{min-height:36px}
}
html.apk .btn{min-height:42px}
/* Personel bilgi ızgarası: tüm alanlar bir bakışta, dokununca düzenleme açılır */

/* 2.9.7: Excel gibi kalem tablosu (teklif ve fatura) */

.kt-bas,.kt-satir{display:grid;grid-template-columns:28px minmax(80px,.8fr) minmax(140px,2.4fr) 70px 82px 104px 62px 64px 104px 30px;align-items:stretch}

.kt-satir select{appearance:auto;-webkit-appearance:auto;padding:0 2px!important}
.kt-satir input:focus,.kt-satir select:focus{background:color-mix(in srgb,var(--mavi) 12%,transparent)!important;box-shadow:inset 0 0 0 2px var(--mavi)!important}
.kt-no{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ikincil)}
.kt-tutar{display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-weight:600;white-space:nowrap}

.kt-sil:disabled{opacity:.25}
.kt-c{display:flex;align-items:stretch;min-width:0;margin:0}
.kt-c>input,.kt-c>select{flex:1}
.kt-et,.kt-no i{display:none}
.kt-no b{font-weight:400}
.kt-tutar,.kt-tutar *{-webkit-user-select:none;user-select:none}
.kt-c.kt-tutar{align-items:center;justify-content:flex-end}
/* 2.9.10: Telefonda Excel gibi eşit hücreler: her kalem iki sütunlu, etiketli büyük hücrelerden oluşan bir kart.
   Satırlar: Kalem no + Sil | Parça no, Açıklama | Miktar, Birim | Birim fiyat, KDV | (İskonto), Tutar. */
@media (max-width:760px){
  .kt{font-size:14px;border:0;background:none;overflow:visible}
  .kt-bas{display:none!important}
  .kt-satir,.kt.kt-teklif .kt-satir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"no sil" "kod ad" "mik birim" "fiyat kdv" "isk tutar";background:var(--kart)!important;border:1px solid var(--kenar)!important;border-radius:10px!important;margin:0 0 10px!important;overflow:hidden}
  .kt.kt-teklif .kt-satir{grid-template-areas:"no sil" "kod ad" "mik birim" "fiyat kdv" "tutar tutar"}
  .kt-satir>*{border:0!important;border-bottom:1px solid var(--ayirici)!important;min-width:0!important}
  .kt-satir>:nth-child(odd):not(.kt-no):not(.kt-sil){border-right:0!important}
  .kt-kod,.kt-mik,.kt-fiyat,.kt-isk{border-right:1px solid var(--ayirici)!important}
  .kt.kt-teklif .kt-tutar{border-right:0!important}
  .kt-no{grid-area:no;justify-content:flex-start!important;padding:7px 12px;font-size:13px!important;font-weight:650;color:var(--yazi)!important;background:color-mix(in srgb,var(--mavi) 8%,var(--kart))}
  .kt-no i{display:inline;font-style:normal}
  .kt-sil{grid-area:sil;justify-content:flex-end!important;gap:4px;padding:7px 12px!important;font-size:13px;color:var(--kirmizi)!important;background:color-mix(in srgb,var(--mavi) 8%,var(--kart))!important}
  .kt-sil .kt-et{display:inline}
  .kt-sil:disabled{opacity:1;color:transparent!important}
  .kt-kod{grid-area:kod}.kt-ad{grid-area:ad}.kt-mik{grid-area:mik}.kt-birim{grid-area:birim}.kt-fiyat{grid-area:fiyat}.kt-isk{grid-area:isk}.kt-kdv{grid-area:kdv}.kt-tutar{grid-area:tutar}
  .kt-c{flex-direction:column;padding:6px 10px 2px}
  .kt-c .kt-et{display:block;font-size:11.5px;font-weight:600;color:var(--ikincil);line-height:1.2}
  .kt-satir .kt-c input,.kt-satir .kt-c select{height:40px;font-size:17px!important;padding:4px 0!important;text-align:left!important;touch-action:manipulation;flex:none}
  .kt-satir .kt-c select{appearance:none!important;-webkit-appearance:none!important;background:none!important}
  .kt-satir .kt-c input:focus,.kt-satir .kt-c select:focus{box-shadow:none!important;background:none!important}
  .kt-c:focus-within{background:color-mix(in srgb,var(--mavi) 10%,transparent);box-shadow:inset 0 0 0 2px var(--mavi)}
  .kt-tutar{align-items:flex-start!important;justify-content:flex-start!important;padding:6px 10px 8px!important;font-size:17px}
  .kt-tutar [data-tutar]{line-height:40px;font-weight:700}
  .kt-satir>:nth-last-child(2),.kt-satir>.kt-isk{border-bottom:0!important}
}

/* ================= 2.10: Masaüstü klasik ERP düzeni =================
   Yalnız masaüstünde (body.erp) etkin: üstte pencere sekmeleri, tam sayfa fiş ve tablo pencereleri, sık ızgaralar.
   Telefon görünümü değişmez. */
:root{--erp-bas1:#4677c4;--erp-bas2:#24508f;--erp-cizgi:#c3cddb;--erp-th:#e8eef7;--erp-th-yazi:#1c4f9c;--erp-secili:#d3e5ff;--erp-sari:#fff3a8;--erp-turuncu:#ffcfb3;--erp-gri:#e0e2e5;--erp-yesil:#d3f0da;--erp-kirmizi:#ffd9d9;--erp-zemin:#eef2f7;--erp-giris:#fff;--erp-sekme:#2fa65a}
@media (prefers-color-scheme:dark){:root{--erp-bas1:#2c4d82;--erp-bas2:#1a3359;--erp-cizgi:#354253;--erp-th:#1e2935;--erp-th-yazi:#8db5f2;--erp-secili:#203d66;--erp-sari:#3f3a12;--erp-turuncu:#4a2e20;--erp-gri:#2a2f36;--erp-yesil:#1b3a26;--erp-kirmizi:#4a2224;--erp-zemin:#17202a;--erp-giris:#0f151c;--erp-sekme:#258a4a}}
body.erp #icerik>*{animation:none!important}
main#icerik.erp-tam{max-width:none!important;padding:6px 12px 14px!important}
.pencereler{display:flex;gap:2px;align-items:flex-end;border-bottom:2px solid var(--erp-sekme);margin:0 0 6px;overflow-x:auto;scrollbar-width:thin;font-size:12.5px}
#icerik.yanli>.pencereler{grid-column:1/-1}
body.erp #icerik.yanli>.btn-izgara,body.erp #icerik.yanli>.yan-arac{grid-row:2/span 40}
.pnc{display:flex;align-items:center;flex:none;max-width:230px;min-width:0;background:var(--erp-th);border:1px solid var(--erp-cizgi);border-bottom:0;border-radius:5px 5px 0 0;color:var(--yazi)}
.pnc:hover{background:var(--erp-secili)}
.pnc.aktif{background:var(--erp-sekme);border-color:var(--erp-sekme);color:#fff}
.pnc-ad{border:0;background:none;color:inherit;font:inherit;padding:5px 10px;display:flex;gap:6px;align-items:center;min-width:0;cursor:pointer}
.pnc.aktif .pnc-ad{font-weight:700}
.pnc-ad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnc-ad svg{width:14px;height:14px;flex:none}
.pnc-x{border:0;background:none;color:inherit;opacity:.55;padding:4px 7px 4px 0;cursor:pointer;display:flex}
.pnc-x svg{width:12px;height:12px}
.pnc-x:hover{opacity:1}
/* Fiş ve tablo pencereleri */
.fis{display:flex;flex-direction:column;background:var(--kart);border:1px solid var(--erp-cizgi);font-size:12.5px;line-height:1.35;color:var(--yazi);min-height:calc(100vh - 112px)}
.fis-bas{display:flex;align-items:stretch;justify-content:space-between;background:linear-gradient(180deg,#6a98df 0,var(--erp-bas1) 40%,var(--erp-bas2) 100%);color:#fff;min-height:56px}
.fis-ad{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:200px;flex:1 1 0;overflow:hidden}.fis-ad>div{min-width:0}
.fis-ad>svg{width:30px;height:30px;flex:none}
.fis-ad b{font-size:19px;font-weight:700;display:block;white-space:nowrap}
.fis-ad small{display:block;font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fis-durum .hap{font-size:11px;vertical-align:middle;background:#fff!important}.fis-ad b .fis-kirli{vertical-align:middle}
.fis-kirli{background:#ffd34d;color:#3a2a00;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px;white-space:nowrap}
.fis-arac{flex:0 1 auto;min-width:0;display:flex;align-items:stretch;background:var(--erp-zemin);color:var(--yazi);padding:2px 4px;border-left:1px solid var(--erp-cizgi);overflow-x:auto;scrollbar-width:thin}
.fa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;padding:4px 5px;border:1px solid transparent;background:none;color:inherit;font:inherit;font-size:11px;cursor:pointer;border-radius:3px;white-space:nowrap}
.fa svg{width:22px;height:22px;color:var(--erp-bas2)}
@media (prefers-color-scheme:dark){.fa svg{color:var(--erp-th-yazi)}}
.fa:hover:not(:disabled){background:var(--erp-secili);border-color:var(--erp-cizgi)}
.fa:disabled{opacity:.38;cursor:default}
.fa-ayir{flex:none;width:1px;background:var(--erp-cizgi);margin:6px 3px}
.fis-uyari{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--erp-sari);border-bottom:1px solid var(--erp-cizgi)}
.fis-uyari.kirmizi{background:var(--erp-kirmizi)}
.fis-uyari svg{width:16px;height:16px;flex:none}
.fis-sekmeler,.ft-sekmeler{display:flex;align-items:flex-end;gap:1px;background:var(--erp-zemin);border-bottom:1px solid var(--erp-cizgi);padding:4px 6px 0;overflow-x:auto;scrollbar-width:thin}
.fs-s{border:1px solid transparent;border-bottom:0;background:none;color:var(--yazi);font:inherit;font-size:12.5px;padding:4px 11px 5px;cursor:pointer;white-space:nowrap;border-radius:3px 3px 0 0;margin-bottom:-1px}
.fs-s:hover{background:var(--erp-secili)}
.fs-s.aktif{background:var(--kart);border-color:var(--erp-cizgi);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.fl-ara{margin-left:auto;display:flex;align-items:center;gap:5px;padding:0 0 4px 12px}
.fl-ara svg{width:15px;height:15px;color:var(--ikincil)}
.fl-ara input{height:25px;width:300px;border:1px solid var(--erp-cizgi);border-radius:2px;background:var(--erp-giris);color:var(--yazi);font:inherit;padding:0 7px}
.fl-tarih{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--erp-cizgi);background:var(--kart)}
.fl-tarih label{color:var(--ikincil)}
.fl-tarih input{height:25px;border:1px solid var(--erp-cizgi);border-radius:2px;background:var(--erp-giris);color:var(--yazi);font:inherit;padding:0 6px}
.fis-govde{flex:1;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
.fis-ro .fis-govde{background:color-mix(in srgb,var(--erp-gri) 30%,var(--kart))}
/* Izgara */
.izg-kap{overflow:auto;border:1px solid var(--erp-cizgi);background:var(--kart);min-height:150px;max-height:calc(50vh - 60px)}
.izg-kap.uzun{flex:1;max-height:calc(100vh - 290px);min-height:260px}
.fb-hareket .izg-kap{max-height:calc(100vh - 520px);min-height:170px}
table.izg{border-collapse:collapse;table-layout:fixed;width:max-content;min-width:100%;font-size:12.5px;margin:0}
table.izg th{position:sticky;top:0;z-index:1;background:var(--erp-th);color:var(--erp-th-yazi);font-weight:700;text-align:left;padding:4px 6px;border:1px solid var(--erp-cizgi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
table.izg th.tik{cursor:pointer}
table.izg th.tik:hover{text-decoration:underline}
table.izg td{border:1px solid var(--erp-cizgi);padding:0;height:24px;color:var(--yazi);background:var(--kart)}
table.izg tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--erp-th) 45%,var(--kart))}
table.izg td.salt{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.izg .sg,table.izg input.sg{text-align:right;font-variant-numeric:tabular-nums}
table.izg input,table.izg select{display:block;width:100%;height:24px!important;min-height:0!important;border:0!important;background:transparent!important;color:inherit;font:inherit!important;font-size:12.5px!important;padding:0 6px!important;box-sizing:border-box;outline:0;border-radius:0!important;box-shadow:none!important;margin:0}
table.izg select{appearance:auto;-webkit-appearance:auto;padding:0 2px!important}
table.izg input:focus,table.izg select:focus{background:var(--erp-giris)!important;box-shadow:inset 0 0 0 2px var(--mavi)!important}
table.izg input:disabled,table.izg select:disabled{opacity:1;-webkit-text-fill-color:currentColor}
table.izg td.izg-no{width:28px;text-align:center;color:var(--ikincil);font-size:11px;background:var(--erp-th)!important}
table.izg tr.secili td.izg-no{color:var(--erp-th-yazi);font-weight:700}
table.izg tr.secili td.izg-no::before{content:'▶ '}
table.izg tr.d-yapilacak td{background:var(--erp-sari)}
table.izg tr.d-yapildi td{background:var(--erp-turuncu)}
table.izg tr.d-iptal td{background:var(--erp-gri);color:var(--ikincil)}
table.izg tr.d-tamam td{background:var(--erp-yesil)}
table.izg tr.d-uyar td{color:var(--kirmizi)}
table.izg tr.d-musteri td{font-style:italic}
table.izg tbody tr.secili td:not(.izg-no){background:var(--erp-secili)}
table.izg tbody tr.tik{cursor:default}
table.izg tbody tr.tik:hover td:not(.izg-no){background:color-mix(in srgb,var(--erp-secili) 55%,var(--kart))}
table.izg tbody tr:focus{outline:0}
table.izg tfoot td{background:var(--erp-th);font-weight:700;position:sticky;bottom:0}
.izg-sil button{border:0;background:none;color:var(--ikincil);cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;height:24px;padding:0}
.izg-sil button svg{width:13px;height:13px}
.izg-sil button:hover{color:var(--kirmizi)}
.izg-bos{padding:14px;color:var(--ikincil)}
/* Fiş alanları */
.fk-izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fk-ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
fieldset.fk{border:1px solid var(--erp-cizgi);margin:0;padding:4px 10px 8px;background:var(--kart);min-width:0}
fieldset.fk legend{font-weight:700;color:var(--erp-th-yazi);padding:0 4px;font-size:12.5px}
.fk-satir{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:6px;margin:3px 0}
.fk-satir.ust{align-items:start}
.fk-satir>label{color:var(--ikincil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk input:not([type=checkbox]),.fk select,.fk textarea,.pers-ekle input{height:25px;min-height:0;border:1px solid var(--erp-cizgi)!important;border-radius:2px!important;background:var(--erp-giris)!important;color:var(--yazi);font:inherit;font-size:12.5px;padding:0 6px;width:100%;box-sizing:border-box;box-shadow:none!important;margin:0}
.fk select{appearance:auto;-webkit-appearance:auto}
.fk input[readonly]{background:var(--erp-zemin)!important}
.fk input:focus,.fk select:focus,.fk textarea:focus,.pers-ekle input:focus{outline:0;border-color:var(--mavi)!important;box-shadow:0 0 0 1px var(--mavi)!important}
.fk textarea{height:auto;min-height:110px;padding:5px 6px;resize:vertical;line-height:1.4}
.fk input:disabled,.fk select:disabled,.fk textarea:disabled{opacity:.8}
.fk-bul{display:flex;gap:3px;min-width:0}
.fk-bul input{flex:1;min-width:0}
.fk-kutular{display:flex;flex-wrap:wrap;gap:4px 18px;padding:2px 0}
.fk-kutular label,.fb-not{display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.fk input[type=checkbox],.fb-not input{display:inline-block!important;width:15px;height:15px;margin:0;accent-color:var(--erp-bas1)}
.fk-not{color:var(--ikincil);font-size:11.5px;margin:6px 0 0}
fieldset.fk-sade,.fk.fk-sade{border:0;padding:0;background:none}
.fb-not{color:var(--ikincil);padding:4px 2px 0}
/* Bölümler */
.fb{display:flex;flex-direction:column;min-width:0}
.fb-bas{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 1px 4px;font-weight:700;color:var(--erp-th-yazi)}
.fb-bas small{font-weight:400;color:var(--ikincil)}
.fb-bas>span{display:flex;gap:4px}
.fb-ust{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:8px}
.fb-alt{display:flex;justify-content:flex-end;gap:22px;padding:4px 8px;background:var(--erp-zemin);border:1px solid var(--erp-cizgi);border-top:0}
.fb-alt b{font-variant-numeric:tabular-nums}
.fb-pers{gap:5px}
.pers-liste{list-style:none;margin:0;padding:0;border:1px solid var(--erp-cizgi);min-height:96px;max-height:180px;overflow:auto;background:var(--kart)}
.pers-liste li{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 8px;border-bottom:1px solid var(--erp-cizgi);font-weight:700}
.pers-liste li:nth-child(odd){background:var(--erp-secili)}
.pers-liste li.bos{font-weight:400;color:var(--ikincil);background:none}
.pers-liste button{border:0;background:none;color:var(--ikincil);cursor:pointer;display:flex;padding:2px}
.pers-liste button svg{width:12px;height:12px}
.pers-liste button:hover{color:var(--kirmizi)}
.pers-ekle{display:flex;gap:4px}
.kb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:25px;border:1px solid var(--erp-cizgi);background:linear-gradient(var(--kart),var(--erp-zemin));color:var(--yazi);font:inherit;font-size:12px;padding:0 10px;border-radius:2px;cursor:pointer;white-space:nowrap;flex:none}
.kb svg{width:14px;height:14px}
.kb:hover:not(:disabled){border-color:var(--erp-bas1);background:var(--erp-secili)}
.kb:disabled{opacity:.4;cursor:default}
.kb.tam{width:100%}
.kb.ince{height:20px;padding:0 5px;margin:1px 0}
/* Alt toplamlar */
.fis-alt{border-top:1px solid var(--erp-cizgi);background:var(--erp-zemin)}
.ft{display:flex;flex-wrap:wrap;gap:8px 30px;padding:7px 14px;align-items:center}
.ft-kolon{display:grid;grid-template-columns:auto auto;gap:2px 16px;align-content:start}
.ft-kolon span{color:var(--ikincil);white-space:nowrap}
.ft-kolon b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ft-genel{margin-left:auto;border:1px solid var(--erp-cizgi);background:var(--kart);padding:3px 14px 5px;text-align:right;min-width:210px}
.ft-genel small{display:block;color:var(--ikincil);font-size:11.5px}
.ft-genel b{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ft-ipucu{font-size:11.5px}
.ft-tablo{border-collapse:collapse;font-size:12.5px;margin:0;min-width:360px}
.ft-tablo th,.ft-tablo td{border:1px solid var(--erp-cizgi);padding:3px 10px;text-align:left}
.ft-tablo th{background:var(--erp-th);color:var(--erp-th-yazi)}
.ft-tablo .sg{text-align:right;font-variant-numeric:tabular-nums}
.fis .kagit-kap{display:flex;justify-content:center;padding:6px;background:var(--erp-zemin);border:1px solid var(--erp-cizgi)}
/* Çerçeveye alınan kayıt kartları ve ekranlar: köşesiz, çizgili, sık */
.erp-icerik{font-size:13px;overflow:auto}
.erp-icerik>*{max-width:1280px}
.erp-icerik .kart,.erp-icerik .grup,.erp-icerik .metrik,.erp-icerik .bk-kutu{border-radius:0!important;box-shadow:none!important;border:1px solid var(--erp-cizgi)!important;margin-bottom:8px!important}
.erp-icerik .kart{padding:8px 10px}
.erp-icerik .grup .hucre{min-height:30px!important;padding-top:2px!important;padding-bottom:2px!important;border-radius:0!important;font-size:13px}
.erp-icerik .grup .hucre:nth-child(even){background:color-mix(in srgb,var(--erp-th) 40%,var(--kart))}
.erp-icerik .grup .hucre:hover{background:var(--erp-secili)}
.erp-icerik .hucre .kare,.erp-icerik .hucre .avatar{width:22px!important;height:22px!important;border-radius:3px!important;font-size:10px}
.erp-icerik .hucre .kare svg,.erp-icerik .hucre .avatar svg{width:14px;height:14px}
.erp-icerik .bolum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 0!important;padding:4px 8px;background:var(--erp-th);color:var(--erp-th-yazi)!important;border:1px solid var(--erp-cizgi);border-bottom:0;font-size:12px!important;letter-spacing:0!important;text-transform:none!important;font-weight:700}
.erp-icerik .bolum+.grup,.erp-icerik .bolum+.kart{margin-top:0!important}
.erp-icerik .btn,.erp-icerik .segment,.erp-icerik .segment button,.erp-icerik .cip,.erp-icerik .arama{border-radius:2px!important}
.erp-icerik .ikili{gap:8px}
.erp-icerik table{font-size:12.5px}
.fis-kart .fis-govde{background:var(--erp-zemin)}
.fis-kart .fa{font-size:11px}
.fis-kart .fa svg{width:20px;height:20px}
@media (max-width:1180px){.fk-izgara{grid-template-columns:repeat(2,minmax(0,1fr))}.fl-ara input{width:200px}.fa{min-width:50px}}
/* 2.10.1 PC giriş ekranları: ERP formu. Tam sayfa, sık satırlar, solda etiket sağda kutulu alan, çizgili tablolar.
   Telefonda (body.erp yok) hiçbir kural etkin değildir. */
.erp-yalniz{display:none!important}
.ff-ust,.ff-b,.ff-kalem,.ff-alt,.ff-sol,.ff-sag{display:contents}
body.erp .erp-form .erp-yalniz{display:block!important}
body.erp .erp-form .bolum .erp-yalniz{display:inline!important}
body.erp .sayfa-modal.erp-form{font-size:12.5px;transition:none!important;box-shadow:none;border-left:1px solid var(--erp-cizgi)}
body.erp .erp-form .modal-ust{min-height:38px!important;padding:0 10px 0 4px!important;background:linear-gradient(180deg,#6a98df 0,var(--erp-bas1) 40%,var(--erp-bas2) 100%)!important;color:#fff!important;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border:0}
body.erp .erp-form .modal-ust b{font-size:15px!important;color:#fff!important;letter-spacing:0}
body.erp .erp-form .modal-ust .nav-btn{color:#fff!important;padding:4px 6px}
body.erp .erp-form .modal-govde{padding:8px 10px 14px!important;background:var(--erp-zemin)!important;font-size:12.5px}
body.erp .erp-form .modal-alt{display:flex;justify-content:flex-end;gap:8px;padding:6px 10px!important;background:var(--erp-zemin)!important;border-top:1px solid var(--erp-cizgi)!important;box-shadow:none}
body.erp .erp-form .modal-alt .btn{width:auto;min-width:170px;min-height:30px!important;height:30px;border-radius:2px!important;font-size:13px;font-weight:700;background:linear-gradient(180deg,var(--erp-bas1),var(--erp-bas2));color:#fff}
body.erp .erp-form .modal-alt::before{content:"Ctrl+S ile kaydet";align-self:center;margin-right:auto;color:var(--ikincil);font-size:11.5px}
/* Bölüm başlığı: tablo başlığı gibi şerit */
body.erp .erp-form .bolum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 0!important;padding:4px 8px;background:var(--erp-th);color:var(--erp-th-yazi)!important;border:1px solid var(--erp-cizgi);border-bottom:0;font-size:12px!important;letter-spacing:0!important;text-transform:none!important;font-weight:700}
body.erp .erp-form .modal-govde>.bolum:first-child,body.erp .erp-form .ff-b>.bolum:first-child{margin-top:0!important}
body.erp .erp-form .ff-ipucu{font-weight:400;color:var(--ikincil);font-size:11.5px}
/* Gruplar: köşesiz, gölgesiz, çizgili */
body.erp .erp-form .grup{border-radius:0!important;box-shadow:none!important;border:1px solid var(--erp-cizgi);margin:0 0 8px!important;background:var(--kart);overflow:visible}
body.erp .erp-form .bolum+.grup,body.erp .erp-form .bolum+.kart,body.erp .erp-form .bolum+div>.kt{margin-top:0!important}
body.erp .erp-form .grup.cift{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0;background:var(--kart)}
body.erp .erp-form .grup.cift>*{border-bottom:1px solid var(--erp-cizgi);border-right:1px solid var(--erp-cizgi)}
body.erp .erp-form .grup.cift>.tam{grid-column:auto}
body.erp .erp-form .grup.cift>.tam:only-child{grid-column:1/-1}
/* Satırlar: solda etiket, sağda kutulu giriş */
body.erp .erp-form .f-satir,body.erp .erp-form .grup.cift>.f-satir:not(.sol):has(>input,>select){display:flex;flex-direction:row!important;align-items:center!important;gap:8px!important;min-height:31px!important;padding:3px 8px!important;font-size:12.5px}
body.erp .erp-form .f-satir+.f-satir::before,body.erp .erp-form .hucre+.hucre::before,body.erp .erp-form .grup>*::before{display:none!important}
body.erp .erp-form .grup:not(.cift)>.f-satir+.f-satir,body.erp .erp-form .grup:not(.cift)>.hucre+.hucre,body.erp .erp-form .grup:not(.cift)>.f-satir+.hucre,body.erp .erp-form .grup:not(.cift)>.hucre+.f-satir{border-top:1px solid var(--erp-cizgi)}
body.erp .erp-form .f-satir>span:first-child,body.erp .erp-form .grup.cift>.f-satir:not(.sol):has(>input,>select)>span:first-child{flex:none;width:140px;min-width:140px;color:var(--ikincil);font-size:12.5px!important;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.erp .erp-form .f-satir>span[style*="flex:1"]{width:auto;min-width:0;flex:1!important;color:var(--yazi)}
body.erp .erp-form .f-satir.sol .yuzen{position:static!important;opacity:1!important;transform:none!important;flex:none;width:140px;font-size:12.5px!important;line-height:1.25;color:var(--ikincil);overflow:hidden;text-overflow:ellipsis}
body.erp .erp-form .f-satir.sol{align-items:flex-start!important}
body.erp .erp-form .f-satir.sol .yuzen{padding-top:5px}
body.erp .erp-form .f-satir>input:not([type=checkbox]),body.erp .erp-form .f-satir>select,body.erp .erp-form .f-satir>textarea,body.erp .erp-form .f-satir .tutar-giris input,body.erp .erp-form .grup.cift>.f-satir:not(.sol)>input,body.erp .erp-form .grup.cift>.f-satir:not(.sol)>select{flex:1;min-width:0;height:25px;min-height:0!important;border:1px solid var(--erp-cizgi)!important;border-radius:2px!important;background:var(--erp-giris)!important;color:var(--yazi)!important;font:inherit;font-size:12.5px!important;padding:0 6px!important;text-align:left!important;text-align-last:left!important;box-shadow:none!important;margin:0}
body.erp .erp-form .f-satir>select{appearance:auto;-webkit-appearance:auto}
body.erp .erp-form .f-satir.sol:has(.yuzen)>input:not(:placeholder-shown){padding:0 6px!important}
body.erp .erp-form .f-satir>textarea,body.erp .erp-form .f-satir.sol:has(.yuzen)>textarea:not(:placeholder-shown){height:auto;min-height:62px!important;padding:4px 6px!important;resize:vertical;line-height:1.4}

body.erp .erp-form .f-satir input::placeholder,body.erp .erp-form .f-satir textarea::placeholder{color:var(--ucuncul);font-size:12px}
body.erp .erp-form .f-satir .anahtar{transform:scale(.72);transform-origin:right center;margin:-5px 0}

body.erp .erp-form .hucre{min-height:31px!important;padding:3px 8px!important;gap:8px;font-size:12.5px;border-radius:0!important}
body.erp .erp-form .hucre .ic b{font-weight:600;font-size:12.5px}
body.erp .erp-form .hucre .ic small{font-size:11.5px}
body.erp .erp-form button.hucre{background:var(--erp-giris)}
body.erp .erp-form button.hucre:hover{background:var(--erp-secili)}
body.erp .erp-form .hucre .kare,body.erp .erp-form .hucre .avatar{width:22px!important;height:22px!important;border-radius:3px!important;font-size:10px}
body.erp .erp-form .hucre .kare svg,body.erp .erp-form .hucre .avatar svg{width:14px;height:14px}
body.erp .erp-form .dipnot{margin:-4px 2px 8px!important;font-size:11.5px}
body.erp .erp-form .btn{min-height:28px!important;border-radius:2px!important;font-size:12.5px;padding:0 12px}
body.erp .erp-form .btn.renkli{background:linear-gradient(var(--kart),var(--erp-zemin));color:var(--yazi);border:1px solid var(--erp-cizgi)}
body.erp .erp-form .btn.renkli:hover{border-color:var(--erp-bas1);background:var(--erp-secili)}
body.erp .erp-form .btn svg{width:15px;height:15px}
body.erp .erp-form .btn-grup{justify-content:flex-start;gap:4px;margin:0 0 8px}
body.erp .erp-form .btn-grup .btn{flex:none;width:auto}

body.erp .erp-form .segment button,body.erp .erp-form .segment label,body.erp .erp-form .segment label span{border-radius:2px!important;padding-top:3px;padding-bottom:3px;font-size:12.5px}
body.erp .erp-form .kart{border-radius:0!important;box-shadow:none!important;border:1px solid var(--erp-cizgi)}
body.erp .erp-form .kilit-uyari{border-radius:0}

body.erp .erp-form .kt{border-radius:0;border-color:var(--erp-cizgi);margin-bottom:6px;font-size:12.5px;max-height:calc(100vh - 360px);min-height:200px;overflow:auto;background:var(--kart)}
body.erp .erp-form .kt-bas{position:sticky;top:0;z-index:1;background:var(--erp-th);color:var(--erp-th-yazi);font-size:12px;font-weight:700;border-bottom:1px solid var(--erp-cizgi)}
body.erp .erp-form .kt-bas span{padding:4px 6px;border-right:1px solid var(--erp-cizgi)}
body.erp .erp-form .kt-satir{border-bottom:1px solid var(--erp-cizgi)}
body.erp .erp-form .kt-satir:last-child{border-bottom:1px solid var(--erp-cizgi)}

body.erp .erp-form .kt-satir .kt-no{display:flex;align-items:center;justify-content:center;background:var(--erp-th);color:var(--ikincil);font-size:11px}

body.erp .erp-form .kt-satir .kt-tutar{display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-weight:700}
body.erp .erp-form .kt-satir input::placeholder{color:transparent}
body.erp .erp-form .kt-bas+.kt-satir input::placeholder{color:var(--ucuncul)}

body.erp .erp-form .ff-sag{grid-column:2;grid-row:1}

body.erp .erp-form #toplamlar .hucre .deger{color:var(--yazi);font-variant-numeric:tabular-nums}
body.erp .erp-form #toplamlar .hucre:last-child{background:var(--erp-th);min-height:36px!important}
body.erp .erp-form #toplamlar .hucre:last-child .tutar{font-size:18px}
body.erp .erp-form .tutar-kutu{display:flex;align-items:center;gap:8px;padding:5px 8px!important;margin:0 0 8px!important;border:1px solid var(--erp-cizgi)!important;border-radius:0!important;box-shadow:none!important;background:var(--kart)!important;text-align:left}
body.erp .erp-form .tutar-kutu small{width:140px;flex:none;font-size:12.5px;color:var(--ikincil);margin:0}
body.erp .erp-form .tutar-kutu input{flex:none;width:260px;height:32px;font-size:20px!important;font-weight:700;text-align:right!important;border:1px solid var(--erp-cizgi)!important;border-radius:2px;background:var(--erp-giris)!important;padding:0 8px!important;margin:0}
body.erp .erp-form #mSerbest .yuzen{display:none}
@media (max-width:1180px){body.erp .erp-form .ff-alt{grid-template-columns:minmax(0,1fr) 320px}}

const BORDRO = {

/* Tek ayın bordrosu. kum: yılbaşından önceki ayların gelir vergisi matrahı toplamı; gun: SGK gün sayısı (eksik günler düşülmüş). */
function bordroAy(brut, ay, kum = 0, gun = 30, tesvik = D.bordroAyar.tesvik) {
  const P = bordroParam(+ay.slice(0, 4)), aySira = +ay.slice(5, 7);
  const sgkMatrah = Math.min(brut, Math.round(P.asgari * P.tavanKat * gun / 30));

  const au = Math.round(P.asgari * gun / 30), auMatrah = au - Math.round(au * (P.sgkIsci + P.issizIsci) / 100);

    : `<button class="nav-btn menu-btn" id="menuBtn" aria-label="Menü">${ikon('menu')}</button>`;

    <button class="hucre eylem kareli" id="hEkle">${kare('arti', 'mavi')}<div class="ic"><b>Yeni hesap ekle</b></div></button>
</div>
    <p class="dipnot">Her hesap ayrı bir firma defteridir. Kayıtlar, cariler, faturalar ve personel hesaplar arasında karışmaz.</p>
    ${H.liste.length > 1 ? `<div class="grup"><button class="hucre kareli" id="hTasi">${kare('donustur', 'turuncu')}<div class="ic"><b>Kayıtları başka hesaba taşı</b><small>Yanlış hesaba girilmiş kayıtları ayırın</small></div>${CHEV}</button></div>` : ''}`;
  $('#icerik').innerHTML = h;
  $('#hEkle').onclick = hesapEkle;
  if ($('#hTasi')) $('#hTasi').onclick = kayitTasi;
  $$('[data-h]').forEach(b => b.onclick = async () => {
    const x = H.liste.find(y => y.id === b.dataset.h);
    const s = await eylemSayfa(hesapAdi(x), null, [...(x.id !== H.aktif ? [{ad: 'Bu hesaba geç', deger: 'gec'}] : []), {ad: 'Adını değiştir', deger: 'ad'}, ...(H.liste.length > 1 ? [{ad: 'Hesabı sil', deger: 'sil', tehlike: true}] : [])]);
    if (s === 'gec') hesabaGec(x.id);
    else if (s === 'ad') {
      const m = modal('Hesap adı', `<div class="grup"><label class="f-satir sol"><input type="text" id="hAd" value="${esc(x.ad)}" placeholder="Hesap adı"></label></div>`, {kaydet: () => {
        const ad = $('#hAd', m).value.trim();
        if (x.id === H.aktif) { D.ad = ad; kaydet(); }
        else { x.ad = ad; try { const d = JSON.parse(localStorage.getItem(veriAnahtari(x.id))); d.ad = ad; localStorage.setItem(veriAnahtari(x.id), JSON.stringify(d)); } catch (e) {} hesapKaydet(); }
        setTimeout(ciz, 10);
      }});
      setTimeout(() => $('#hAd', m).focus(), 320);
    } else if (s === 'sil') {
      if (!await onay(`${hesapAdi(x)} silinsin mi?`, 'Bu hesabın tüm kayıtları kalıcı olarak silinir. Önce yedek almanız önerilir.', 'Hesabı sil')) return;
      localStorage.removeItem(veriAnahtari(x.id));
      if (ortak()?.hesap === x.id) { ortakYaz(null); localStorage.removeItem(IZ_ANAHTAR); $('#girisEkran')?.remove(); }
      H.liste = H.liste.filter(y => y.id !== x.id);
      if (x.id === H.aktif) return hesabaGec(H.liste[0].id);
      hesapKaydet(); bildir('Hesap silindi'); ciz();
    }
  });
}

/* Seçilen kayıtları (bağlı otomatik kayıtlarıyla birlikte) açık hesaptan başka bir hesaba taşır */
async function kayitTasi() {
  const hedefId = await eylemSayfa('Hangi hesaba taşınsın?', `Kaynak: ${hesapAdi(H.liste.find(x => x.id === H.aktif))}`, H.liste.filter(x => x.id !== H.aktif).map(x => ({ad: hesapAdi(x), deger: x.id})));
  if (!hedefId) return;
  let hedef;
  try { hedef = duzelt(JSON.parse(localStorage.getItem(veriAnahtari(hedefId)) || 'null') || yeniDurum()); } catch (e) { hedef = yeniDurum(); }
  const serbest = D.islemler.filter(i => !i.kaynak && !i.hareketId).sort(islemSirala);
  const bolumler = [
    ['islem', 'Gelir / gider kayıtları', serbest.map(i => ({id: i.id, ad: i.aciklama || i.kategori, alt: `${tarihYaz(i.tarih, true)} · ${i.kategori}`, sag: (i.tur === 'gelir' ? '+' : '−') + para(i.tutar), simge: i.tur === 'gelir' ? 'giris' : 'cikis', renk: i.tur === 'gelir' ? 'yesil' : 'kirmizi'}))],
    ['kisi', 'Cariler (hareketleri ve faturalarıyla)', D.kisiler.map(k => ({id: k.id, ad: k.ad, alt: `${D.hareketler.filter(x => x.kisiId === k.id).length} hareket`, sag: para(kisiBakiye(k.id)), simge: 'defter', renk: 'turuncu'}))],
    ['fatura', 'Faturalar', D.faturalar.filter(f => !D.kisiler.length || true).map(f => ({id: f.id, ad: faturaMusteri(f), alt: `${faturaTurAd(f)} ${f.no}`, sag: para(faturaHesap(f).toplam), simge: 'dosya', renk: 'indigo'}))],
    ['personel', 'Personel (ödemeleri ve puantajıyla)', D.personeller.map(p => ({id: p.id, ad: p.ad, alt: p.gorev || 'Personel', sag: `${D.personelOdeme.filter(o => o.personelId === p.id).length} ödeme`, simge: 'kisiler', renk: 'camgobegi'}))],
    ['urun', 'Stok ürünleri (hareketleriyle)', D.urunler.map(u => ({id: u.id, ad: u.ad, alt: `${sayiFmt(urunMiktar(u.id))} ${u.birim}`, sag: '', simge: 'kutu', renk: 'kahve'}))]
  ].filter(([, , l]) => l.length);
  if (!bolumler.length) return bildir('Bu hesapta taşınacak kayıt yok', true);
  const m = modal(`${hesapAdi(H.liste.find(x => x.id === hedefId))} hesabına`, `
    <p class="dipnot" style="margin:0 4px 16px">Seçtiklerinizi işaretleyin. Faturaların, maaşların ve tahsilatların kasadaki otomatik kayıtları da birlikte taşınır.</p>
    ${bolumler.map(([tip, baslik, l]) => `<div class="bolum">${esc(baslik)}<button data-hepsi="${tip}">Tümü</button></div>
      <div class="grup">${l.map(x => `<label class="hucre kareli secim"><input type="checkbox" data-tip="${tip}" value="${x.id}">${kare(x.simge, x.renk)}<div class="ic"><b>${esc(x.ad)}</b><small>${esc(x.alt)}</small></div><span class="deger">${esc(x.sag)}</span><span class="tik"></span></label>`).join('')}</div>`).join('')}`,
    {kaydet: () => {
      const sec = tip => $$(`input[data-tip=${tip}]:checked`, m).map(c => c.value);
      const n = tasi(hedef, {islem: sec('islem'), kisi: sec('kisi'), fatura: sec('fatura'), personel: sec('personel'), urun: sec('urun')});
      if (!n) { bildir('Kayıt seçin', true); return false; }
      localStorage.setItem(veriAnahtari(hedefId), JSON.stringify(hedef));
      kaydet(); bildir(`${n} kayıt taşındı`); setTimeout(ciz, 10);
    }, kaydetAd: 'Taşı', tam: true});
  $$('[data-hepsi]', m).forEach(b => b.onclick = () => { const l = $$(`input[data-tip=${b.dataset.hepsi}]`, m); const hepsi = l.every(c => c.checked); l.forEach(c => c.checked = !hepsi); });
}
function tasi(hedef, sec) {
  let n = 0;
  const al = (dizi, kosul) => { const t = D[dizi].filter(kosul); if (t.length) { D[dizi] = D[dizi].filter(x => !kosul(x)); hedef[dizi].push(...t); } return t; };
  const kopyala = (dizi, id) => { if (id && !hedef[dizi].some(x => x.id === id)) { const x = D[dizi].find(y => y.id === id); if (x) hedef[dizi].push(JSON.parse(JSON.stringify(x))); } };
  const turetilen = id => { al('islemler', i => i.kaynak?.id === id); al('hareketler', h => h.kaynak?.id === id); al('stokHareket', x => x.kaynak?.id === id); };
  const faturaTasi = f => { for (const k of f.kalemler) kopyala('urunler', k.urunId); if (f.kisiId && !sec.kisi.includes(f.kisiId)) kopyala('kisiler', f.kisiId); al('faturalar', x => x.id === f.id); turetilen(f.id); n++; };
  for (const id of sec.kisi) {
    const hr = D.hareketler.filter(h => h.kisiId === id && !h.kaynak);
    al('islemler', i => hr.some(h => h.id === i.hareketId));
    al('hareketler', h => h.kisiId === id && !h.kaynak);
    for (const f of D.faturalar.filter(f => f.kisiId === id)) faturaTasi(f);
    al('kisiler', k => k.id === id); n++;
  }
  for (const id of sec.fatura) { const f = D.faturalar.find(x => x.id === id); if (f) faturaTasi(f); }
  for (const id of sec.personel) {
    const od = D.personelOdeme.filter(o => o.personelId === id).map(o => o.id);
    al('islemler', i => i.kaynak?.tip === 'personel' && (od.includes(i.kaynak.id) || i.kaynak.ust === id));
    al('personelOdeme', o => o.personelId === id);
    for (const a in D.puantaj) if (D.puantaj[a][id]) { (hedef.puantaj[a] ||= {})[id] = D.puantaj[a][id]; delete D.puantaj[a][id]; }
    al('personeller', p => p.id === id); n++;
  }
  for (const id of sec.urun) {
    al('islemler', i => i.kaynak?.tip === 'stok' && i.kaynak.ust === id);
    al('stokHareket', x => x.urunId === id && !x.kaynak);
    al('urunler', u => u.id === id); n++;
  }
  n += al('islemler', i => sec.islem.includes(i.id)).length;
  return n;
}

  if (ac('fatura')) yeni.push(['fatura', 'dosya', 'indigo', 'Satış faturası'], ['alis', 'giris', 'turuncu', 'Alış faturası']);

  if (yeni.length) h += `<div class="yeni-satir">${yeni.map(([id, sm, rk, ad]) => `<button data-h="${id}" style="--c:var(--${rk})">${ikon(sm)}${esc(ad)}</button>`).join('')}</div>`;

  // 2.9.8: Bekleyenler. Tek bakışta açık işler, teklifler, alacak ve borçlar (telefonda 3, geniş ekranda 6 kutu yan yana)
  const acikSatis = D.faturalar.filter(f => f.tur === 'fatura' && f.durum === 'gonderildi' && !f.odendi);
  const acikAlis = D.faturalar.filter(f => f.tur === 'alis' && f.durum === 'gonderildi' && !f.odendi);
  const kutu = (yol, sm, renk, deger, ad, alt = '', uyar = false) => `<a class="bk-kutu${uyar ? ' uyar' : ''}" href="#/${yol}" style="--c:var(--${renk})"><span class="bk-ust">${ikon(sm)}<b>${deger}</b></span><span class="bk-ad">${esc(ad)}</span>${alt ? `<small>${esc(alt)}</small>` : ''}</a>`;

/* 2.14.2: cari silme; cari kartında, cari ekranında ve PC cari penceresinde (seçili satır) kullanılır */

    for (const i of D.islemler) if (i.hareketId && D.hareketler.some(h => h.kisiId === k.id && h.id === i.hareketId)) {

    D.kisiler = D.kisiler.filter(y => y.id !== k.id);
    for (const f of D.faturalar) if (f.kisiId === k.id) { f.musteriAd = f.musteriAd || k.ad; f.kisiId = null; }
    for (const y of D.servisler) if (y.kisiId === k.id) { y.musteriAd = y.musteriAd || k.ad; y.kisiId = null; }
    for (const e of D.ekipmanlar) if (e.kisiId === k.id) e.kisiId = null;

const BIRIMLER = ['adet','takım','set','çift','paket','kutu','koli','kg','gr','ton','lt','ml','m','cm','m²','m³','saat','gün','ay','sefer'];

function urunMiktar(id) {
  let n = 0;
  for (const s of D.stokHareket) if (s.urunId === id) n += s.tur === 'giris' ? s.miktar : -s.miktar;
  return Math.round(n * 1000) / 1000;

/* Ağırlıklı ortalama maliyet: fiyatlı girişlerden, çıkışlar ortalamayı değiştirmez. Giriş yoksa kartın alış fiyatı. */
function urunMaliyet(u) {
  let n = 0, deger = 0;
  for (const s of D.stokHareket.filter(x => x.urunId === u.id).sort((a, b) => a.tarih.localeCompare(b.tarih) || (a.olusturma || 0) - (b.olusturma || 0))) {
    if (s.tur === 'giris') {
      if (s.birimFiyat > 0 && !s.sayim) { const ort = n > 0 ? deger / n : 0; deger = Math.max(0, n) * ort + s.miktar * s.birimFiyat; n = Math.max(0, n) + s.miktar; }
      else { const ort = n > 0 ? deger / n : (u.alis || 0); n += s.miktar; deger = Math.max(0, n) * ort; }
    } else { const ort = n > 0 ? deger / n : 0; n -= s.miktar; deger = Math.max(0, n) * ort; }
  }
  return n > 0 && deger > 0 ? Math.round(deger / n) : (u.alis || 0);
}

}
/* Sayım: sayılan miktar ile kayıttaki stok arasındaki farkı sayım hareketi olarak yazar. */
function stokSayimFormu(liste) {
  liste = liste || stokFiltrele();
  if (!liste.length) { bildir('Sayılacak ürün yok', true); return; }
  const m = modal('Stok sayımı', `<p class="dipnot" style="margin:0 4px 12px">Sayılan miktarı girin. Boş bırakılan ürünler değişmez; fark sayım hareketi olarak yazılır.</p>
    <div class="grup"><label class="f-satir"><span>Sayım tarihi</span><input type="date" id="syTarih" value="${bugun()}"></label></div>
    <div class="grup">${liste.map(u => `<label class="f-satir"><span style="flex:1;min-width:0"><b style="font-weight:600">${esc(u.ad)}</b><br><small class="soluk">${esc([u.kod, u.raf && 'Raf ' + u.raf].filter(Boolean).join(' · '))} · kayıtta ${sayiFmt(urunMiktar(u.id))} ${esc(u.birim)}</small></span><input data-sy="${u.id}" inputmode="decimal" placeholder="—" style="max-width:90px"></label>`).join('')}</div>`,
    {kaydet: () => {
      const tarih = $('#syTarih', m).value || bugun();
      let n = 0;
      $$('[data-sy]', m).forEach(i => {
        const v = sayiOku(i.value); if (i.value.trim() === '' || !isFinite(v) || v < 0) return;
        const u = urun(i.dataset.sy), fark = Math.round((v - urunMiktar(u.id)) * 1000) / 1000;
        if (!fark) return;
        D.stokHareket.push({id: kimlik(), urunId: u.id, tur: fark > 0 ? 'giris' : 'cikis', miktar: Math.abs(fark), birimFiyat: urunMaliyet(u), tarih, aciklama: `Sayım farkı (sayılan ${sayiFmt(v)})`, sayim: true, olusturma: Date.now()});
        n++;
      });
      kaydet(); bildir(n ? `${n} üründe sayım farkı işlendi` : 'Fark yok'); setTimeout(ciz, 10);
    }, kaydetAd: 'Sayımı kaydet'});
}
function stokListeKagit(siparis) {
  const l = siparis ? D.urunler.filter(u => u.kritik > 0 && urunMiktar(u.id) <= u.kritik).sort((a, b) => (a.kategori || '').localeCompare(b.kategori || '', 'tr') || a.ad.localeCompare(b.ad, 'tr'))
    : stokFiltrele().sort((a, b) => (a.kategori || '').localeCompare(b.kategori || '', 'tr') || a.ad.localeCompare(b.ad, 'tr'));
  let top = 0;
  const satir = l.map(u => { const n = urunMiktar(u.id), mal = urunMaliyet(u), d = Math.round(Math.max(0, n) * mal); top += d;
    const oner = Math.max(u.siparisMiktar || 0, Math.ceil(u.kritik * 2 - n));
    const ted = u.tedarikciId && kisi(u.tedarikciId);
    return siparis ? `<tr><td>${esc(u.kod || '')}</td><td>${esc(u.ad)}${u.marka ? ' · ' + esc(u.marka) : ''}</td><td>${esc(ted?.ad || '')}</td><td class="sg">${sayiFmt(n)} ${esc(u.birim)}</td><td class="sg">${sayiFmt(u.kritik)}</td><td class="sg"><b>${sayiFmt(oner)}</b></td></tr>`
      : `<tr><td>${esc(u.kod || '')}</td><td>${esc(u.ad)}${u.marka ? ' · ' + esc(u.marka) : ''}</td><td>${esc(u.raf || '')}</td><td class="sg">${sayiFmt(n)} ${esc(u.birim)}</td><td class="sg">${para(mal)}</td><td class="sg">${para(d)}</td></tr>`; }).join('');
  return `<div class="kagit">${firmaBaslik(siparis ? 'SİPARİŞ LİSTESİ' : 'STOK LİSTESİ', `${l.length} ürün<br>Hazırlanma: ${esc(tarihYaz(bugun(), true))}`)}
    <table style="font-size:11px"><thead><tr>${siparis ? '<th>Parça no</th><th>Ürün</th><th>Tedarikçi</th><th class="sg">Stok</th><th class="sg">Kritik</th><th class="sg">Önerilen</th>' : '<th>Parça no</th><th>Ürün</th><th>Raf</th><th class="sg">Stok</th><th class="sg">Ort. maliyet</th><th class="sg">Değer</th>'}</tr></thead>
    <tbody>${satir || '<tr><td colspan="6">Ürün yok</td></tr>'}${siparis ? '' : `<tr class="top"><td colspan="5">Toplam stok değeri</td><td class="sg">${para(top)}</td></tr>`}</tbody></table></div>`;
}

    <div class="tutar-kutu"><small>Miktar (${esc(u.birim)})</small><input id="sMiktar" class="tutar-giris" inputmode="decimal" placeholder="0" autocomplete="off"></div>

      <label class="f-satir sol"><input type="text" id="sSeri" placeholder="Seri no (varsa; birden çoksa virgülle)"></label>
    </div>
    ${kasa ? `<div class="grup"><label class="f-satir"><span style="flex:1">${giris ? 'Kasaya gider yaz' : 'Kasaya satış geliri yaz'}</span>${anahtar('sKasa', !giris)}</label></div>
    <p class="dipnot">Kasaya KDV dahil tutar yazılır (%${oran}).</p>` : ''}`, {kaydet: () => {
      const miktar = sayiOku($('#sMiktar', m).value);
      if (!(miktar > 0)) { bildir('Miktar girin', true); return false; }
      const fiyat = tutarOku($('#sFiyat', m).value) || 0;
      const s = {id: kimlik(), urunId: u.id, tur, miktar, birimFiyat: fiyat, tarih: $('#sTarih', m).value || bugun(), aciklama: $('#sAcik', m).value.trim(), olusturma: Date.now()};

      if (kasa && $('#sKasa', m).checked && fiyat) {
        const tutar = Math.round(miktar * fiyat * (1 + oran / 100));
        s.islemId = islemOlustur({tur: giris ? 'gider' : 'gelir', tutar, tarih: s.tarih,
          kategori: giris ? kategoriBul(T().giderKat, /mal|hammadde|alım/i, 'Mal alımı') : 'Satış',
          aciklama: `${u.ad} ${sayiFmt(miktar)} ${u.birim}${s.aciklama ? ' · ' + s.aciklama : ''}`,
          kdvOran: oran, kdv: kdvAyir(tutar, oran), kaynak: {tip: 'stok', id: s.id, ust: u.id}}).id;
      }
      D.stokHareket.push(s);
      kaydet(); bildir(giris ? 'Giriş eklendi' : 'Çıkış eklendi');
      setTimeout(ciz, 10);
    }, kaydetAd: 'Ekle'});
  const hesapla = () => { $('#sToplam', m).textContent = para(Math.round((sayiOku($('#sMiktar', m).value) || 0) * (tutarOku($('#sFiyat', m).value) || 0))); };
  $('#sMiktar', m).oninput = hesapla; $('#sFiyat', m).oninput = hesapla;
  setTimeout(() => $('#sMiktar', m).focus(), 320);
}

/* ================= Fatura / Teklif ================= */
/* Satır tutarı: miktar × fiyat, varsa satır iskontosu (%) düşülür. KDV iskontolu tutar üzerinden hesaplanır. */
const kalemBrut = k => Math.round((k.miktar || 0) * (k.fiyat || 0));

/* ================= Banka, kasa ve kartlar =================
   Her gelir/gider kaydı bir hesaba işlenir (hesapId). Hesap seçilmemiş eski kayıtlar ödeme şekline göre
   varsayılan hesaba sayılır: nakit → kasa, havale → banka, kartla gelir → POS, kartla gider → kredi kartı.
   Hesaplar arası para aktarımı (virman, kart borcu ödemesi) gelir/gider değildir, ayrı tutulur. */
const HESAP_TUR = {
  kasa: {ad: 'Nakit kasa', cogul: 'Kasalar', simge: 'para', renk: 'yesil', odeme: 'nakit'},
  banka: {ad: 'Banka hesabı', cogul: 'Banka hesapları', simge: 'banka', renk: 'mavi', odeme: 'havale'},
  kart: {ad: 'Kredi kartı', cogul: 'Kredi kartları', simge: 'kart', renk: 'turuncu', odeme: 'kart'},
  pos: {ad: 'POS / sanal POS', cogul: 'POS hesapları', simge: 'kart', renk: 'nane', odeme: 'kart'}
};
const finansHesap = id => D.finansHesap.find(h => h.id === id);
const aktifHesaplar = () => D.finansHesap.filter(h => h.aktif !== false);
const hesapAcikMi = () => modulAcik('banka') && aktifHesaplar().length > 0;
function varsayilanHesapId(odeme = 'nakit', tur = 'gider') {
  const tip = odeme === 'nakit' ? 'kasa' : odeme === 'havale' ? 'banka' : tur === 'gelir' ? 'pos' : 'kart';
  const l = aktifHesaplar(), v = D.finansAyar.varsayilan[tip];
  if (v && l.some(h => h.id === v)) return v;
  return (l.find(h => h.tur === tip) || (tip === 'pos' && l.find(h => h.tur === 'banka')) || (tip === 'kart' && l.find(h => h.tur === 'banka')) || l.find(h => h.tur !== 'kart') || l[0] || {}).id || null;
}
const islemHesapId = i => i.hesapId || (D.finansHesap.length ? varsayilanHesapId(i.odeme || 'nakit', i.tur) : null);
const finHesapAdi = id => { const h = finansHesap(id); return h ? h.ad : ''; };
function hesapHareketleri(h) {
  const l = [], bas = h.acilisTarih || '';
  for (const i of D.islemler) if (i.tarih >= bas && islemHesapId(i) === h.id)
    l.push({tarih: i.tarih, olusturma: i.olusturma || 0, tutar: i.tur === 'gelir' ? i.tutar : -i.tutar, ad: i.aciklama || i.kategori, alt: i.kategori, islem: i});
  for (const v of D.virmanlar) {
    if (v.kaynak === h.id && v.tarih >= bas) l.push({tarih: v.tarih, olusturma: v.olusturma || 0, tutar: -v.tutar, ad: (finansHesap(v.hedef)?.tur === 'kart' ? 'Kart ödemesi · ' : 'Virman → ') + finHesapAdi(v.hedef), alt: v.aciklama, virman: v});
    if (v.hedef === h.id && v.tarih >= bas) l.push({tarih: v.tarih, olusturma: v.olusturma || 0, tutar: v.tutar, ad: (h.tur === 'kart' ? 'Kart ödemesi · ' : 'Virman ← ') + finHesapAdi(v.kaynak), alt: v.aciklama, virman: v});
  }
  return l.sort((a, b) => a.tarih.localeCompare(b.tarih) || a.olusturma - b.olusturma);
}
const hesapBakiye = h => (h.acilis || 0) + hesapHareketleri(h).reduce((s, x) => s + x.tutar, 0);
function finansOzet() {
  let varlik = 0, kartBorc = 0;

/* Kredi kartının bir sonraki son ödeme tarihi */

    const g = l.filter(h => h.tur === t); return g.length ? `<optgroup label="${esc(ht.cogul)}">${g.map(h => `<option value="${h.id}" ${h.id === sec ? 'selected' : ''}>${esc(h.ad)}</option>`).join('')}</optgroup>` : ''; }).join('')}</select></label></div>`;

function virmanFormu(v, on = {}) {

  if (!x.hedef) x.hedef = (l.find(h => h.id !== x.kaynak && h.tur !== 'kart') || l.find(h => h.id !== x.kaynak)).id;
  if (yeni && on.hedef && finansHesap(on.hedef)?.tur === 'kart') x.tutar = Math.max(0, -hesapBakiye(finansHesap(on.hedef)));

  const m = modal(yeni ? (finansHesap(x.hedef)?.tur === 'kart' && on.hedef ? 'Kart borcu öde' : 'Virman') : 'Virmanı düzenle', `
    <div class="tutar-kutu"><small>Tutar</small><input id="vTutar" class="tutar-giris" inputmode="decimal" placeholder="0 ₺" value="${tutarYaz(x.tutar)}" autocomplete="off"></div>
    <div class="grup">
      <label class="f-satir"><span>Çıkan hesap</span>${sec('vKaynak', x.kaynak)}</label>
      <label class="f-satir"><span>Giren hesap</span>${sec('vHedef', x.hedef)}</label>
      <label class="f-satir"><span>Tarih</span><input type="date" id="vTarih" value="${x.tarih}"></label>
      <label class="f-satir sol"><input type="text" id="vAcik" value="${esc(x.aciklama)}" placeholder="Açıklama (isteğe bağlı)"></label>
    </div>
    <p class="dipnot">Virman gelir ya da gider değildir; yalnızca hesap bakiyelerini değiştirir. Kredi kartına yapılan virman kart borcunu azaltır.</p>
    ${yeni ? '' : `<div class="grup"><button class="hucre tehlike" id="vSil">Virmanı sil</button></div>`}`, {kaydet: () => {
      const tutar = tutarOku($('#vTutar', m).value);

      if (yeni) { kayit.id = kimlik(); kayit.olusturma = Date.now(); D.virmanlar.push(kayit); }
      else D.virmanlar[D.virmanlar.findIndex(y => y.id === x.id)] = kayit;
      kaydet(); bildir(yeni ? 'Virman kaydedildi' : 'Güncellendi'); setTimeout(ciz, 10);
    }, kaydetAd: yeni ? 'Aktar' : 'Kaydet'});
  if (yeni && !x.tutar) setTimeout(() => $('#vTutar', m).focus(), 320);
  if (!yeni) $('#vSil', m).onclick = async () => {
    if (!await onay('Virman silinsin mi?', `${para(x.tutar)} · ${finHesapAdi(x.kaynak)} → ${finHesapAdi(x.hedef)}`)) return;
    D.virmanlar = D.virmanlar.filter(y => y.id !== x.id); kaydet(); bildir('Silindi'); kapat(); setTimeout(ciz, 10);
  };
}
function finansHesapEkrani(id) {
  const fh = finansHesap(id);
  if (!fh) return git('banka', true);
  const ht = HESAP_TUR[fh.tur], kart = fh.tur === 'kart', b = hesapBakiye(fh);
  let h = sayfa(fh.ad, {geri: 'banka', geriAd: modulAdi('banka'), sag: `<button class="nav-btn" id="fhDuzenle">Düzenle</button>`});
  const har = hesapHareketleri(fh), ay = bugun().slice(0, 7);
  let kal = fh.acilis || 0;
  const satirlar = har.map(x => { kal += x.tutar; return {...x, kal}; }).reverse();
  const buAy = har.filter(x => x.tarih.startsWith(ay)), giren = buAy.filter(x => x.tutar > 0).reduce((s, x) => s + x.tutar, 0), cikan = buAy.filter(x => x.tutar < 0).reduce((s, x) => s - x.tutar, 0);
  const so = kart && kartSonOdeme(fh), g = so ? gunFark(so) : null;
  h += `<div class="kart" style="text-align:center">${kare(ht.simge, ht.renk, 'buyuk')}
      <div class="k-ust" style="margin-top:8px">${kart ? 'Güncel kart borcu' : 'Bakiye'}</div>
      <div class="dev ${kart ? (-b > 0 ? 'gider' : '') : b < 0 ? 'gider' : ''}">${para(kart ? Math.max(0, -b) : b)}</div>
      ${kart && fh.limit ? `<div class="k-alt">Kullanılabilir limit ${para(fh.limit + b)}</div>` : ''}
      ${so && -b > 0 ? `<div class="k-alt ${g <= 3 ? 'gider' : ''}">Son ödeme ${esc(tarihYaz(so, true))} · ${g === 0 ? 'bugün' : g + ' gün kaldı'}</div>` : ''}
      <div class="fo-alt" style="margin-top:12px;text-align:left"><div><small>Bu ay giren</small><b class="gelir">${para(giren)}</b></div><div style="text-align:right"><small>Bu ay çıkan</small><b>${para(cikan)}</b></div></div></div>
    <div class="btn-izgara"><button id="fhGelir">${ikon('arti')}${kart ? 'İade' : 'Para girişi'}</button><button id="fhGider">${ikon('eksi')}${kart ? 'Harcama' : 'Para çıkışı'}</button>
      ${aktifHesaplar().length > 1 ? `<button id="fhVirman">${ikon('donustur')}${kart ? 'Borç öde' : 'Virman'}</button>` : ''}<button id="fhEkstre">${ikon('yazici')}Ekstre</button></div>
    <div class="grup">
      <div class="hucre"><div class="ic"><b>Tür</b></div><span class="deger">${esc(ht.ad)}</span></div>
      ${fh.banka ? `<div class="hucre"><div class="ic"><b>Banka</b></div><span class="deger">${esc([fh.banka, fh.sube].filter(Boolean).join(' · '))}</span></div>` : ''}
      ${fh.iban ? `<button class="hucre" id="fhIban"><div class="ic"><b>IBAN</b><small>${esc(fh.iban)}</small></div><span class="deger">Kopyala</span></button>` : ''}
      ${kart && fh.kartNo ? `<div class="hucre"><div class="ic"><b>Kart</b></div><span class="deger">•••• ${esc(fh.kartNo)}</span></div>` : ''}
      ${kart && fh.kesimGunu ? `<div class="hucre"><div class="ic"><b>Kesim / son ödeme</b></div><span class="deger">Her ayın ${fh.kesimGunu}. / ${fh.sonOdemeGunu || '—'}. günü</span></div>` : ''}
      <div class="hucre"><div class="ic"><b>${kart ? 'Açılış borcu' : 'Açılış bakiyesi'}</b><small>${fh.acilisTarih ? esc(tarihYaz(fh.acilisTarih, true)) : 'tüm kayıtlar'}</small></div><span class="deger">${para(Math.abs(fh.acilis || 0))}</span></div>
    </div>
    <div class="bolum">Hareketler</div>
    ${satirlar.length ? `<div class="grup">${satirlar.slice(0, 150).map(x => `<button class="hucre kareli" ${x.islem ? `data-islem="${x.islem.id}"` : `data-virman="${x.virman.id}"`}>${x.virman ? kare('donustur', 'mavi') : kare(...kategoriSimge(x.islem.kategori, x.islem.tur))}
        <div class="ic"><b>${esc(x.ad)}</b><small>${esc([tarihYaz(x.tarih, true), x.virman ? x.alt : x.islem.aciklama ? x.alt : ''].filter(Boolean).join(' · '))}</small></div>
        <span class="tutar ${x.tutar > 0 ? 'gelir' : ''}">${x.tutar > 0 ? '+' : '−'}${para(Math.abs(x.tutar))}<small>${para(kart ? -x.kal : x.kal)}</small></span></button>`).join('')}</div>`
      : bosDurum(ht.simge, ht.renk, 'Hareket yok', 'Bu hesaba işlenen gelir, gider ve virmanlar burada görünür.')}`;
  $('#icerik').innerHTML = h;
  $('#fhDuzenle').onclick = () => finansHesapFormu(fh);
  $('#fhGelir').onclick = () => islemFormu(null, 'gelir', fh.id);
  $('#fhGider').onclick = () => islemFormu(null, 'gider', fh.id);
  if ($('#fhVirman')) $('#fhVirman').onclick = () => virmanFormu(null, kart ? {hedef: fh.id} : {kaynak: fh.id});
  if ($('#fhIban')) $('#fhIban').onclick = () => { try { navigator.clipboard.writeText(fh.iban.replace(/\s/g, '')); bildir('IBAN kopyalandı'); } catch (e) {} };

function hesapEkstreKagit(fh) {

  return `<div class="kagit">${firmaBaslik(kart ? 'KREDİ KARTI EKSTRESİ' : 'HESAP EKSTRESİ', `${esc(fh.ad)}${fh.iban ? '<br>' + esc(fh.iban) : ''}<br>Hazırlanma: ${esc(tarihYaz(bugun(), true))}`)}
    <div class="kutular"><div><small>${kart ? 'Açılış borcu' : 'Açılış'}</small><b>${para(Math.abs(fh.acilis || 0))}</b></div><div><small>Giren</small><b>${para(gi)}</b></div><div><small>Çıkan</small><b>${para(ci)}</b></div><div><small>${kart ? 'Güncel borç' : 'Bakiye'}</small><b>${para(kart ? -kal : kal)}</b></div></div>
    <table style="font-size:11px"><thead><tr><th>Tarih</th><th>Açıklama</th><th class="sg">Giren</th><th class="sg">Çıkan</th><th class="sg">${kart ? 'Borç' : 'Bakiye'}</th></tr></thead><tbody>${satir || '<tr><td colspan="5">Hareket yok</td></tr>'}</tbody></table></div>`;
}

/* --- Bakım takibi: çalışma saatine ve süreye göre periyodik bakım planı ---

const BAKIM_UYARI_GUN = 30, BAKIM_UYARI_SAAT = 50;
function ekipmanServisleri(e) { return D.servisler.filter(s => s.ekipmanId === e.id && s.durum !== 'iptal').sort((a, b) => a.tarih.localeCompare(b.tarih)); }
function bakimDurumu(e) {
  const ss = ekipmanServisleri(e), tamam = ss.filter(s => s.durum === 'tamam');

  // Günlük kullanım: saat okuması olan ilk ve son kayıt (makine kartındaki güncel saat bugüne sayılır)

  if (e.saat > 0) okuma.push([e.saatTarih || ss[ss.length - 1]?.tarih || bugun(), +e.saat]);

  const simdi = Math.max(+e.saat || 0, ...okuma.map(o => o[1]));

/* ================= 2.12: Döviz (TCMB kuru), döviz teklif ve döviz cari ================= */
/* Kur her cihazda ayrı tutulur (ortak veritabanına yazılmaz); belgeye kaydedilen kur belgeyle birlikte saklanır.
   Android ve Windows programında kur, uygulamanın kendi bağlantısıyla TCMB'den (today.xml, döviz satış) alınır. */
const KUR_ANAHTAR = 'powerserv.kurlar';

const DOVIZ_AD = {TL: 'Türk lirası', USD: 'ABD doları', EUR: 'Euro', GBP: 'İngiliz sterlini'};
const kurlar = () => { try { return JSON.parse(localStorage.getItem(KUR_ANAHTAR)) || null; } catch (e) { return null; } };
const kurAl = d => d === 'TL' ? 1 : +(kurlar()?.[d]?.satis) || 0;

const dovizPara = (v, d = 'TL') => d === 'TL' ? para(v) : ((v || 0) < 0 ? '−' : '') + DOVIZ_SIMGE[d] + tutarFmt(Math.abs(v || 0));

const teklifTL = f => { const t = faturaHesap(f).toplam; return fDoviz(f) === 'TL' ? t : Math.round(t * teklifKur(f)); };
function kurCozumle(xml) {

  for (const d of ['USD', 'EUR', 'GBP']) {

    const s = parseFloat(c.querySelector('ForexSelling')?.textContent), a = parseFloat(c.querySelector('ForexBuying')?.textContent);

let kurBekleyen = null;

async function kurXml() {

function kurOzet() { const k = kurlar(); return k ? ['USD', 'EUR', 'GBP'].filter(d => k[d]).map(d => `${d} ${kurYaz(k[d].satis)}`).join(' · ') + ` (${k.kaynak === 'TCMB' ? 'TCMB' : 'elle'} ${tarihYaz(k.tarih || bugun(), true)})` : 'Henüz alınmadı'; }

/* Döviz teklif faturaya dönüşürken fiyatlar teklifteki kurla TL'ye çevrilir; döviz bilgisi faturada ve carisinde saklanır */
function dovizdenTL(y) {

const GUNLUK_ANAHTAR = 'powerserv.gunlukYedek';
const gunlukYedekVar = () => !!((window.PowerServ && PowerServ.gunlukYedek) || (window.Android && Android.gunlukYedekYaz));
const gunlukDurum = () => { try { return JSON.parse(localStorage.getItem(GUNLUK_ANAHTAR)) || {}; } catch (e) { return {}; } };
const GUN_ADI = ['pazar', 'pazartesi', 'sali', 'carsamba', 'persembe', 'cuma', 'cumartesi'];
let gunlukZaman = 0;
async function gunlukYedekAl(zorla) {
  if (!gunlukYedekVar() || !D || !D.profil) { if (zorla) bildir('Günlük otomatik yedek Windows ve Android uygulamasında çalışır', true); return; }
  const d = gunlukDurum(), gun = bugun();
  if (!zorla && d.tarih === gun) return;
  let yer = '';
  try {
    const icerik = JSON.stringify(tumYedek());
    yer = window.PowerServ && PowerServ.gunlukYedek ? await PowerServ.gunlukYedek(`powerserv-yedek-${gun}.json`, icerik)
      : Android.gunlukYedekYaz(`powerserv-gunluk-yedek-${GUN_ADI[tarihNesne(gun).getDay()]}.json`, icerik);
  } catch (e) { console.warn(e); yer = ''; }
  const y = yer ? {tarih: gun, zaman: Date.now(), yer} : {...d, hata: Date.now()};
  try { localStorage.setItem(GUNLUK_ANAHTAR, JSON.stringify(y)); } catch (e) {}
  if (zorla) bildir(yer ? 'Yedek alındı: ' + yer : 'Yedek alınamadı', !yer);
  if (zorla && rota()[0] === 'ayarlar') ayarlarEkrani();
}
window.gunlukPlanla = () => { if (!gunlukYedekVar() || gunlukDurum().tarih === bugun()) return; clearTimeout(gunlukZaman); gunlukZaman = setTimeout(gunlukYedekAl, 8000); };

/* Masaüstü (Windows) bildirimleri: telefondaki hatırlatmalar bilgisayarda da Windows bildirimi olarak gösterilir */
const GOSTERILEN_ANAHTAR = 'powerserv.gosterilen';
function masaustuBildirimleri() {
  if (!window.PowerServ || !('Notification' in window) || !bildirimAcik() || Notification.permission === 'denied') return;
  if (Notification.permission !== 'granted') { Notification.requestPermission().then(p => { if (p === 'granted') masaustuBildirimleri(); }); return; }
  let g; try { g = JSON.parse(localStorage.getItem(GOSTERILEN_ANAHTAR)) || {}; } catch (e) { g = {}; }
  const b = bugun(), l = hatirlaticilar().filter(h => h.gun <= b && !g[h.id]);
  for (const k of Object.keys(g)) if (g[k] < tarihStr(new Date(Date.now() - 40 * 864e5))) delete g[k];
  const goster = (baslik, metin, yol) => { try { const n = new Notification(baslik, {body: metin}); n.onclick = () => { window.focus(); if (yol) bildirimAc(yol); }; } catch (e) {} };
  if (l.length > 4) goster(`PowerServ+ · ${l.length} hatırlatma`, l.slice(0, 4).map(h => h.baslik + ': ' + h.metin).join('\n'), 'panel');
  else for (const h of l) goster(h.baslik, h.metin, h.yol);
  for (const h of l) g[h.id] = b;
  try { localStorage.setItem(GOSTERILEN_ANAHTAR, JSON.stringify(g)); } catch (e) {}
}

function ekipmanSec(kisiId, fn) {
  const liste = D.ekipmanlar.filter(e => !kisiId || e.kisiId === kisiId);

}

/* Yeni servis kaydının başlangıç hâli (telefondaki form ve masaüstü fişi aynı yapıyı kullanır) */
function yeniServisKaydi(on = {}) {
  const x = {no: sonrakiServisNo(), isEmriNo: sonrakiIsEmriNo(), teklifRef: musteriSonTeklif(on.kisiId)?.no || '', tarih: bugun(), kisiId: on.kisiId || null, musteriAd: '', yetkili: '', tel: '', eposta: '',
    ekipmanId: on.ekipmanId || null, tekne: '', liman: '', servisYeri: '', calismaSaati: 0, turler: [], sikayet: '', islemler: '', parcalar: [], iscilik: [],
    teslim: '', testler: [], testSure: '', sonrakiBakim: '', sonrakiBakimSaat: '', oneriler: '', durum: 'acik', stokDus: true};
  if (x.kisiId) { const k = kisi(x.kisiId); if (k) { x.tel = k.tel || ''; x.eposta = k.eposta || ''; x.yetkili = k.yetkili || ''; } }
  if (x.ekipmanId) { const e = ekipman(x.ekipmanId); if (e) { x.tekne = e.tekne; x.liman = e.liman; x.calismaSaati = e.saat || 0; } }
  return x;
}
