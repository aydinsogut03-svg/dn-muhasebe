function faturaFormu(f, tur = 'fatura', kisiId = null) {
  const yeni = !f;
  const x = f ? JSON.parse(JSON.stringify(f)) : {tur, no: sonrakiNo(tur), tarih: bugun(), vade: '', kisiId, musteriAd: '', kalemler: [yeniKalem(D.profil === 'bireysel' ? 0 : 20)], not: '', durum: 'gonderildi', odendi: false, odemeler: [], cariyeIsle: true, stokDus: true};
  const ver = modulAcik('veresiye'), stok = modulAcik('stok');
  const teklif = x.tur === 'teklif', alisF = x.tur === 'alis';
  if (yeni && alisF) x.no = '';
  const m = modal(yeni ? (teklif ? 'Yeni teklif' : alisF ? 'Alış faturası' : 'Yeni fatura') : (teklif ? 'Teklifi düzenle' : 'Faturayı düzenle'), `
    <div class="bolum">${alisF ? 'Satıcı (tedarikçi)' : 'Müşteri'}</div>
    <div class="grup">
      ${ver ? `<button class="hucre" id="mSec"><div class="ic"><b id="mAd">${esc(x.kisiId ? kisi(x.kisiId)?.ad : alisF ? 'Kayıtlı cari seç' : 'Kayıtlı müşteri seç')}</b></div>${CHEV}</button>` : ''}
      <label class="f-satir sol ${x.kisiId ? 'gizli' : ''}" id="mSerbest"><input type="text" id="mMusteri" value="${esc(x.musteriAd)}" placeholder="${alisF ? (ver ? 'veya satıcı adı yazın' : 'Satıcı adı') : ver ? 'veya müşteri adı yazın' : 'Müşteri adı'}"></label>
    </div>
    <div class="grup">
      <label class="f-satir"><span>${teklif ? 'Teklif no' : 'Fatura no'}</span><input type="text" id="fNo" value="${esc(x.no)}" placeholder="${alisF ? 'Satıcının fatura no' : ''}"></label>
      <label class="f-satir"><span>Tarih</span><input type="date" id="fTarih" value="${x.tarih}"></label>
      <label class="f-satir"><span>${teklif ? 'Geçerlilik' : 'Vade'}</span><input type="date" id="fVade" value="${x.vade || ''}"></label>
    </div>
    <div class="bolum">Kalemler</div>
    <div id="kalemler"></div>
    <div class="btn-grup">${stok && D.urunler.length ? `<button class="btn renkli" id="stoktanEkle">${ikon('kutu')} Stoktan</button>` : ''}<button class="btn renkli" id="kalemEkle">${ikon('arti')} Kalem ekle</button></div>
    <div class="grup" id="toplamlar"></div>
    <div class="grup"><label class="f-satir sol"><textarea id="fNot" placeholder="Not (ödeme koşulları vb.)">${esc(x.not)}</textarea></label></div>
    ${!teklif ? `<div class="grup">
      ${ver ? `<label class="f-satir" id="cariSatir"><span style="flex:1">${alisF ? 'Cari hesaba alacak yaz' : 'Cari hesaba borç yaz'}</span>${anahtar('fCari', x.cariyeIsle)}</label>` : ''}
      ${stok ? `<label class="f-satir"><span style="flex:1">${alisF ? 'Stoğa ekle' : 'Stoktan düş'}</span>${anahtar('fStok', x.stokDus)}</label>` : ''}
      <label class="f-satir"><span style="flex:1">Taslak olarak sakla</span>${anahtar('fTaslak', x.durum === 'taslak')}</label>
    </div><p class="dipnot">Taslak faturalar cariye, stoğa ve KDV hesabına yansımaz.</p>` : ''}`,
    {kaydet: kaydetF, kaydetAd: yeni ? 'Oluştur' : 'Kaydet', tam: true});
  const cariGoster = () => { const c = $('#cariSatir', m); if (c) c.classList.toggle('gizli', !x.kisiId); };
  cariGoster();
  const toplamCiz = () => {
    const t = faturaHesap(x);
    $('#toplamlar', m).innerHTML = `<div class="hucre"><div class="ic"><b>Ara toplam</b></div><span class="deger sayi">${para(t.ara)}</span></div>
      ${Object.entries(t.oranlar).map(([o, v]) => `<div class="hucre"><div class="ic"><b>KDV %${o}</b></div><span class="deger sayi">${para(v)}</span></div>`).join('')}
      <div class="hucre"><div class="ic"><b class="k">Genel toplam</b></div><span class="tutar" style="font-weight:700">${para(t.toplam)}</span></div>`;
  };
  const kalemCiz = () => {
    $('#kalemler', m).innerHTML = x.kalemler.map((k, i) => `<div class="kalem" data-k="${i}">
      <label class="f-satir sol"><input type="text" data-a="ad" value="${esc(k.ad)}" placeholder="Ürün / hizmet"></label>
      <div class="f-satir"><input data-a="miktar" inputmode="decimal" value="${k.miktar ? sayiFmt(k.miktar) : ''}" placeholder="Miktar" style="text-align:left;flex:0 0 22%"><span class="soluk" style="flex:none;min-width:0;margin-right:auto">${esc(k.birim || 'adet')} ×</span><input data-a="fiyat" inputmode="decimal" value="${tutarYaz(k.fiyat)}" placeholder="Birim fiyat ₺"></div>
      <div class="kalem-alt"><div class="kdv-sec">${KDV_ORAN.map(o => `<button type="button" data-kdv="${o}" class="${(k.kdv || 0) === o ? 'secili' : ''}">%${o}</button>`).join('')}</div>
        <span class="sayi" data-tutar>${para(Math.round((k.miktar || 0) * (k.fiyat || 0)))}</span>${x.kalemler.length > 1 ? `<button type="button" data-sil>Sil</button>` : ''}</div></div>`).join('');
    $$('.kalem', m).forEach(el => {
      const k = x.kalemler[+el.dataset.k];
      $$('input[data-a]', el).forEach(inp => inp.oninput = () => {
        const a = inp.dataset.a;
        if (a === 'ad') k.ad = inp.value;
        else if (a === 'miktar') k.miktar = sayiOku(inp.value) || 0;
        else k.fiyat = tutarOku(inp.value) || 0;
        $('[data-tutar]', el).textContent = para(Math.round((k.miktar || 0) * (k.fiyat || 0)));
        toplamCiz();
      });
      $$('[data-kdv]', el).forEach(b => b.onclick = () => { k.kdv = +b.dataset.kdv; $$('[data-kdv]', el).forEach(y => y.classList.toggle('secili', y === b)); toplamCiz(); });
      const s = $('[data-sil]', el); if (s) s.onclick = () => { x.kalemler.splice(+el.dataset.k, 1); kalemCiz(); };
    });
    toplamCiz();
  };
  kalemCiz();
  $('#kalemEkle', m).onclick = () => { x.kalemler.push(yeniKalem(x.kalemler[x.kalemler.length - 1]?.kdv ?? 20)); kalemCiz(); $$('.kalem input[data-a=ad]', m).pop().focus(); };
  if ($('#stoktanEkle', m)) $('#stoktanEkle', m).onclick = () => urunSec(u => {
    const kalem = {ad: u.ad, urunId: u.id, miktar: 1, birim: u.birim, fiyat: alisF ? (u.alis || 0) : u.satis, kdv: u.kdvOran ?? 20};
    const bos = x.kalemler.length === 1 && !x.kalemler[0].ad && !x.kalemler[0].fiyat;
    if (bos) x.kalemler[0] = kalem; else x.kalemler.push(kalem);
    kalemCiz();
  });
  if ($('#mSec', m)) $('#mSec', m).onclick = () => kisiSec(k => {
    x.kisiId = k ? k.id : null;
    $('#mAd', m).textContent = k ? k.ad : alisF ? 'Kayıtlı cari seç' : 'Kayıtlı müşteri seç';
    $('#mSerbest', m).classList.toggle('gizli', !!k);
    cariGoster();
  });
  function kaydetF() {
    x.kalemler = x.kalemler.filter(k => k.ad.trim() || k.fiyat);
    if (!x.kalemler.length) { bildir('En az bir kalem girin', true); x.kalemler.push(yeniKalem()); kalemCiz(); return false; }
    x.musteriAd = x.kisiId ? '' : $('#mMusteri', m).value.trim();
    x.no = $('#fNo', m).value.trim() || sonrakiNo(x.tur);
    x.tarih = $('#fTarih', m).value || bugun();
    x.vade = $('#fVade', m).value;
    x.not = $('#fNot', m).value.trim();
    if (!teklif) {
      if ($('#fCari', m)) x.cariyeIsle = $('#fCari', m).checked;
      if ($('#fStok', m)) x.stokDus = $('#fStok', m).checked;
      if (x.durum !== 'iptal') x.durum = $('#fTaslak', m).checked ? 'taslak' : 'gonderildi';
    }
    if (yeni) { x.id = kimlik(); x.olusturma = Date.now(); D.faturalar.push(x); }
    else D.faturalar[D.faturalar.findIndex(y => y.id === x.id)] = x;
    faturaTuret(x);
    kaydet(); bildir(yeni ? (teklif ? 'Teklif oluşturuldu' : alisF ? 'Alış faturası kaydedildi' : 'Fatura oluşturuldu') : 'Kaydedildi');
    setTimeout(() => git('fatura/' + x.id, !yeni), 10);
  }
}
function urunSec(fn) {
  const liste = [...D.urunler].sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
  const m = modal('Ürün seç', `<div class="arama">${ikon('ara')}<input type="search" id="usAra" placeholder="Ara"></div><div id="usListe"></div>`);
  const doldur = () => {
    const a = kucult($('#usAra', m).value.trim());
    const l = liste.filter(u => !a || kucult(u.ad + ' ' + (u.kod || '')).includes(a));
    $('#usListe', m).innerHTML = l.length ? `<div class="grup">${l.map(u => `<button class="hucre avatarli" data-us="${u.id}"><span class="avatar r-kahve">${ikon('kutu')}</span><div class="ic"><b>${esc(u.ad)}</b><small>Stok ${sayiFmt(urunMiktar(u.id))} ${esc(u.birim)}</small></div><span class="deger">${para(u.satis)}</span></button>`).join('')}</div>` : '<p class="soluk" style="text-align:center">Ürün yok</p>';
    $$('[data-us]', m).forEach(b => b.onclick = () => { kapat(); fn(urun(b.dataset.us)); });
  };
  doldur();
  $('#usAra', m).oninput = doldur;
}
/* Faturanın cari, stok ve kasa etkilerini baştan oluşturur */
function faturaTuret(f) {
  turetilenleriSil(f.id);
  odemeDurumu(f);
  if (!faturaliMi(f)) return;
  if (f.tur === 'alis') return alisTuret(f);
  const t = faturaHesap(f), kaynak = {tip: 'fatura', id: f.id}, ad = `Fatura ${f.no}`;
  const cari = f.kisiId && f.cariyeIsle && modulAcik('veresiye') && kisi(f.kisiId);
  if (f.stokDus && modulAcik('stok')) for (const k of f.kalemler) if (k.urunId && urun(k.urunId))
    D.stokHareket.push({id: kimlik(), urunId: k.urunId, tur: 'cikis', miktar: k.miktar, birimFiyat: k.fiyat, tarih: f.tarih, aciklama: `${ad} · ${faturaMusteri(f)}`, kaynak, olusturma: Date.now()});
  if (cari) D.hareketler.push({id: kimlik(), kisiId: f.kisiId, tur: 'borc', tutar: t.toplam, tarih: f.tarih, aciklama: ad, kaynak, olusturma: Date.now()});
  odemeTuret(f, cari, ad, kaynak);
}
/* Her ödeme için cariye tahsilat/ödeme hareketi ve kasaya gelir/gider yazar */
function odemeTuret(f, cari, ad, kaynak) {
  const alis = f.tur === 'alis';
  f.odemeler.forEach((o, n) => {
    let hr;
    const aciklama = `${ad} ${f.odemeler.length > 1 ? (n + 1) + '. ödeme' : 'ödemesi'}`;
    if (cari) { hr = {id: kimlik(), kisiId: f.kisiId, tur: alis ? 'odeme' : 'tahsilat', tutar: o.tutar, tarih: o.tarih, aciklama, kaynak, olusturma: Date.now() + 1 + n}; D.hareketler.push(hr); }
    if (modulAcik('kasa')) {
      const i = islemOlustur({tur: alis ? 'gider' : 'gelir', tutar: o.tutar, kategori: alis ? kategoriBul(T().giderKat, /mal|alım|hammadde/i, 'Diğer') : cari ? 'Tahsilat' : 'Satış', tarih: o.tarih, odeme: o.odeme || 'havale',
        aciklama: `${ad} · ${faturaMusteri(f)}`, kdvOran: 0, kdv: 0, kaynak, ...(hr ? {hareketId: hr.id} : {})});
      if (hr) hr.islemId = i.id;
    }
  });
}
/* Alış faturası: stoğa giriş, cariye alacak (biz borçluyuz), ödenince kasaya gider */
function alisTuret(f) {
  const t = faturaHesap(f), kaynak = {tip: 'fatura', id: f.id}, ad = `Alış faturası ${f.no}`;
  const cari = f.kisiId && f.cariyeIsle && modulAcik('veresiye') && kisi(f.kisiId);
  if (f.stokDus && modulAcik('stok')) for (const k of f.kalemler) if (k.urunId && urun(k.urunId))
    D.stokHareket.push({id: kimlik(), urunId: k.urunId, tur: 'giris', miktar: k.miktar, birimFiyat: k.fiyat, tarih: f.tarih, aciklama: `${ad} · ${faturaMusteri(f)}`, kaynak, olusturma: Date.now()});
  if (cari) D.hareketler.push({id: kimlik(), kisiId: f.kisiId, tur: 'alis', tutar: t.toplam, tarih: f.tarih, aciklama: ad, kaynak, olusturma: Date.now()});
  odemeTuret(f, cari, ad, kaynak);
}
/* Faturaya (kısmi) tahsilat ya da ödeme ekler */
function odemeFormu(f) {
  const alis = f.tur === 'alis', kalan = faturaKalan(f);
  const m = modal(alis ? 'Ödeme yap' : 'Tahsil et', `
    <p class="dipnot" style="margin:0 4px 12px">${esc(faturaMusteri(f))} · ${esc(f.no)} · kalan <b>${para(kalan)}</b></p>
    <div class="tutar-kutu"><small>Tutar</small><input id="oTutar" class="tutar-giris" inputmode="decimal" value="${tutarYaz(kalan)}" autocomplete="off"></div>
    <div class="grup"><label class="f-satir"><span>Tarih</span><input type="date" id="oTarih" value="${bugun()}"></label></div>
    <div class="bolum">Ödeme şekli</div>
    <div class="segment">${Object.entries(odemeAdi).map(([v, a]) => `<label><input type="radio" name="oOdeme" value="${v}" ${v === 'havale' ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div>
    <p class="dipnot">${modulAcik('kasa') ? (alis ? 'Kasaya gider, cariye ödeme olarak işlenir.' : 'Kasaya gelir, cariye tahsilat olarak işlenir.') : 'Faturanın kalan tutarından düşülür.'} Kısmi tutar girebilirsiniz.</p>`,
    {kaydet: () => {
      const tutar = tutarOku($('#oTutar', m).value);
      if (!(tutar > 0)) { bildir('Geçerli bir tutar girin', true); return false; }
      if (tutar > kalan) { bildir('Tutar kalan borçtan büyük olamaz: ' + para(kalan), true); return false; }
      f.odemeler.push({id: kimlik(), tarih: $('#oTarih', m).value || bugun(), tutar, odeme: $('input[name=oOdeme]:checked', m).value});
      faturaTuret(f); kaydet();
      bildir(f.odendi ? (alis ? 'Fatura tamamen ödendi' : 'Fatura tamamen tahsil edildi') : `Kalan ${para(faturaKalan(f))}`);
      setTimeout(ciz, 10);
    }, kaydetAd: 'Kaydet'});
}
/* Cariden tahsilat: tutarı açık faturalara en eski vadeden başlayarak dağıtır, artanı cariye serbest tahsilat yazar */
function cariTahsilat(k) {
  const acik = D.faturalar.filter(f => f.kisiId === k.id && f.tur === 'fatura' && faturaliMi(f) && faturaKalan(f) > 0)
    .sort((a, b) => (a.vade || a.tarih).localeCompare(b.vade || b.tarih));
  if (!acik.length) return hareketFormu(k, null, 'tahsilat');
  const topKalan = acik.reduce((s, f) => s + faturaKalan(f), 0);
  const m = modal('Tahsilat', `
    <div class="tutar-kutu"><small>Alınan tutar</small><input id="cTutar" class="tutar-giris" inputmode="decimal" value="${tutarYaz(topKalan)}" autocomplete="off"></div>
    <div class="grup"><label class="f-satir"><span>Tarih</span><input type="date" id="cTarih" value="${bugun()}"></label></div>
    <div class="bolum">Ödeme şekli</div>
    <div class="segment">${Object.entries(odemeAdi).map(([v, a]) => `<label><input type="radio" name="cOdeme" value="${v}" ${v === 'havale' ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div>
    <div class="bolum">Faturalara dağılım</div><div class="grup" id="cDagilim"></div>
    <p class="dipnot">Tutar en eski vadeli faturadan başlayarak kapatılır. Artan kısım cariye serbest tahsilat olarak yazılır.</p>`,
    {kaydet: () => {
      const tutar = tutarOku($('#cTutar', m).value);
      if (!(tutar > 0)) { bildir('Geçerli bir tutar girin', true); return false; }
      const tarih = $('#cTarih', m).value || bugun(), odeme = $('input[name=cOdeme]:checked', m).value;
      let kal = tutar, n = 0;
      for (const f of acik) { if (!kal) break; const p = Math.min(kal, faturaKalan(f)); f.odemeler.push({id: kimlik(), tarih, tutar: p, odeme}); faturaTuret(f); kal -= p; n++; }
      if (kal > 0) {
        const hr = {id: kimlik(), kisiId: k.id, tur: 'tahsilat', tutar: kal, tarih, aciklama: 'Fazla tahsilat', olusturma: Date.now()};
        if (modulAcik('kasa')) hr.islemId = islemOlustur({tur: 'gelir', tutar: kal, kategori: 'Tahsilat', tarih, odeme, aciklama: k.ad + ' · fazla tahsilat', hareketId: hr.id}).id;
        D.hareketler.push(hr);
      }
      kaydet(); bildir(`${para(tutar)} tahsil edildi · ${n} fatura`); setTimeout(ciz, 10);
    }, kaydetAd: 'Tahsil et'});
  const dagit = () => {
    let kal = tutarOku($('#cTutar', m).value) || 0;
    $('#cDagilim', m).innerHTML = acik.map(f => { const kf = faturaKalan(f), p = Math.max(0, Math.min(kal, kf)); kal -= p;
      return `<div class="hucre"><div class="ic"><b>${esc(f.no)}</b><small>${f.vade ? 'Vade ' + esc(tarihYaz(f.vade, true)) : esc(tarihYaz(f.tarih, true))} · kalan ${para(kf)}</small></div><span class="tutar ${p ? 'gelir' : 'soluk'}">${p ? para(p) : '—'}<small>${p >= kf ? 'kapanır' : p ? 'kısmi' : ''}</small></span></div>`; }).join('')
      + (kal > 0 ? `<div class="hucre"><div class="ic"><b>Serbest tahsilat</b><small>Faturaya bağlanmaz</small></div><span class="tutar gelir">${para(kal)}</span></div>` : '');
  };
  $('#cTutar', m).oninput = dagit; dagit();
}
/* Cari hesap ekstresi (PDF) */
function cariEkstre(k) {
  const har = D.hareketler.filter(x => x.kisiId === k.id).sort((a, c) => a.tarih.localeCompare(c.tarih) || (a.olusturma || 0) - (c.olusturma || 0));
  let b = 0, tb = 0, ta = 0;
  const satir = har.map(x => { const arti = hareketArti(x.tur); arti ? tb += x.tutar : ta += x.tutar; b += arti ? x.tutar : -x.tutar;
    return `<tr><td style="white-space:nowrap">${esc(tarihYaz(x.tarih, true))}</td><td>${esc(hareketAd(x.tur, T()))}${x.aciklama ? ' · ' + esc(x.aciklama) : ''}</td><td class="sg">${arti ? para(x.tutar) : ''}</td><td class="sg">${arti ? '' : para(x.tutar)}</td><td class="sg">${para(b)}</td></tr>`; }).join('');
  return `<div class="kagit">${firmaBaslik('CARİ HESAP EKSTRESİ', `${esc(k.ad)}${k.tel ? '<br>' + esc(k.tel) : ''}<br>Hazırlanma: ${esc(tarihYaz(bugun(), true))}`)}
    <div class="kutular"><div><small>Toplam borç</small><b>${para(tb)}</b></div><div><small>Toplam alacak</small><b>${para(ta)}</b></div><div><small>Bakiye</small><b>${para(Math.abs(b))} ${b > 0 ? '(B)' : b < 0 ? '(A)' : ''}</b></div></div>
    <table style="font-size:11px"><thead><tr><th>Tarih</th><th>Açıklama</th><th class="sg">Borç</th><th class="sg">Alacak</th><th class="sg">Bakiye</th></tr></thead><tbody>${satir || '<tr><td colspan="5">Hareket yok</td></tr>'}</tbody></table>
    <div class="gri" style="margin-top:12px">(B) cari bize borçlu, (A) biz cariye borçluyuz.</div></div>`;
}
function faturaKagit(f) {
  const t = faturaHesap(f), F = D.firma, k = f.kisiId && kisi(f.kisiId);
  return `<div class="kagit">
    <div class="ust"><div><h3>${faturaTurAd(f).toLocaleUpperCase('tr-TR')}</h3><div class="gri">No: ${esc(f.no)}<br>Tarih: ${esc(tarihYaz(f.tarih, true))}${f.vade ? `<br>${f.tur === 'teklif' ? 'Geçerlilik' : 'Vade'}: ${esc(tarihYaz(f.vade, true))}` : ''}</div></div>
      <div style="text-align:right"><b>${esc(D.ad || 'İşletme adı')}</b><div class="gri">${[F.adres, F.vd && 'V.D.: ' + F.vd, F.vno && 'V.No: ' + F.vno, F.tel, F.eposta].filter(Boolean).map(esc).join('<br>')}</div></div></div>
    <div class="gri" style="margin-bottom:4px">${f.tur === 'alis' ? 'SATICI' : 'SAYIN'}</div><b>${esc(faturaMusteri(f))}</b>
    ${k ? `<div class="gri">${[k.adres, k.vno && 'V.No/TC: ' + k.vno, k.tel].filter(Boolean).map(esc).join('<br>')}</div>` : ''}
    <table><thead><tr><th>Açıklama</th><th class="sg">Miktar</th><th class="sg">Fiyat</th><th class="sg">KDV</th><th class="sg">Tutar</th></tr></thead><tbody>
      ${f.kalemler.map(x => `<tr><td>${esc(x.ad)}</td><td class="sg">${sayiFmt(x.miktar)} ${esc(x.birim || '')}</td><td class="sg">${para(x.fiyat)}</td><td class="sg">%${x.kdv || 0}</td><td class="sg">${para(Math.round(x.miktar * x.fiyat))}</td></tr>`).join('')}

}

function hedefFormu(g) {

    <div class="grup"><label class="f-satir sol"><input type="text" id="gAd" value="${esc(x.ad)}" placeholder="Hedef adı (örn. Tatil)"></label>
      <label class="f-satir"><span>Hedef tutar</span><input id="gHedef" inputmode="decimal" placeholder="0 ₺" value="${tutarYaz(x.hedef)}"></label>
      <label class="f-satir"><span>Biriken</span><input id="gBiriken" inputmode="decimal" placeholder="0 ₺" value="${tutarYaz(x.biriken)}"></label>

async function hedefIslem(g) {
  const s = await eylemSayfa(g.ad, `${para(g.biriken)} / ${para(g.hedef)}`, [{ad: 'Para ekle', deger: 'ekle'}, {ad: 'Para çek', deger: 'cek'}, {ad: 'Düzenle', deger: 'duzenle'}]);
  if (s === 'duzenle') return hedefFormu(g);
  if (!s) return;
  const m = modal(s === 'ekle' ? 'Para ekle' : 'Para çek', `<div class="tutar-kutu"><small>${esc(g.ad)}</small><input id="hdTutar" class="tutar-giris" inputmode="decimal" placeholder="0 ₺"></div>`, {kaydet: () => {
    const t = tutarOku($('#hdTutar', m).value);
    if (!(t > 0)) { bildir('Tutar girin', true); return false; }
    g.biriken = Math.max(0, g.biriken + (s === 'ekle' ? t : -t));
    kaydet(); bildir(g.biriken >= g.hedef ? 'Tebrikler, hedefe ulaştınız!' : 'Güncellendi'); setTimeout(ciz, 10);
  }, kaydetAd: 'Tamam'});
  setTimeout(() => $('#hdTutar', m).focus(), 320);
}

/* ================= KDV ve vergi takvimi ================= */
function kdvAy(ay) {
  const [bas, son] = ayAraligi(ay);
  let satisF = 0, alisF = 0, digerGelir = 0, digerGider = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) f.tur === 'alis' ? alisF += faturaHesap(f).kdv : satisF += faturaHesap(f).kdv;
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kdv && i.kaynak?.tip !== 'fatura') i.tur === 'gelir' ? digerGelir += i.kdv : digerGider += i.kdv;
  return {satisF, alisF, digerGelir, digerGider, hesaplanan: satisF + digerGelir, indirilecek: alisF + digerGider};
}
function kdvDevir(ay) {
  const tarihler = [...D.islemler.map(i => i.tarih), ...D.faturalar.map(f => f.tarih)].filter(Boolean).sort();
  let a = tarihler.length ? tarihler[0].slice(0, 7) : ay, devreden = 0;
  while (a < ay) {
    const k = kdvAy(a);
    const fark = k.hesaplanan - k.indirilecek - devreden;
    devreden = fark < 0 ? -fark : 0;
    a = ayKaydir(a, 1);
  }
  return devreden;
}
function vergiTakvimi(ay) {
  const m = +ay.slice(5, 7), y = +ay.slice(0, 4), onceki = ayAdi(ayKaydir(ay, -1)), son = `${ay}-${iki(ayinSonGunu(ay))}`;
  const l = [
    {tarih: `${ay}-26`, ad: 'Muhtasar ve prim hizmet beyannamesi', alt: onceki},
    {tarih: `${ay}-28`, ad: 'KDV beyannamesi ve ödemesi', alt: onceki},
    {tarih: son, ad: 'SGK prim ödemesi', alt: onceki},
    {tarih: son, ad: 'Ba-Bs formları', alt: onceki}
  ];
  if ([2, 5, 8, 11].includes(m)) l.push({tarih: `${ay}-17`, ad: 'Geçici vergi beyannamesi', alt: 'Önceki çeyrek'});
  if (m === 3) l.push({tarih: `${ay}-31`, ad: 'Yıllık gelir vergisi beyannamesi', alt: `${y - 1} yılı`});
  if (m === 4) l.push({tarih: `${ay}-30`, ad: 'Kurumlar vergisi beyannamesi', alt: `${y - 1} yılı`});
  if (m === 1 || m === 7) l.push({tarih: son, ad: 'Motorlu taşıtlar vergisi', alt: m === 1 ? '1. taksit' : '2. taksit'});
  if (m === 5 || m === 11) l.push({tarih: son, ad: 'Emlak vergisi', alt: m === 5 ? '1. taksit' : '2. taksit'});
  return l.sort((a, b) => a.tarih.localeCompare(b.tarih));
}
const vergiTuru = () => D.vergiAyar.tur || (D.profil === 'sirket' ? 'kurum' : 'sahis');
/* Dönem kârı (KDV hariç): kesilen ve alınan faturalar fatura tarihinde, faturasız kasa kayıtları kayıt tarihinde sayılır. */
function donemKar(bas, son) {
  let gelir = 0, gider = 0, satisF = 0, alisF = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) { const a = faturaHesap(f).ara; f.tur === 'alis' ? alisF += a : satisF += a; }
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kaynak?.tip !== 'fatura') { const t = i.tutar - (i.kdv || 0); i.tur === 'gelir' ? gelir += t : gider += t; }
  return {gelir: gelir + satisF, gider: gider + alisF, satisF, alisF, kar: gelir + satisF - gider - alisF};
}
function geciciVergiler(yil) {
  const kurum = vergiTuru() === 'kurum', oran = kurum ? 25 : 15;
  let odenen = 0;
  return [3, 6, 9].map((m, i) => {
    const k = donemKar(`${yil}-01-01`, `${yil}-${iki(m)}-${ayinSonGunu(`${yil}-${iki(m)}`)}`);
    const hesap = Math.max(0, Math.round(k.kar * oran / 100)), odenecek = Math.max(0, hesap - odenen);
    odenen += odenecek;
    return {donem: i + 1, son: `${yil}-${iki(m)}`, kar: k.kar, oran, hesap, odenecek, vade: `${yil}-${iki(m + 2)}-17`};
  });
}

/* Seçilen ayın faaliyetinden doğan ve ertesi ay ödenecek yükümlülükler */

    ${modulAcik('personel') ? '' : '<p class="dipnot">Personel modülünü açarsanız muhtasar ve SGK primleri bordrodan otomatik eklenir.</p>'}
    <div class="bolum">Bu ayın vergi takvimi</div>
    <div class="grup">${vergiTakvimi(ay).map(v => { const g = gunFark(v.tarih); return `<div class="hucre kareli">${kare('takvim', g < 0 ? 'gri' : g <= 7 ? 'kirmizi' : 'pembe')}

      <span class="deger" style="font-size:14px">${g < 0 ? 'geçti' : g === 0 ? 'bugün' : g + ' gün'}</span></div>`; }).join('')}</div>
    <p class="dipnot">Tutarlar kayıtlarınızdan hesaplanan tahminlerdir. Tarihler hafta sonu ve tatillerde kayabilir. Kesin beyan için mali müşavirinize danışın.</p>`;

}

/* PIN cihazda özetlenmiş olarak tutulur (dnmuhasebe.kilit). Uygulama açılışta ve arka plandan 30 sn sonra dönüşte kilitlenir. */
const KILIT_ANAHTAR = 'dnmuhasebe.kilit';
const pinOzet = (pin, tuz) => { let a = 0x811c9dc5, b = 0x1505; for (const c of tuz + ':' + pin + ':dn') { a = Math.imul(a ^ c.charCodeAt(0), 16777619) >>> 0; b = (Math.imul(b, 33) + c.charCodeAt(0)) >>> 0; } return a.toString(36) + b.toString(36); };
const kilitAyar = () => { try { return JSON.parse(localStorage.getItem(KILIT_ANAHTAR)); } catch (e) { return null; } };
let kilitli = false, arkaPlanZaman = 0;
/* Tuş takımlı tam ekran PIN girişi. iptal verilirse vazgeçilebilir; Promise girilen 4 haneyi döndürür. */
function pinEkrani(baslik, {iptal = false, alt = '', kontrol} = {}) {
  return new Promise(coz => {
    const el = document.createElement('div'); el.id = 'kilitEkran';
    el.innerHTML = `<div class="logo">DN</div><h3>${esc(baslik)}</h3><p id="pinAlt">${esc(alt)}</p><div class="pin-nokta">${'<i></i>'.repeat(4)}</div>
      <div class="tus-takim">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="bos" data-x="iptal">${iptal ? 'Vazgeç' : ''}</button><button data-n="0">0</button><button class="bos" data-x="sil">Sil</button></div>`;
    document.body.appendChild(el);
    let pin = '';
    const nokta = $('.pin-nokta', el);
    const goster = () => $$('i', nokta).forEach((i, k) => i.classList.toggle('dolu', k < pin.length));
    const bitir = v => { el.remove(); document.removeEventListener('keydown', el._tus); coz(v); };
    const bas = n => {
      if (pin.length >= 4) return;
      pin += n; goster();
      if (pin.length === 4) setTimeout(() => {
        if (!kontrol || kontrol(pin)) return bitir(pin);
        nokta.classList.add('salla'); $('#pinAlt', el).textContent = 'PIN yanlış';
        if (navigator.vibrate) navigator.vibrate(120);
        setTimeout(() => { nokta.classList.remove('salla'); pin = ''; goster(); }, 380);
      }, 120);
    };
    $$('[data-n]', el).forEach(b => b.onclick = () => bas(b.dataset.n));
    $('[data-x=sil]', el).onclick = () => { pin = pin.slice(0, -1); goster(); };
    $('[data-x=iptal]', el).onclick = () => { if (iptal) bitir(null); };
    el._tus = e => { if (/^\d$/.test(e.key)) bas(e.key); else if (e.key === 'Backspace') { pin = pin.slice(0, -1); goster(); } };
    document.addEventListener('keydown', el._tus);
  });
}
async function kilitle() {
  const k = kilitAyar();
  if (!k || kilitli) return;
  kilitli = true;
  document.activeElement?.blur();
  await pinEkrani('PIN girin', {alt: 'DN Muhasebe kilitli', kontrol: p => pinOzet(p, k.t) === k.o});
  kilitli = false;
}
async function pinKur() {
  const p1 = await pinEkrani('Yeni PIN', {iptal: true, alt: '4 haneli bir PIN belirleyin'});
  if (!p1) return false;
  const p2 = await pinEkrani('PIN\'i tekrar girin', {iptal: true, kontrol: p => p === p1});
  if (!p2) return false;
  const t = kimlik();
  localStorage.setItem(KILIT_ANAHTAR, JSON.stringify({t, o: pinOzet(p2, t)}));
  bildir('PIN kilidi açıldı');
  return true;
}
async function pinKaldir() {
  const k = kilitAyar();
  if (!k) return;
  const p = await pinEkrani('Mevcut PIN', {iptal: true, kontrol: p => pinOzet(p, k.t) === k.o});
  if (!p) return false;
  localStorage.removeItem(KILIT_ANAHTAR);
  bildir('PIN kilidi kapatıldı');
  return true;
}
window.arkaPlan = () => { arkaPlanZaman = Date.now(); if (bulutKirli) bulutYaz(); };
window.onPlan = () => { if (arkaPlanZaman && Date.now() - arkaPlanZaman > 30000) kilitle(); arkaPlanZaman = 0; };
document.addEventListener('visibilitychange', () => document.hidden ? window.arkaPlan() : window.onPlan());


/* ================= Bulut yedeği (Google Drive) =================
   Android'de kullanıcı bir kez yedek dosyası seçer (Drive, Dropbox ya da telefon klasörü). Her değişiklikten birkaç saniye
   sonra ve uygulama arka plana geçince TÜM hesapların yedeği o dosyanın üzerine yazılır; dosyayı Drive uygulaması eşitler. */
const BULUT_ANAHTAR = 'dnmuhasebe.bulut';
const bulutVar = () => !!(window.Android && Android.yedekYaz);
const bulutDurum = () => { try { return JSON.parse(localStorage.getItem(BULUT_ANAHTAR)) || {}; } catch (e) { return {}; } };
const bulutKonum = () => { try { const k = bulutVar() && Android.yedekBilgi(); return k ? JSON.parse(k) : null; } catch (e) { return null; } };
function tumYedek() {
  const veriler = {};
  for (const h of H.liste) { const v = h.id === H.aktif ? JSON.stringify(D) : localStorage.getItem(veriAnahtari(h.id)); if (v) veriler[h.id] = JSON.parse(v); }
  return {uygulama: 'dn-muhasebe', tur: 'tum', surum: VERSIYON, tarih: new Date().toISOString(), hesaplar: H, veriler};
}
let bulutZamanlayici = 0, bulutKirli = false;
function bulutYaz() {
  clearTimeout(bulutZamanlayici); bulutKirli = false;
  if (!bulutVar()) return null;
  let hata = '';
  try { hata = Android.yedekYaz(JSON.stringify(tumYedek())) || ''; } catch (e) { hata = String(e.message || e); }
  if (hata === 'yedek dosyası seçilmedi') return null;
  const d = {...bulutDurum(), ...(hata ? {hata, hataZaman: Date.now()} : {zaman: Date.now(), hata: ''})};
  try { localStorage.setItem(BULUT_ANAHTAR, JSON.stringify(d)); } catch (e) {}
  return hata;
}
window.bulutPlanla = () => {
  if (!bulutVar()) return;
  bulutKirli = true; clearTimeout(bulutZamanlayici);
  bulutZamanlayici = setTimeout(bulutYaz, 4000);
  hatirlaticiPlanla();
};
window.yedekKonumSecildi = k => {
  const h = bulutYaz();
  bildir(h ? 'Yedek dosyası seçildi ama yazılamadı: ' + h : `Yedek açıldı: ${k?.yer || 'seçilen konum'}`, !!h);
  if (rota()[0] === 'ayarlar') ayarlarEkrani();
};
async function tumYedektenYukle(j) {
  const n = Object.keys(j.veriler || {}).length;
  if (!await onay('Tüm hesaplar geri yüklensin mi?', `Yedekte ${n} hesap var (${tarihYaz(String(j.tarih).slice(0, 10), true)}). Bu telefondaki tüm hesapların yerine geçer.`, 'Geri yükle')) return;
  for (const h of H.liste) localStorage.removeItem(veriAnahtari(h.id));
  for (const [id, v] of Object.entries(j.veriler)) localStorage.setItem(veriAnahtari(id), JSON.stringify(v));
  H = j.hesaplar; if (!H.liste.some(h => h.id === H.aktif)) H.aktif = H.liste[0].id; hesapKaydet();
  bildir('Yedek geri yüklendi'); setTimeout(() => location.reload(), 600);
}

/* ================= Bildirimler =================
   Yaklaşan fatura vadeleri ve vergi günleri hesaplanıp Android'e verilir; telefon her sabah 09.00'da o günün bildirimlerini gösterir. */
const BILDIRIM_ANAHTAR = 'dnmuhasebe.bildirim';
const bildirimAcik = () => { try { return localStorage.getItem(BILDIRIM_ANAHTAR) !== 'kapali'; } catch (e) { return true; } };
const bildirimVar = () => !!(window.Android && Android.hatirlaticiKur);
function hatirlaticilar() {
  const l = [], bugunT = bugun(), sinir = (() => { const d = tarihNesne(bugunT); d.setDate(d.getDate() + 70); return tarihStr(d); })();
  const ekle = (gun, id, baslik, metin, yol) => { if (gun >= bugunT && gun <= sinir) l.push({gun, id, baslik, metin, yol}); };
  const gunOnce = (t, n) => { const d = tarihNesne(t); d.setDate(d.getDate() - n); return tarihStr(d); };
  const asil = D;
  try {
    for (const h of H.liste) {
      const v = h.id === H.aktif ? asil : (() => { try { return duzelt(JSON.parse(localStorage.getItem(veriAnahtari(h.id)))); } catch (e) { return null; } })();
      if (!v || !v.profil) continue;
      D = v;
      const hesap = H.liste.length > 1 ? ` · ${hesapAdi(h)}` : '';
      if (modulAcik('fatura')) for (const f of D.faturalar) if (faturaliMi(f) && !f.odendi && f.vade) {
        const alis = f.tur === 'alis', kalan = para(faturaKalan(f)), kim = faturaMusteri(f);
        ekle(gunOnce(f.vade, 3), `f3-${f.id}`, alis ? 'Ödeme yaklaşıyor' : 'Tahsilat yaklaşıyor', `${kim} · ${f.no} · ${kalan} · 3 gün sonra${hesap}`, `${h.id}|fatura/${f.id}`);
        ekle(f.vade, `f0-${f.id}`, alis ? 'Bugün ödenecek' : 'Bugün tahsil edilecek', `${kim} · ${f.no} · ${kalan}${hesap}`, `${h.id}|fatura/${f.id}`);
      }
      if (modulAcik('kdv')) for (let i = 0; i < 3; i++) for (const t of vergiTakvimi(ayKaydir(bugunT.slice(0, 7), i))) {
        ekle(gunOnce(t.tarih, 3), `v3-${h.id}-${t.tarih}-${t.ad}`, t.ad, `3 gün sonra son gün · ${t.alt}${hesap}`, `${h.id}|kdv`);
        ekle(t.tarih, `v0-${h.id}-${t.tarih}-${t.ad}`, t.ad, `Bugün son gün · ${t.alt}${hesap}`, `${h.id}|kdv`);
      }
    }
  } finally { D = asil; }
  return l.sort((a, b) => a.gun.localeCompare(b.gun));
}
let hatirlaticiZaman = 0;
function hatirlaticiPlanla() {
  if (!bildirimVar()) return;
  clearTimeout(hatirlaticiZaman);
  hatirlaticiZaman = setTimeout(() => { try { Android.hatirlaticiKur(JSON.stringify(bildirimAcik() ? hatirlaticilar() : [])); } catch (e) {} }, 1500);
}
/* Bildirime dokunulunca: "hesap|yol" biçiminde gelir; gerekirse hesaba geçip sayfayı açar */
window.bildirimAc = hedef => {
  const [id, yol] = String(hedef).split('|');
  if (id && id !== H.aktif && H.liste.some(h => h.id === id)) { H.aktif = id; hesapKaydet(); D = yukle(); ui = uiBaslangic(); }

};
