/* Servisten taslak fatura (2.10): fişteki fiyatlarla. Parçalar birim fiyat, KDV ve iskontosuyla (dövizli satır kurla TL'ye çevrilir),
   yapılan her işlem ayrı satır, dış servis ücretleri ayrı satır. Genel iskonto satır iskontolarına eklenir.
   Stok servisten düştüğü için faturada stok düşülmez. */
function servisFaturala(s) {
  const g = Math.min(100, Math.max(0, s.iskonto || 0));
  const isk = a => Math.round(100 * (1 - (1 - (a || 0) / 100) * (1 - g / 100)) * 100) / 100 || 0;
  const ik = s.iscilikKdv ?? 20, dovizli = [];
  const kalemler = s.parcalar.filter(p => p.durum !== 'musteri' || parcaFiyat(p)).map(p => {
    if (parcaDoviz(p) !== 'TL') dovizli.push(`${p.parcaNo || p.ad}: ${tutarFmt(parcaFiyat(p))} ${parcaDoviz(p)} × ${sayiFmt(parcaKur(p))}`);
    return {ad: p.ad || p.parcaNo, kod: p.parcaNo || '', miktar: p.adet || 1, birim: p.birim || 'adet', fiyat: Math.round(parcaFiyat(p) * parcaKur(p)), kdv: parcaKdv(p), iskonto: isk(p.isk)};
  });
  for (const w of s.iscilik) {
    if (islemDurum(w) !== 'yapildi') continue;
    const t = islemTutar(w), ad = [w.kod, w.is || `İşçilik · Servis ${s.no}`].filter(Boolean).join(' ');
    if (!t && !w.sure) continue;
    kalemler.push(w.tutar == null && w.sure ? {ad, miktar: w.sure, birim: 'saat', fiyat: islemUcret(w), kdv: ik, iskonto: isk(0)} : {ad, miktar: 1, birim: 'adet', fiyat: t, kdv: ik, iskonto: isk(0)});
  }
  for (const d of s.disServis || []) if (d.durum !== 'iptal' && d.tutar)
    kalemler.push({ad: 'Dış servis: ' + [d.firma, d.is].filter(Boolean).join(' · '), miktar: 1, birim: 'adet', fiyat: d.tutar, kdv: d.kdv ?? 20, iskonto: isk(0)});
  if (!kalemler.length) kalemler.push({ad: `Servis hizmeti · ${s.no}`, miktar: 1, birim: 'adet', fiyat: 0, kdv: 20});
  const f = {id: kimlik(), tur: 'fatura', no: sonrakiNo('fatura'), tarih: bugun(), vade: '', kisiId: s.kisiId, musteriAd: s.kisiId ? '' : servisMusteri(s), kalemler,
    not: `Servis form no: ${s.no}${s.isEmriNo ? ' · İş emri: ' + s.isEmriNo : ''}${s.tekne ? ' · Tekne: ' + s.tekne : ''}${dovizli.length ? '\nDöviz: ' + dovizli.join('; ') : ''}`,
    durum: 'taslak', odendi: false, odemeler: [], cariyeIsle: true, stokDus: false, servisId: s.id, olusturma: Date.now()};
  D.faturalar.push(f); s.faturaId = f.id;
  kaydet(); bildir('Taslak fatura oluşturuldu; fiyatları kontrol edip kesin');
  git('fatura/' + f.id);
}

/* ================= Masaüstü: klasik ERP düzeni (2.10) =================
   Bilgisayarda (Windows uygulaması ya da tarayıcı; geniş ekran ve fare) program klasik ticari yazılım gibi çalışır:
   - Üstte açık pencere sekmeleri: her açılan ekran bir sekme olur, Özet hep ilk sekmedir. Sekmeler program kapansa da kalır.
   - Servis fişi: araç çubuğu, sekmeler (Genel Bilgiler, Arıza, Servis İşlemleri, Dış Servis, Sonuç ve Teslim, Bağlantılar, Form),
     renkli İşlemler ızgarası (Yapılacak / Yapıldı / İptal), Personeller, stok Hareketleri ızgarası ve alt toplamlar.
   - Fiş, kaydedilene kadar ayrı bir taslakta düzenlenir; taslak bu bilgisayarda saklanır, program kapanınca kaybolmaz.
   - Ortak veritabanında fiş açıkken kayıt kilitlenir; başka cihazda değişirse uyarı çıkar.
   Telefonda (APK, dokunmatik ekran) eski ekranlar aynen kalır. Veri aynıdır: masaüstünün eklediği alanlar
   (fiyat, KDV, döviz, işlem durumu, personel, dış servis) telefonda düzenlenen kayıtta korunur. */
const masaustuMu = () => !window.Android && !dokunmatik() && window.innerWidth >= 1000;
const kopya = o => JSON.parse(JSON.stringify(o));
const tutarFmt = k => ((k || 0) / 100).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});

/* --- Servis fişi hesapları. Tutarlar kuruş; dövizli satırda fiyat döviz cinsindendir, kur ile TL'ye çevrilir. --- */
const DOVIZLER = ['TL', 'USD', 'EUR', 'GBP'];
const ISLEM_DURUM = {yapilacak: 'Yapılacak', yapildi: 'Yapıldı', iptal: 'İptal'};
const DIS_DURUM = {gonderildi: 'Gönderildi', dondu: 'Döndü', iptal: 'İptal'};
const islemDurum = w => ISLEM_DURUM[w.durum] ? w.durum : 'yapildi';
const islemUcret = w => w.ucret ?? (D.servisAyar.saatUcret || 0);
const islemTutar = w => islemDurum(w) === 'iptal' ? 0 : w.tutar ?? Math.round((w.sure || 0) * islemUcret(w));
const parcaUrun = p => p.urunId ? urun(p.urunId) : null;
const parcaFiyat = p => p.fiyat ?? (p.durum === 'musteri' ? 0 : parcaUrun(p)?.satis || 0);
const parcaKdv = p => p.kdv ?? parcaUrun(p)?.kdvOran ?? 20;
const parcaDoviz = p => DOVIZLER.includes(p.doviz) ? p.doviz : 'TL';
const parcaKur = p => parcaDoviz(p) === 'TL' ? 1 : p.kur || 0;
const parcaDovizTutar = p => (p.adet || 0) * parcaFiyat(p) * (1 - Math.min(100, p.isk || 0) / 100);
const parcaTutar = p => Math.round(parcaDovizTutar(p) * parcaKur(p));
function servisHesap(s) {
  const satir = [], doviz = {};
  let parca = 0, iscilik = 0, dis = 0;
  for (const p of s.parcalar || []) {
    const t = parcaTutar(p), d = parcaDoviz(p);
    parca += t; satir.push([t, parcaKdv(p)]);
    if (d !== 'TL') { const o = (doviz[d] ||= {tutar: 0, tl: 0}); o.tutar += parcaDovizTutar(p); o.tl += t; }
  }
  const ik = s.iscilikKdv ?? 20;
  for (const w of s.iscilik || []) { const t = islemTutar(w); iscilik += t; satir.push([t, ik]); }
  for (const d of s.disServis || []) if (d.durum !== 'iptal') { const t = d.tutar || 0; dis += t; satir.push([t, d.kdv ?? 20]); }
  const ara = parca + iscilik + dis, g = Math.min(100, Math.max(0, s.iskonto || 0)), iskonto = Math.round(ara * g / 100);
  const oranlar = {};
  let kdv = 0;
  for (const [t, o] of satir) {
    if (!t) continue;
    const m = Math.round(t * (1 - g / 100)), k = Math.round(m * o / 100);
    kdv += k; const r = (oranlar[o] ||= {matrah: 0, kdv: 0}); r.matrah += m; r.kdv += k;
  }
  return {parca, iscilik, dis, ara, iskonto, iskontoOran: g, net: ara - iskonto, kdv, oranlar, toplam: ara - iskonto + kdv, doviz, saat: iscilikSaat(s)};
}
/* Teknisyen adları: personel kartları + daha önce fişlere yazılan adlar (servis yetkilisi personel kartlarını göremez) */
function teknisyenAdlari() {
  const s = new Set(D.personeller.filter(p => p.aktif !== false).map(p => p.ad));
  for (const x of D.servisler) { for (const a of x.personeller || []) s.add(a); for (const w of x.iscilik || []) if (w.teknisyen) s.add(w.teknisyen); }
  return [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, 'tr'));
}

const KAYIT_KOLEKSIYON = {servis: 'servisler', veresiye: 'kisiler', stok: 'urunler', fatura: 'faturalar', teklif: 'faturalar', banka: 'finansHesap', personel: 'personeller'};

/* --- Fiş kilidi: ortak veritabanında fiş açıkken kayıt kilitlenir (3 dk, her dakika uzatılır).
   Fişten çıkılınca (değişiklik yoksa) ya da pencere kapanınca kilit açılır. Başkası kilitlediyse fiş yalnız görüntülenir. --- */
const fisKilit = {};

  if (fisKilit[yol]) { const k = fisKilit[yol]; if (k.durum !== 'baskasi' || k.bitis > Date.now()) return; delete fisKilit[yol]; }

    k0.durum = 'benim';
    k0.birak = () => ortakIstek(ortak(), 'DELETE', url).catch(() => {});

/* --- Izgara: Excel gibi düzenlenen tablo. Enter sağdaki hücreye geçer, son hücrede yeni satır açar; ↑ ↓ satır değiştirir.
   kolon: {a, ad, gen, tip: metin|sayi|para|secim|tarih|saat|salt, secenek {deger: ad}, liste (datalist), oku(satir), deger(satir) (salt), sg (sağa yasla)}
   Hesaplanan hücreler, odaktaki hücre dışında, her değişiklikte yenilenir; satır rengi satirSinif ile verilir. --- */
function izgara(kap, {kolonlar, satirlar, salt = false, satirSinif = () => '', degisti = () => {}, yeniSatir, silindi = () => {}, bosMetin = ''}) {
  const okunan = (r, k) => k.oku ? k.oku(r) : r[k.a];
  const goster = (r, k) => {
    const v = okunan(r, k);
    if (v === undefined || v === null || v === '') return '';
    if (k.tip === 'sayi') return sayiFmt(v);
    if (k.tip === 'para') return tutarFmt(v);
    return String(v);
  };
  const hucre = (r, k) => {
    if (k.tip === 'salt') return `<td class="salt ${k.sg ? 'sg' : ''}" data-h="${k.a}">${esc(k.deger(r))}</td>`;
    const dis = salt ? 'disabled' : '';
    if (k.tip === 'secim') return `<td><select data-a="${k.a}" ${dis}>${Object.entries(k.secenek).map(([v, a]) => `<option value="${esc(v)}" ${String(okunan(r, k)) === v ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></td>`;
    const tur = k.tip === 'tarih' ? 'date' : k.tip === 'saat' ? 'time' : 'text';
    const sayisal = k.tip === 'sayi' || k.tip === 'para';
    return `<td><input type="${tur}" data-a="${k.a}" value="${esc(goster(r, k))}" ${sayisal ? 'inputmode="decimal" class="sg"' : ''} ${k.liste ? `list="${k.liste}"` : ''} autocomplete="off" spellcheck="false" ${dis}></td>`;
  };
  const satirHtml = (r, i) => `<tr data-i="${i}" class="${satirSinif(r)}"><td class="izg-no">${i + 1}</td>${kolonlar.map(k => hucre(r, k)).join('')}${salt ? '' : `<td class="izg-sil"><button type="button" data-sil title="Satırı sil" aria-label="Satırı sil">${ikon('kapat')}</button></td>`}</tr>`;
  const oku = (k, el) => {
    const v = el.value.trim();
    if (k.tip === 'sayi') { if (!v) return undefined; const n = sayiOku(v); return isFinite(n) ? n : undefined; }
    if (k.tip === 'para') { if (!v) return undefined; const n = tutarOku(v); return isFinite(n) ? n : undefined; }
    return el.value;
  };
  const tazele = tr => {
    const r = satirlar[+tr.dataset.i];
    if (!r) return;
    tr.className = satirSinif(r) + (tr.classList.contains('secili') ? ' secili' : '');
    for (const k of kolonlar) {
      if (k.tip === 'salt') { const td = $(`[data-h="${k.a}"]`, tr); if (td) td.textContent = k.deger(r); continue; }
      const el = $(`[data-a="${k.a}"]`, tr);

    }
  };

  const ciz1 = () => {
    kap.innerHTML = `<table class="izg"><colgroup><col style="width:28px">${kolonlar.map(k => `<col style="width:${k.gen}px">`).join('')}${salt ? '' : '<col style="width:26px">'}</colgroup>
      <thead><tr><th></th>${kolonlar.map(k => `<th class="${k.sg || k.tip === 'sayi' || k.tip === 'para' ? 'sg' : ''}" title="${esc(k.ad)}">${esc(k.ad)}</th>`).join('')}${salt ? '' : '<th></th>'}</tr></thead>
      <tbody>${satirlar.map(satirHtml).join('')}</tbody></table>${!satirlar.length && bosMetin ? `<div class="izg-bos">${esc(bosMetin)}</div>` : ''}`;
    $$('tbody tr', kap).forEach(tr => {
      const i = +tr.dataset.i, r = satirlar[i];
      $$('[data-a]', tr).forEach(el => {
        const k = kolonlar.find(x => x.a === el.dataset.a);
        const isle = () => {
          const v = oku(k, el);
          if (v === undefined) delete r[k.a]; else r[k.a] = v;
          degisti(r, k.a, el);
          $$('tbody tr', kap).forEach(tazele);
        };
        el.addEventListener(k.tip === 'secim' || k.tip === 'tarih' || k.tip === 'saat' ? 'change' : 'input', isle);
        // Sayı ve tutar hücresi odaktan çıkınca düzgün biçimde yazılır (1250,5 → 1.250,50)
        if (k.tip === 'sayi' || k.tip === 'para') el.addEventListener('blur', () => { el.value = goster(r, k); });
        el.addEventListener('keydown', e => {

          if (e.key === 'Enter' && !e.isComposing) {

            if (i < satirlar.length - 1) return odakla(i + 1, duz[0].a);

}

/* Fişi kaydet: taslak doğrulanır, fiyatlar sabitlenir (ürün fiyatı ya da saat ücreti sonradan değişse de fiş değişmez). */
function servisFisKaydet(t, id, sessiz) {
  const yol = 'servis/' + id, yeni = id === 'yeni';
  if (saltOkunur('servis') || fisKilit[yol]?.durum === 'baskasi') { bildir('Bu fişi kaydedemezsiniz (yetki ya da kilit)', true); return false; }
  const x = kopya(t.x), tam = s => String(s || '').trim();
  x.no = tam(x.no) || sonrakiServisNo();
  if (D.servisler.some(y => y.no === x.no && y.id !== x.id)) { bildir('Bu servis form no başka fişte kullanılıyor', true); ui.fisSekme[yol] = 'genel'; ciz(); return false; }
  if (x.kisiId && !kisi(x.kisiId)) x.kisiId = null;
  x.musteriAd = x.kisiId ? '' : tam(x.musteriAd);
  if (!x.kisiId && !x.musteriAd) { bildir('Cari seçin ya da müşteri adını yazın', true); ui.fisSekme[yol] = 'genel'; ciz(); return false; }
  for (const a of ['isEmriNo', 'teklifRef', 'yetkili', 'tel', 'eposta', 'tekne', 'liman', 'servisYeri', 'arac', 'sikayet', 'islemler', 'oneriler', 'testSure', 'sonrakiBakimSaat']) if (typeof x[a] === 'string') x[a] = x[a].trim();
  x.isEmriNo ||= yeni ? sonrakiIsEmriNo() : '';
  x.tarih ||= bugun();
  x.parcalar = x.parcalar.filter(p => tam(p.ad) || tam(p.parcaNo));
  x.iscilik = x.iscilik.filter(w => tam(w.teknisyen) || tam(w.is) || tam(w.kod) || w.sure);
  x.disServis = (x.disServis || []).filter(d => tam(d.firma) || tam(d.is) || d.tutar);
  if (!x.disServis.length) delete x.disServis;
  if (!x.personeller?.length) delete x.personeller;
  for (const p of x.parcalar) { p.adet = p.adet || 0; if (p.fiyat == null) p.fiyat = parcaFiyat(p); if (p.kdv == null) p.kdv = parcaKdv(p); if (!PARCA_DURUM[p.durum]) p.durum = 'yeni'; }
  for (const w of x.iscilik) { w.durum = islemDurum(w); if (w.ucret == null) w.ucret = islemUcret(w); w.sure = w.sure || 0; }
  const eski = yeni ? null : servis(id);
  if (!yeni && !eski) { bildir('Bu fiş başka bir cihazda silinmiş', true); return false; }
  if (x.durum === 'tamam' && eski?.durum !== 'tamam') x.bitis = bugun();
  const e = ekipman(x.ekipmanId);
  if (e && x.calismaSaati > (e.saat || 0)) e.saat = x.calismaSaati;
  if (yeni) { x.id = kimlik(); x.olusturma = Date.now(); D.servisler.push(x); }
  else D.servisler[D.servisler.indexOf(eski)] = x;
  servisTuret(x);
  kaydet();
  if (!D.servisler.some(y => y.id === x.id)) return false;   // yetki yüzünden geri alındı
  const yeniYol = 'servis/' + x.id, l = taslakHepsi();
  delete l[yol];
  l[yeniYol] = {x: kopya(x), taban: JSON.stringify(x), kirli: false};
  taslakYaz();
  if (yeni) { pencereYaz(pencereListe().map(p => p.yol === yol ? {yol: yeniYol, ad: 'Servis fişi ' + x.no} : p)); pencereCubugu.son = yeniYol; }
  if (!sessiz) { bildir(yeni ? 'Servis fişi kaydedildi' : 'Kaydedildi'); if (yeni) git(yeniYol, true); else ciz(); }
  return true;
}

const avansToplam = (pid, ay) => D.personelOdeme.filter(o => o.personelId === pid && o.donem === ay && o.tur === 'avans').reduce((s, o) => s + o.tutar, 0);

  const t = {brut: 0, net: 0, sgkI: 0, issI: 0, gv: 0, dv: 0, isvSgk: 0, issV: 0, maliyet: 0, kisi: 0};
  for (const p of aktifPersonel(ay)) { const b = bordro(p, ay); for (const k in t) if (k !== 'kisi') t[k] += b[k]; t.kisi++; }
  t.sgk = t.sgkI + t.issI + t.isvSgk + t.issV; t.muhtasar = t.gv + t.dv;
  return t;
}

/* ================= KDV ve vergi takvimi ================= */
function kdvAy(ay) {

  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) { const t = faturaHesap(f); if (f.tur === 'alis') { alisF += t.kdv; kdv2 += t.tevkif; } else { satisF += t.kdv - t.tevkif; satisTevkif += t.tevkif; } }
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kdv && i.kaynak?.tip !== 'fatura') i.tur === 'gelir' ? digerGelir += i.kdv : digerGider += i.kdv;
  return {satisF, alisF, digerGelir, digerGider, satisTevkif, kdv2, hesaplanan: satisF + digerGelir, indirilecek: alisF + digerGider};

  let a = tarihler.length ? tarihler[0].slice(0, 7) : ay, devreden = 0;
  while (a < ay) {

  }

}
function vergiTakvimi(ay) {

const vergiTuru = () => D.vergiAyar.tur || (D.profil === 'sirket' ? 'kurum' : 'sahis');
/* Dönem kârı (KDV hariç): kesilen ve alınan faturalar fatura tarihinde, faturasız kasa kayıtları kayıt tarihinde sayılır. */
function donemKar(bas, son) {
  let gelir = 0, gider = 0, satisF = 0, alisF = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) { const a = faturaHesap(f).ara; f.tur === 'alis' ? alisF += a : satisF += a; }

function vergiAraclariBagla() {

  };

const RENKLER = ['#007aff','#ff9500','#af52de','#34c759','#ff2d55','#5856d6','#32ade6','#a2845e','#ffcc00','#8e8e93'];
function donemAraligi(d) {

async function imzaSec() {
  if (D.firma.imza) { const v = await eylemSayfa('Kaşe / imza', null, [{ad: 'Yeni görsel seç', deger: 'sec'}, {ad: 'Kaşe / imzayı kaldır', deger: 'sil', tehlike: true}]); if (v === 'sil') { delete D.firma.imza; kaydet(); return ciz(); } if (v !== 'sec') return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
    const o = Math.min(1, 520 / img.width, 260 / img.height), c = document.createElement('canvas'); c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    D.firma.imza = c.toDataURL('image/png'); kaydet(); bildir('Kaşe / imza kaydedildi; tekliflere basılacak'); ciz(); }; img.src = r.result; }; r.readAsDataURL(f); };
  inp.click();
}

/* ================= PIN kilidi ================= */
/* PIN cihazda özetlenmiş olarak tutulur (dnmuhasebe.kilit). Uygulama açılışta ve arka plandan 30 sn sonra dönüşte kilitlenir. */
const KILIT_ANAHTAR = 'dnmuhasebe.kilit';
const pinOzet = (pin, tuz) => { let a = 0x811c9dc5, b = 0x1505; for (const c of tuz + ':' + pin + ':dn') { a = Math.imul(a ^ c.charCodeAt(0), 16777619) >>> 0; b = (Math.imul(b, 33) + c.charCodeAt(0)) >>> 0; } return a.toString(36) + b.toString(36); };
const kilitAyar = () => { try { return JSON.parse(localStorage.getItem(KILIT_ANAHTAR)); } catch (e) { return null; } };
let kilitli = false, arkaPlanZaman = 0;
/* Tuş takımlı tam ekran PIN girişi. iptal verilirse vazgeçilebilir; Promise girilen 4 haneyi döndürür. */
function pinEkrani(baslik, {iptal = false, alt = '', kontrol} = {}) {
  return new Promise(coz => {
    const el = document.createElement('div'); el.id = 'kilitEkran';
    el.innerHTML = `<div class="logo">P+</div><h3>${esc(baslik)}</h3><p id="pinAlt">${esc(alt)}</p><div class="pin-nokta">${'<i></i>'.repeat(4)}</div>
      <div class="tus-takim">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="bos" data-x="iptal">${iptal ? 'Vazgeç' : ''}</button><button data-n="0">0</button><button class="bos" data-x="sil">Sil</button></div>`;
    document.body.appendChild(el);
    let pin = '';
    const nokta = $('.pin-nokta', el);
    const goster = () => $$('i', nokta).forEach((i, k) => i.classList.toggle('dolu', k < pin.length));
    const bitir = v => { el.remove(); document.removeEventListener('keydown', el._tus); coz(v); };
    const bas = n => {
      if (pin.length >= 4) return;
      pin += n; goster();
      if (pin.length === 4) setTimeout(() => {
        if (!kontrol || kontrol(pin)) return bitir(pin);
        nokta.classList.add('salla'); $('#pinAlt', el).textContent = 'PIN yanlış';
        if (navigator.vibrate) navigator.vibrate(120);
        setTimeout(() => { nokta.classList.remove('salla'); pin = ''; goster(); }, 380);
      }, 120);
    };
    $$('[data-n]', el).forEach(b => b.onclick = () => bas(b.dataset.n));
    $('[data-x=sil]', el).onclick = () => { pin = pin.slice(0, -1); goster(); };
    $('[data-x=iptal]', el).onclick = () => { if (iptal) bitir(null); };
    el._tus = e => { if (/^\d$/.test(e.key)) bas(e.key); else if (e.key === 'Backspace') { pin = pin.slice(0, -1); goster(); } };
    document.addEventListener('keydown', el._tus);
  });
}
async function kilitle() {
  const k = kilitAyar();
  if (!k || kilitli) return;
  kilitli = true;
  document.activeElement?.blur();
  await pinEkrani('PIN girin', {alt: 'PowerServ+ kilitli', kontrol: p => pinOzet(p, k.t) === k.o});
  kilitli = false;
}
async function pinKur() {
  const p1 = await pinEkrani('Yeni PIN', {iptal: true, alt: '4 haneli bir PIN belirleyin'});
  if (!p1) return false;
  const p2 = await pinEkrani('PIN\'i tekrar girin', {iptal: true, kontrol: p => p === p1});
  if (!p2) return false;
  const t = kimlik();
  localStorage.setItem(KILIT_ANAHTAR, JSON.stringify({t, o: pinOzet(p2, t)}));
  bildir('PIN kilidi açıldı');
  return true;
}
async function pinKaldir() {
  const k = kilitAyar();
  if (!k) return;
  const p = await pinEkrani('Mevcut PIN', {iptal: true, kontrol: p => pinOzet(p, k.t) === k.o});
  if (!p) return false;
  localStorage.removeItem(KILIT_ANAHTAR);
  bildir('PIN kilidi kapatıldı');
  return true;
}

/* --- Belge kilidi: düzenleme formu açılınca kayıt 3 dk kilitlenir (her dakika uzatılır), form kapanınca açılır --- */
async function belgeKilitle(key) {
  const el = yigin[yigin.length - 1], m = el && $('.modal', el);
  if (!m) return;
  const o = ortak(), s = o?.oturum;
  if (!s) return;
  const url = fsUrl(o, '/kilit/' + key);
  try {
    let k = null;
    try { k = fsOku(await ortakIstek(o, 'GET', url)); } catch (e) { if (e.durum !== 404) throw e; }
    if (!yigin.includes(el)) return;
    if (k && k.u !== s.uid && k.bitis > Date.now()) {
      $('.modal-govde', m).insertAdjacentHTML('afterbegin', `<div class="kilit-uyari">${ikon('kilit')}<div><b>${esc(k.a || 'Başka bir kullanıcı')} bu kaydı düzenliyor</b><small>Kayıt şu an kilitli; değişiklik yapamazsınız. Daha sonra yeniden açın.</small></div></div>`);
      formuKilitle(m);
      return;
    }
    const yaz = () => ortakIstek(ortak(), 'PATCH', url, {fields: fsAlanlar({u: s.uid, a: s.ad || s.eposta, bitis: Date.now() + 180000})}).catch(() => {});
    await yaz();
    const birak = () => ortakIstek(ortak(), 'DELETE', url).catch(() => {});
    if (!yigin.includes(el)) return birak();
    const t = setInterval(yaz, 60000), once = el._kapaninca;
    el._kapaninca = () => { clearInterval(t); birak(); if (once) once(); };
  } catch (e) { /* internet yoksa kilitsiz devam edilir */ }
}
