.fis-kagit .fs-alan{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.fis-kagit .fs-alan span{color:#555;font-weight:700;min-width:104px;white-space:nowrap}
.fis-kagit .fs-alan b{flex:1;font-weight:500;border-bottom:1px dotted #999;min-height:1.4em}
.fis-kagit .fs-tutar{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:12px 0 8px;border:1.5px solid var(--fs);border-radius:6px;padding:8px 12px;align-items:center}
.fis-kagit .fs-tutar span{display:block;font-size:9px;font-weight:700;color:#555}
.fis-kagit .fs-tutar>div:first-child b{font-size:20px;color:var(--fs);white-space:nowrap}
.fis-kagit .fs-yazi{border-left:1px solid #ccc;padding-left:12px}
.fis-kagit .fs-yazi b{font-style:italic;font-weight:600}
.fis-kagit .fs-beyan{font-size:9.5px;color:#444;margin:6px 0 10px;font-style:italic}
.fis-kagit .fs-imzalar{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fis-kagit .fs-ib{border:1px solid #888;text-align:center;font-weight:700;font-size:9px;padding:3px}
.fis-kagit .fs-ia{border:1px solid #888;border-top:0;height:58px}
.fis-kagit .fs-dip{text-align:center;color:#888;font-size:8px;margin-top:8px}

/* ================= Tema 2.5: kurumsal (ticari yazılım) =================
   Keskin köşeler, ince kenarlıklar, gölgesiz düz yüzeyler, sıkı yerleşim ve kısa geçişler. */
:root{
  --bg:#edf0f4;--kart:#fff;--kart2:#f6f7f9;--kenar:#d5dbe3;--ayirici:#e3e7ec;--dolgu:#eef1f5;--dolgu2:#dde3ea;

  --golge:none;--egri:cubic-bezier(.25,.8,.25,1);
  --cam:#fff;--r:6px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191b1f;--kart:#22252a;--kart2:#2a2d33;--kenar:#383c44;--ayirici:#30343b;--dolgu:#2c3036;--dolgu2:#3a3f47;

}}
html,body{font-size:14.5px;letter-spacing:0}
header,header.kaydi{background:var(--kart);box-shadow:none;border-bottom:1px solid var(--kenar);-webkit-backdrop-filter:none;backdrop-filter:none}
header .orta-baslik{font-size:16px;font-weight:700}
#cekmece,body:not(.profilde) #cekmece{background:var(--kart)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-right:1px solid var(--kenar)}
.c-ust{border-bottom:1px solid var(--kenar);padding:14px 16px 12px}
.c-ust .kare[class*=r-]{border-radius:6px;background:var(--mavi);box-shadow:none}
.c-ayrac{height:1px;background:var(--ayirici);margin:10px 16px}
.c-liste{padding:0 8px;gap:0}
.c-liste:first-of-type{margin-top:8px}
.c-liste a{border-radius:4px;min-height:38px;font-size:14px;font-weight:550;position:relative}
.c-liste a.secili{background:color-mix(in srgb,var(--mavi) 10%,transparent);color:var(--mavi);font-weight:700}
.c-liste a.secili::before{display:block!important;content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0;background:var(--mavi)}
.c-liste .kare[class*=r-]{width:24px;height:24px;border-radius:5px;box-shadow:none}
.c-liste .kare svg{width:14px;height:14px}
.c-liste .rozet.uyar{border-radius:4px;box-shadow:none}
.c-alt-menu{margin:0 0 6px 20px;border-left:1px solid var(--kenar);animation:none}
.c-alt-menu a{border-radius:3px;font-size:13px!important}
.c-alt-menu a.secili{background:color-mix(in srgb,var(--mavi) 10%,transparent)}
.c-alt-baslik{text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}

.kahraman{border-radius:var(--r);box-shadow:none;background:linear-gradient(135deg,#1f63c6,#184f9e)}
.kahraman::after{box-shadow:none}
.metrik{background:var(--kart)!important;border-top:3px solid var(--c,var(--mavi))!important}
.bolum{text-transform:uppercase;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ikincil);margin:20px 2px 6px}
.hucre{min-height:42px}
.kare{border-radius:5px}
@supports (background:color-mix(in srgb,red 10%,transparent)){.kare[class*=r-]{background:var(--c);box-shadow:none}.avatar[class*=r-]{border-radius:6px}}
.avatar{border-radius:6px}
.hap{border-radius:3px;font-size:11px;padding:2px 6px;font-weight:700}
.btn{border-radius:var(--r);min-height:40px;font-weight:650;box-shadow:none!important}
.btn:not(.renkli):not(.yesil-acik):not(.kirmizi-acik){background:var(--mavi)}
.btn.yesil-acik{background:var(--yesil)}
.btn.renkli,.btn.kirmizi-acik{border:1px solid var(--kenar)!important;background:var(--kart)}
.segment{border-radius:var(--r);border:1px solid var(--kenar);background:var(--kart2);padding:2px}
.segment button,.segment label,.segment label span{border-radius:4px}
.segment .secili,.segment input:checked+span{background:var(--mavi)!important;color:#fff!important;box-shadow:none!important}
.arama{border-radius:var(--r);border:1px solid var(--kenar);background:var(--kart)}
.cip.secili,.alt-serit button.secili{background:var(--mavi);border-color:var(--mavi)!important}
.alt-serit button{border-radius:var(--r)!important;padding:6px 11px}
.alt-serit{border-bottom:1px solid var(--kenar);padding-bottom:14px}
.ay-secici button{border-radius:var(--r);border:1px solid var(--kenar)}
.liste-kap{border-radius:var(--r)!important}
.liste-tablo{font-size:13px}
.liste-tablo th{background:#f0f3f7;color:#2a3442;text-transform:uppercase;font-size:11px;letter-spacing:.03em;border-bottom:1px solid var(--kenar)}
.liste-tablo td{border-bottom:1px solid var(--ayirici);padding:8px 12px}
.liste-tablo td+td,.liste-tablo th+th{border-left:1px solid var(--ayirici)}
@media (prefers-color-scheme:dark){.liste-tablo th{background:var(--kart2);color:var(--yazi)}}
.liste-tablo td.islem button{border-radius:4px}
.modal:not(.sayfa-modal){border-radius:8px 8px 0 0}
.eylem .grup,.eylem button.iptal{border-radius:8px!important}
.sayfa-modal .modal-ust,.modal-alt{background:var(--kart);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--kenar)}
.modal-alt .btn{border-radius:var(--r)}
.bildirim{border-radius:6px;background:#1f2a37;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.logo,#kilitEkran .logo,.karsilama .logo{border-radius:10px;background:var(--mavi);box-shadow:none}
#kilitEkran{background:linear-gradient(160deg,#1f63c6,#163f80)}
.tus-takim button{border-radius:8px}
.sayfa-modal .grup.cift{border-radius:var(--r)}
/* Kısa ve sade geçişler */
#icerik>*,.metrikler .metrik,.c-alt-menu{animation:none!important}
.modal,.sayfa-modal{transition:transform .22s var(--egri)!important}
.perde{transition:background .2s}
.hucre:active,.metrik:active,.btn:active,.btn-izgara button:active,.yeni-satir button:active,.profil-kart:active,a.kart:active,.cip:active,.hizli button:active{transform:none!important;filter:brightness(.96)}
.anahtar span:before{transition:transform .15s}
</style>
</head>

const BORDRO = {

/* iOS anahtarı: satırdaki gizli checkbox ile görünür anahtarı eşler */
/* Geniş ekranda form alanları iki sütun yan yana: üç ve daha fazla kısa alandan oluşan gruplar ızgaraya döner.
   Görünen alan sayısı tekse son alan tam genişlik olur. */
function ciftDuzen(kok) {
  $$('.grup', kok).forEach(g => {
    if (g.closest('.kalem')) return;
    const c = [...g.children].filter(e => e.tagName !== 'DATALIST');
    const uygun = c.length >= 3 && c.every(e => (e.classList.contains('f-satir') || e.classList.contains('hucre')) && !e.classList.contains('tehlike') && !$('textarea, .anahtar', e)) && c.some(e => e.matches('label, button'));
    if (g.classList.contains('cift') !== uygun) g.classList.toggle('cift', uygun);
    if (!uygun) return;
    const gor = c.filter(e => !e.classList.contains('gizli'));
    c.forEach(e => { const tam = e === gor[gor.length - 1] && gor.length % 2 === 1; if (e.classList.contains('tam') !== tam) e.classList.toggle('tam', tam); });
  });
}
function yuzenEtiket(kok) {

    const e = document.createElement('small'); e.className = 'yuzen'; e.textContent = i.placeholder.replace(/\s*\(.*?\)\s*$/, '');

function anahtarBagla(kok) {

    ['fatura', 'Faturalar', D.faturalar.filter(f => !D.kisiler.length || true).map(f => ({id: f.id, ad: faturaMusteri(f), alt: `${faturaTurAd(f)} ${f.no}`, sag: para(faturaHesap(f).toplam), simge: 'dosya', renk: 'indigo'}))],
    ['personel', 'Personel (ödemeleri ve puantajıyla)', D.personeller.map(p => ({id: p.id, ad: p.ad, alt: p.gorev || 'Personel', sag: `${D.personelOdeme.filter(o => o.personelId === p.id).length} ödeme`, simge: 'kisiler', renk: 'camgobegi'}))],
    ['urun', 'Stok ürünleri (hareketleriyle)', D.urunler.map(u => ({id: u.id, ad: u.ad, alt: `${sayiFmt(urunMiktar(u.id))} ${u.birim}`, sag: '', simge: 'kutu', renk: 'kahve'}))]
  ].filter(([, , l]) => l.length);
  if (!bolumler.length) return bildir('Bu hesapta taşınacak kayıt yok', true);
  const m = modal(`${hesapAdi(H.liste.find(x => x.id === hedefId))} hesabına`, `
    <p class="dipnot" style="margin:0 4px 16px">Seçtiklerinizi işaretleyin. Faturaların, maaşların ve tahsilatların kasadaki otomatik kayıtları da birlikte taşınır.</p>
    ${bolumler.map(([tip, baslik, l]) => `<div class="bolum">${esc(baslik)}<button data-hepsi="${tip}">Tümü</button></div>
      <div class="grup">${l.map(x => `<label class="hucre kareli secim"><input type="checkbox" data-tip="${tip}" value="${x.id}">${kare(x.simge, x.renk)}<div class="ic"><b>${esc(x.ad)}</b><small>${esc(x.alt)}</small></div><span class="deger">${esc(x.sag)}</span><span class="tik"></span></label>`).join('')}</div>`).join('')}`,
    {kaydet: () => {
      const sec = tip => $$(`input[data-tip=${tip}]:checked`, m).map(c => c.value);
      const n = tasi(hedef, {islem: sec('islem'), kisi: sec('kisi'), fatura: sec('fatura'), personel: sec('personel'), urun: sec('urun')});
      if (!n) { bildir('Kayıt seçin', true); return false; }
      localStorage.setItem(veriAnahtari(hedefId), JSON.stringify(hedef));
      kaydet(); bildir(`${n} kayıt taşındı`); setTimeout(ciz, 10);
    }, kaydetAd: 'Taşı', tam: true});
  $$('[data-hepsi]', m).forEach(b => b.onclick = () => { const l = $$(`input[data-tip=${b.dataset.hepsi}]`, m); const hepsi = l.every(c => c.checked); l.forEach(c => c.checked = !hepsi); });
}
function tasi(hedef, sec) {
  let n = 0;
  const al = (dizi, kosul) => { const t = D[dizi].filter(kosul); if (t.length) { D[dizi] = D[dizi].filter(x => !kosul(x)); hedef[dizi].push(...t); } return t; };
  const kopyala = (dizi, id) => { if (id && !hedef[dizi].some(x => x.id === id)) { const x = D[dizi].find(y => y.id === id); if (x) hedef[dizi].push(JSON.parse(JSON.stringify(x))); } };
  const turetilen = id => { al('islemler', i => i.kaynak?.id === id); al('hareketler', h => h.kaynak?.id === id); al('stokHareket', x => x.kaynak?.id === id); };
  const faturaTasi = f => { for (const k of f.kalemler) kopyala('urunler', k.urunId); if (f.kisiId && !sec.kisi.includes(f.kisiId)) kopyala('kisiler', f.kisiId); al('faturalar', x => x.id === f.id); turetilen(f.id); n++; };
  for (const id of sec.kisi) {
    const hr = D.hareketler.filter(h => h.kisiId === id && !h.kaynak);
    al('islemler', i => hr.some(h => h.id === i.hareketId));
    al('hareketler', h => h.kisiId === id && !h.kaynak);
    for (const f of D.faturalar.filter(f => f.kisiId === id)) faturaTasi(f);
    al('kisiler', k => k.id === id); n++;
  }
  for (const id of sec.fatura) { const f = D.faturalar.find(x => x.id === id); if (f) faturaTasi(f); }
  for (const id of sec.personel) {
    const od = D.personelOdeme.filter(o => o.personelId === id).map(o => o.id);
    al('islemler', i => i.kaynak?.tip === 'personel' && (od.includes(i.kaynak.id) || i.kaynak.ust === id));
    al('personelOdeme', o => o.personelId === id);
    for (const a in D.puantaj) if (D.puantaj[a][id]) { (hedef.puantaj[a] ||= {})[id] = D.puantaj[a][id]; delete D.puantaj[a][id]; }
    al('personeller', p => p.id === id); n++;
  }
  for (const id of sec.urun) {
    al('islemler', i => i.kaynak?.tip === 'stok' && i.kaynak.ust === id);
    al('stokHareket', x => x.urunId === id && !x.kaynak);
    al('urunler', u => u.id === id); n++;
  }
  n += al('islemler', i => sec.islem.includes(i.id)).length;
  return n;
}

  if (ac('personel')) yeni.push(['personel', 'kisiler', 'camgobegi', 'Maaş']);

  // Metrik kutuları
  const o = ayToplam(ay), m = [];
  const metrik = (yol, sm, renk, baslik, deger, alt, sinif = '') => `<a class="metrik" href="#/${yol}" style="--c:var(--${renk})"><div class="ust">${ikon(sm)}${esc(baslik)}</div><b class="${sinif}">${deger}</b><small>${esc(alt)}</small></a>`;

    m.push(metrik('kasa', 'cikis', 'kirmizi', `${ayAdi(ay).split(" ")[0]} ${t.gider}`, para(o.gider), `${D.islemler.filter(i => i.tur === 'gider' && i.tarih.startsWith(ay)).length} kayıt`, 'gider'));

  if (ac('veresiye') || ac('fatura')) {

  $('#icerik').innerHTML = h;

  $$('[data-h]').forEach(b => b.onclick = () => {

    else if (x === 'gelir' || x === 'gider') islemFormu(null, x);
    else git(x);
  });
  islemTiklari();
}

/* ================= Gelir / Gider ================= */
const islemSirala = (a, b) => b.tarih.localeCompare(a.tarih) || (b.olusturma || 0) - (a.olusturma || 0);
function islemSatiri(i, tarihli) {

/* ================= Banka, kasa ve kartlar =================

const HESAP_TUR = {

const finansHesap = id => D.finansHesap.find(h => h.id === id);

    if (v.hedef === h.id && v.tarih >= bas) l.push({tarih: v.tarih, olusturma: v.olusturma || 0, tutar: v.tutar, ad: (h.tur === 'kart' ? 'Kart ödemesi · ' : 'Virman ← ') + finHesapAdi(v.kaynak), alt: v.aciklama, virman: v});

function finansHesapEkrani(id) {

      ${so && -b > 0 ? `<div class="k-alt ${g <= 3 ? 'gider' : ''}">Son ödeme ${esc(tarihYaz(so, true))} · ${g === 0 ? 'bugün' : g + ' gün kaldı'}</div>` : ''}

function hesapEkstreKagit(fh) {
  const kart = fh.tur === 'kart';
  let kal = fh.acilis || 0, gi = 0, ci = 0;
  const satir = hesapHareketleri(fh).map(x => { kal += x.tutar; x.tutar > 0 ? gi += x.tutar : ci -= x.tutar;
    return `<tr><td style="white-space:nowrap">${esc(tarihYaz(x.tarih, true))}</td><td>${esc(x.ad)}${x.alt && x.alt !== x.ad ? ' · ' + esc(x.alt) : ''}</td><td class="sg">${x.tutar > 0 ? para(x.tutar) : ''}</td><td class="sg">${x.tutar < 0 ? para(-x.tutar) : ''}</td><td class="sg">${para(kart ? -kal : kal)}</td></tr>`; }).join('');
  return `<div class="kagit">${firmaBaslik(kart ? 'KREDİ KARTI EKSTRESİ' : 'HESAP EKSTRESİ', `${esc(fh.ad)}${fh.iban ? '<br>' + esc(fh.iban) : ''}<br>Hazırlanma: ${esc(tarihYaz(bugun(), true))}`)}
    <div class="kutular"><div><small>${kart ? 'Açılış borcu' : 'Açılış'}</small><b>${para(Math.abs(fh.acilis || 0))}</b></div><div><small>Giren</small><b>${para(gi)}</b></div><div><small>Çıkan</small><b>${para(ci)}</b></div><div><small>${kart ? 'Güncel borç' : 'Bakiye'}</small><b>${para(kart ? -kal : kal)}</b></div></div>
    <table style="font-size:11px"><thead><tr><th>Tarih</th><th>Açıklama</th><th class="sg">Giren</th><th class="sg">Çıkan</th><th class="sg">${kart ? 'Borç' : 'Bakiye'}</th></tr></thead><tbody>${satir || '<tr><td colspan="5">Hareket yok</td></tr>'}</tbody></table></div>`;
}

/* Her ekipmanın son tamamlanan servisindeki "sonraki bakım" tarihi */
function yaklasanBakimlar(gun = 30) {
  const son = {};
  for (const s of D.servisler) if (s.durum === 'tamam' && s.ekipmanId && s.sonrakiBakim && (!son[s.ekipmanId] || son[s.ekipmanId].tarih < s.tarih)) son[s.ekipmanId] = s;

/* ---- İmza (parmakla) ---- */
function imzaAl(baslik, adVarsayilan, fn) {
  const m = modal(baslik, `<div class="grup"><label class="f-satir sol"><input type="text" id="iAd" value="${esc(adVarsayilan)}" placeholder="Ad soyad"></label></div>
    <div class="imza-kutu"><canvas id="iTuval" width="600" height="220"></canvas><span>Parmağınızla imzalayın</span></div>
    <div class="btn-grup"><button class="btn renkli" id="iTemizle">${ikon('cop')} Temizle</button></div>`, {kaydet: () => {
      if (!dolu) { bildir('İmza atılmadı', true); return false; }
      fn({ad: $('#iAd', m).value.trim(), img: tuval.toDataURL('image/png'), zaman: new Date().toISOString()});
    }, kaydetAd: 'İmzayı kaydet'});
  const tuval = $('#iTuval', m), c = tuval.getContext('2d');
  let dolu = false, son = null;
  c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#10204a';
  const nokta = e => { const r = tuval.getBoundingClientRect(); return [(e.clientX - r.left) * tuval.width / r.width, (e.clientY - r.top) * tuval.height / r.height]; };
  tuval.addEventListener('pointerdown', e => { e.preventDefault(); tuval.setPointerCapture(e.pointerId); son = nokta(e); dolu = true; tuval.parentNode.classList.add('dolu'); });
  tuval.addEventListener('pointermove', e => { if (!son) return; const p = nokta(e); c.beginPath(); c.moveTo(...son); c.lineTo(...p); c.stroke(); son = p; });
  const bit = () => son = null;
  tuval.addEventListener('pointerup', bit); tuval.addEventListener('pointercancel', bit);
  $('#iTemizle', m).onclick = () => { c.clearRect(0, 0, tuval.width, tuval.height); dolu = false; tuval.parentNode.classList.remove('dolu'); };
}

/* Servisten taslak fatura: parçalar satış fiyatıyla, işçilik saat olarak. Stok servisten düştüğü için faturada stok düşülmez. */
function servisFaturala(s) {
  const kalemler = s.parcalar.filter(p => p.durum !== 'musteri').map(p => { const u = p.urunId && urun(p.urunId);
    return {ad: p.ad || p.parcaNo, kod: p.parcaNo || '', miktar: p.adet || 1, birim: p.birim || 'adet', fiyat: u ? u.satis || 0 : 0, kdv: u ? u.kdvOran ?? 20 : 20}; });
  const saat = iscilikSaat(s);
  if (saat) kalemler.push({ad: `İşçilik · Servis ${s.no}`, miktar: saat, birim: 'saat', fiyat: D.servisAyar.saatUcret || 0, kdv: 20});
  if (!kalemler.length) kalemler.push({ad: `Servis hizmeti · ${s.no}`, miktar: 1, birim: 'adet', fiyat: 0, kdv: 20});
  const f = {id: kimlik(), tur: 'fatura', no: sonrakiNo('fatura'), tarih: bugun(), vade: '', kisiId: s.kisiId, musteriAd: s.kisiId ? '' : servisMusteri(s), kalemler,
    not: `Servis form no: ${s.no}${s.isEmriNo ? ' · İş emri: ' + s.isEmriNo : ''}${s.tekne ? ' · Tekne: ' + s.tekne : ''}`, durum: 'taslak', odendi: false, odemeler: [], cariyeIsle: true, stokDus: false, servisId: s.id, olusturma: Date.now()};
  D.faturalar.push(f); s.faturaId = f.id;
  kaydet(); bildir('Taslak fatura oluşturuldu; fiyatları kontrol edip kesin');
  git('fatura/' + f.id);
}

function servisKagit(s) {

/* Cari ekranındaki tekne/makine ve servis geçmişi bölümü */

/* ================= Personel ================= */
const personel = id => D.personeller.find(p => p.id === id);
const ODEME_TUR = {maas:'Maaş', avans:'Avans', prim:'Prim'};
const maasOdendiMi = (pid, ay) => D.personelOdeme.some(o => o.personelId === pid && o.donem === ay && o.tur === 'maas');
const avansToplam = (pid, ay) => D.personelOdeme.filter(o => o.personelId === pid && o.donem === ay && o.tur === 'avans').reduce((s, o) => s + o.tutar, 0);
const aktifPersonel = ay => D.personeller.filter(p => p.aktif !== false || (p.cikis && p.cikis.slice(0, 7) >= ay)).filter(p => !p.iseGiris || p.iseGiris.slice(0, 7) <= ay).sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
const ucretYazi = p => `${para(p.maas)} ${p.ucretTip === 'brut' ? 'brüt' : 'net'}`;
function bordroToplam(ay) {
  const t = {brut: 0, net: 0, sgkI: 0, issI: 0, gv: 0, dv: 0, isvSgk: 0, issV: 0, maliyet: 0, kisi: 0};
  for (const p of aktifPersonel(ay)) { const b = bordro(p, ay); for (const k in t) if (k !== 'kisi') t[k] += b[k]; t.kisi++; }
  t.sgk = t.sgkI + t.issI + t.isvSgk + t.issV; t.muhtasar = t.gv + t.dv;
  return t;
}
function personelEkrani() {
  const ay = ui.pAy, sekme = ui.pSekme;
  let h = sayfa('Personel', {sag: sekme === 'liste' ? artiBtn('ekleBtn', 'Yeni personel') : sekme === 'puantaj' ? `<button class="nav-btn" id="puYaz">Yazdır</button>` : `<button class="nav-btn" id="hesapBtn">Hesapla</button>`});
  h += `<div class="segment" id="pSek">${[['liste', 'Çalışanlar'], ['puantaj', 'Puantaj'], ['bordro', 'Bordro']].map(([v, a]) => `<button data-v="${v}" class="${sekme === v ? 'secili' : ''}">${a}</button>`).join('')}</div>` + ayBtnler;
  if (sekme === 'puantaj') h += puantajListe(ay);
  else if (sekme === 'bordro') h += bordroListe(ay);
  else h += personelListe(ay);
  $('#icerik').innerHTML = h;
  ayBagla('pAy', personelEkrani);
  $$('#pSek button').forEach(b => b.onclick = () => { ui.pSekme = b.dataset.v; personelEkrani(); });
  if ($('#ekleBtn')) $('#ekleBtn').onclick = () => personelFormu();
  if ($('#bosEkle')) $('#bosEkle').onclick = () => personelFormu();
  if ($('#hesapBtn')) $('#hesapBtn').onclick = () => maasHesaplayici();
  if ($('#puYaz')) $('#puYaz').onclick = () => yazdir(`Puantaj ${ayAdi(ay)}`, puantajKagit(ay));
  if ($('#bYaz')) $('#bYaz').onclick = () => yazdir(`Bordro ${ayAdi(ay)}`, bordroIcmalKagit(ay));
  $$('[data-p]').forEach(b => b.onclick = () => git('personel/' + b.dataset.p));
  $$('[data-pu]').forEach(b => b.onclick = () => puantajFormu(personel(b.dataset.pu), ay));
  $$('[data-bo]').forEach(b => b.onclick = () => bordroDetay(personel(b.dataset.bo), ay));
  $$('#tesvik button').forEach(b => b.onclick = () => { D.bordroAyar.tesvik = +b.dataset.t; kaydet(); personelEkrani(); });
  if ($('#topluOde')) $('#topluOde').onclick = async () => {
    const bekleyen = aktifPersonel(ay).filter(p => p.aktif !== false && !maasOdendiMi(p.id, ay) && p.maas > 0);
    const odenecek = p => Math.max(0, bordro(p, ay).net - avansToplam(p.id, ay));
    const toplam = bekleyen.reduce((s, p) => s + odenecek(p), 0);
    if (!await eylemSayfa(`${ayAdi(ay)} maaşları`, `${bekleyen.length} kişi · puantaj ve avanslar düşülmüş toplam ${para(toplam)}`, [{ad: 'Öde', deger: true}])) return;
    for (const p of bekleyen) personelOdemeEkle(p, {tur: 'maas', tutar: odenecek(p), donem: ay, tarih: bugun(), odeme: 'havale', aciklama: ''}, true);
    kaydet(); bildir('Maaşlar ödendi'); ciz();
  };
}
function personelListe(ay) {
  const aktif = D.personeller.filter(p => p.aktif !== false).sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));

  const odenen = D.personelOdeme.filter(o => o.donem === ay).reduce((s, o) => s + o.tutar, 0);

  const t = bordroToplam(ay);
  return `<div class="ikili"><div class="kart"><div class="k-ust">İşveren maliyeti</div><div class="dev orta">${para(t.maliyet)}</div><div class="k-alt">${t.kisi} çalışan · net ${kisaPara(t.net)}</div></div>

    ${aktif.length ? `<div class="grup">${aktif.map(p => {
      const od = maasOdendiMi(p.id, ay);

}

/* ================= KDV ve vergi takvimi ================= */
function kdvAy(ay) {

  let satisF = 0, alisF = 0, digerGelir = 0, digerGider = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) f.tur === 'alis' ? alisF += faturaHesap(f).kdv : satisF += faturaHesap(f).kdv;
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kdv && i.kaynak?.tip !== 'fatura') i.tur === 'gelir' ? digerGelir += i.kdv : digerGider += i.kdv;
  return {satisF, alisF, digerGelir, digerGider, hesaplanan: satisF + digerGelir, indirilecek: alisF + digerGider};

function kdvDevir(ay) {

  let a = tarihler.length ? tarihler[0].slice(0, 7) : ay, devreden = 0;
  while (a < ay) {

}

    {tarih: `${ay}-28`, ad: 'KDV beyannamesi ve ödemesi', alt: onceki},
    {tarih: son, ad: 'SGK prim ödemesi', alt: onceki},
    {tarih: son, ad: 'Ba-Bs formları', alt: onceki}

  if (m === 3) l.push({tarih: `${ay}-31`, ad: 'Yıllık gelir vergisi beyannamesi', alt: `${y - 1} yılı`});

function donemKar(bas, son) {
  let gelir = 0, gider = 0, satisF = 0, alisF = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) { const a = faturaHesap(f).ara; f.tur === 'alis' ? alisF += a : satisF += a; }
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kaynak?.tip !== 'fatura') { const t = i.tutar - (i.kdv || 0); i.tur === 'gelir' ? gelir += t : gider += t; }

/* ================= Finans raporları =================
   Kâr/zarar fatura esaslıdır: satış hasılatı (KDV hariç) − satılan malın maliyeti (stok çıkışları × ortalama maliyet)
   − stoksuz alış faturaları − faturasız giderler + faturasız gelirler. Tahsilat ve fatura ödemeleri kâra ikinci kez sayılmaz. */
function karZarar(bas, son) {
  const ic = t => t >= bas && t <= son;
  const sf = D.faturalar.filter(f => f.tur === 'fatura' && faturaliMi(f) && ic(f.tarih));
  const af = D.faturalar.filter(f => f.tur === 'alis' && faturaliMi(f) && ic(f.tarih));
  const hasilat = sf.reduce((s, f) => s + faturaHesap(f).ara, 0);
  const servisHasilat = sf.filter(f => f.servisId).reduce((s, f) => s + faturaHesap(f).ara, 0);
  let smm = 0;
  for (const h of D.stokHareket) if (h.tur === 'cikis' && !h.sayim && ic(h.tarih)) { const u = urun(h.urunId); if (u) smm += Math.round(h.miktar * urunMaliyet(u)); }
  const stoksuzAlis = af.reduce((s, f) => s + f.kalemler.filter(k => !k.urunId || !f.stokDus || !modulAcik('stok')).reduce((t, k) => t + Math.round(k.miktar * k.fiyat), 0), 0);
  const gelirKat = {}, giderKat = {};
  let digerGelir = 0, gider = 0;

    if (!ic(i.tarih) || i.kaynak?.tip === 'fatura' || i.kaynak?.tip === 'stok' || i.hareketId) continue;
    const net = i.tutar - (i.kdv || 0);
    if (i.tur === 'gelir') { if (i.kategori === 'Tahsilat') continue; digerGelir += net; gelirKat[i.kategori] = (gelirKat[i.kategori] || 0) + net; }
    else { gider += net; giderKat[i.kategori] = (giderKat[i.kategori] || 0) + net; }
  }
  const brut = hasilat - smm, net = brut + digerGelir - stoksuzAlis - gider;
  return {hasilat, servisHasilat, smm, brut, stoksuzAlis, digerGelir, gider, net, gelirKat, giderKat, satisAdet: sf.length};
}
function karZararTablo(k) {
  const satir = (a, v, cls = '') => `<div class="hucre ${cls}"><div class="ic"><b>${a}</b></div><span class="tutar ${v < 0 ? 'gider' : ''}" style="font-size:15px">${para(v)}</span></div>`;
  return `<div class="grup">
    ${satir(`Satış hasılatı <small class="soluk">${k.satisAdet} fatura, KDV hariç</small>`, k.hasilat)}
    ${k.servisHasilat ? satir('<small class="soluk">· servisten</small>', k.servisHasilat) : ''}
    ${satir('Satılan malın maliyeti', -k.smm)}
    ${satir('<span style="font-weight:700">Brüt kâr</span>', k.brut)}
    ${k.digerGelir ? satir('Faturasız gelirler', k.digerGelir) : ''}
    ${k.stoksuzAlis ? satir('Stok dışı alış faturaları', -k.stoksuzAlis) : ''}

}
/* Önümüzdeki günlerde beklenen tahsilat ve ödemeler */
function nakitProjeksiyon(gun) {
  const b = bugun(), sinir = (() => { const d = tarihNesne(b); d.setDate(d.getDate() + gun); return tarihStr(d); })();
  let tahsilat = 0, odeme = 0, gecikmisT = 0, gecikmisO = 0;
  for (const f of D.faturalar) if (faturaliMi(f)) {
    const kl = faturaKalan(f); if (!kl) continue;
    const v = f.vade || f.tarih;
    if (v > sinir) continue;
    if (f.tur === 'fatura') { tahsilat += kl; if (v < b) gecikmisT += kl; } else { odeme += kl; if (v < b) gecikmisO += kl; }
  }
  let kart = 0;
  if (modulAcik('banka')) for (const h of aktifHesaplar()) if (h.tur === 'kart') { const so = kartSonOdeme(h), bor = -hesapBakiye(h); if (bor > 0 && so && so <= sinir) kart += bor; }
  let maas = 0;
  if (modulAcik('personel')) maas = D.personeller.filter(p => p.aktif !== false && p.maas > 0 && !maasOdendiMi(p.id, b.slice(0, 7))).reduce((s, p) => s + (p.maas || 0), 0) * Math.max(1, Math.round(gun / 30));
  return {tahsilat, odeme, kart, maas, gecikmisT, gecikmisO, net: tahsilat - odeme - kart - maas};
}

  let h = '';

/* ================= PIN kilidi ================= */
/* PIN cihazda özetlenmiş olarak tutulur (dnmuhasebe.kilit). Uygulama açılışta ve arka plandan 30 sn sonra dönüşte kilitlenir. */
const KILIT_ANAHTAR = 'dnmuhasebe.kilit';
const pinOzet = (pin, tuz) => { let a = 0x811c9dc5, b = 0x1505; for (const c of tuz + ':' + pin + ':dn') { a = Math.imul(a ^ c.charCodeAt(0), 16777619) >>> 0; b = (Math.imul(b, 33) + c.charCodeAt(0)) >>> 0; } return a.toString(36) + b.toString(36); };
const kilitAyar = () => { try { return JSON.parse(localStorage.getItem(KILIT_ANAHTAR)); } catch (e) { return null; } };
let kilitli = false, arkaPlanZaman = 0;
/* Tuş takımlı tam ekran PIN girişi. iptal verilirse vazgeçilebilir; Promise girilen 4 haneyi döndürür. */
function pinEkrani(baslik, {iptal = false, alt = '', kontrol} = {}) {
  return new Promise(coz => {
    const el = document.createElement('div'); el.id = 'kilitEkran';
    el.innerHTML = `<div class="logo">P+</div><h3>${esc(baslik)}</h3><p id="pinAlt">${esc(alt)}</p><div class="pin-nokta">${'<i></i>'.repeat(4)}</div>
      <div class="tus-takim">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="bos" data-x="iptal">${iptal ? 'Vazgeç' : ''}</button><button data-n="0">0</button><button class="bos" data-x="sil">Sil</button></div>`;
    document.body.appendChild(el);
    let pin = '';
    const nokta = $('.pin-nokta', el);
    const goster = () => $$('i', nokta).forEach((i, k) => i.classList.toggle('dolu', k < pin.length));
    const bitir = v => { el.remove(); document.removeEventListener('keydown', el._tus); coz(v); };
    const bas = n => {
      if (pin.length >= 4) return;
      pin += n; goster();
      if (pin.length === 4) setTimeout(() => {
        if (!kontrol || kontrol(pin)) return bitir(pin);
        nokta.classList.add('salla'); $('#pinAlt', el).textContent = 'PIN yanlış';
        if (navigator.vibrate) navigator.vibrate(120);
        setTimeout(() => { nokta.classList.remove('salla'); pin = ''; goster(); }, 380);
      }, 120);
    };
    $$('[data-n]', el).forEach(b => b.onclick = () => bas(b.dataset.n));
    $('[data-x=sil]', el).onclick = () => { pin = pin.slice(0, -1); goster(); };
    $('[data-x=iptal]', el).onclick = () => { if (iptal) bitir(null); };
    el._tus = e => { if (/^\d$/.test(e.key)) bas(e.key); else if (e.key === 'Backspace') { pin = pin.slice(0, -1); goster(); } };
    document.addEventListener('keydown', el._tus);
  });
}
async function kilitle() {
  const k = kilitAyar();
  if (!k || kilitli) return;
  kilitli = true;
  document.activeElement?.blur();
  await pinEkrani('PIN girin', {alt: 'PowerServ+ kilitli', kontrol: p => pinOzet(p, k.t) === k.o});
  kilitli = false;
}
async function pinKur() {
  const p1 = await pinEkrani('Yeni PIN', {iptal: true, alt: '4 haneli bir PIN belirleyin'});
  if (!p1) return false;
  const p2 = await pinEkrani('PIN\'i tekrar girin', {iptal: true, kontrol: p => p === p1});
  if (!p2) return false;
  const t = kimlik();
  localStorage.setItem(KILIT_ANAHTAR, JSON.stringify({t, o: pinOzet(p2, t)}));
  bildir('PIN kilidi açıldı');
  return true;
}
async function pinKaldir() {
  const k = kilitAyar();
  if (!k) return;
  const p = await pinEkrani('Mevcut PIN', {iptal: true, kontrol: p => pinOzet(p, k.t) === k.o});
  if (!p) return false;
  localStorage.removeItem(KILIT_ANAHTAR);
  bildir('PIN kilidi kapatıldı');
  return true;
}
window.arkaPlan = () => { arkaPlanZaman = Date.now(); if (bulutKirli) bulutYaz(); };
window.onPlan = () => { if (arkaPlanZaman && Date.now() - arkaPlanZaman > 30000) kilitle(); arkaPlanZaman = 0; };
document.addEventListener('visibilitychange', () => document.hidden ? window.arkaPlan() : window.onPlan());


/* ================= Bulut yedeği (Google Drive) =================
   Android'de kullanıcı bir kez yedek dosyası seçer (Drive, Dropbox ya da telefon klasörü). Her değişiklikten birkaç saniye
   sonra ve uygulama arka plana geçince TÜM hesapların yedeği o dosyanın üzerine yazılır; dosyayı Drive uygulaması eşitler. */
const BULUT_ANAHTAR = 'dnmuhasebe.bulut';
const bulutVar = () => !!(window.Android && Android.yedekYaz);
const bulutDurum = () => { try { return JSON.parse(localStorage.getItem(BULUT_ANAHTAR)) || {}; } catch (e) { return {}; } };
const bulutKonum = () => { try { const k = bulutVar() && Android.yedekBilgi(); return k ? JSON.parse(k) : null; } catch (e) { return null; } };
function tumYedek() {
  const veriler = {};
  for (const h of H.liste) { const v = h.id === H.aktif ? JSON.stringify(D) : localStorage.getItem(veriAnahtari(h.id)); if (v) veriler[h.id] = JSON.parse(v); }
  return {uygulama: 'dn-muhasebe', tur: 'tum', surum: VERSIYON, tarih: new Date().toISOString(), hesaplar: H, veriler};
}
let bulutZamanlayici = 0, bulutKirli = false;
function bulutYaz() {
  clearTimeout(bulutZamanlayici); bulutKirli = false;
  if (!bulutVar()) return null;
  let hata = '';
  try { hata = Android.yedekYaz(JSON.stringify(tumYedek())) || ''; } catch (e) { hata = String(e.message || e); }
  if (hata === 'yedek dosyası seçilmedi') return null;
  const d = {...bulutDurum(), ...(hata ? {hata, hataZaman: Date.now()} : {zaman: Date.now(), hata: ''})};
  try { localStorage.setItem(BULUT_ANAHTAR, JSON.stringify(d)); } catch (e) {}
  return hata;
}
window.bulutPlanla = () => {
  if (!bulutVar()) return;
  bulutKirli = true; clearTimeout(bulutZamanlayici);
  bulutZamanlayici = setTimeout(bulutYaz, 4000);
  hatirlaticiPlanla();
};
window.yedekKonumSecildi = k => {
  const h = bulutYaz();
  bildir(h ? 'Yedek dosyası seçildi ama yazılamadı: ' + h : `Yedek açıldı: ${k?.yer || 'seçilen konum'}`, !!h);
  if (rota()[0] === 'ayarlar') ayarlarEkrani();
};
async function tumYedektenYukle(j) {
  const n = Object.keys(j.veriler || {}).length;
  if (!await onay('Tüm hesaplar geri yüklensin mi?', `Yedekte ${n} hesap var (${tarihYaz(String(j.tarih).slice(0, 10), true)}). Bu telefondaki tüm hesapların yerine geçer.`, 'Geri yükle')) return;
  for (const h of H.liste) localStorage.removeItem(veriAnahtari(h.id));
  for (const [id, v] of Object.entries(j.veriler)) localStorage.setItem(veriAnahtari(id), JSON.stringify(v));
  H = j.hesaplar; if (!H.liste.some(h => h.id === H.aktif)) H.aktif = H.liste[0].id; hesapKaydet();
  bildir('Yedek geri yüklendi'); setTimeout(() => location.reload(), 600);
}

/* ================= Bildirimler =================
   Yaklaşan fatura vadeleri ve vergi günleri hesaplanıp Android'e verilir; telefon her sabah 09.00'da o günün bildirimlerini gösterir. */
const BILDIRIM_ANAHTAR = 'dnmuhasebe.bildirim';
const bildirimAcik = () => { try { return localStorage.getItem(BILDIRIM_ANAHTAR) !== 'kapali'; } catch (e) { return true; } };
const bildirimVar = () => !!(window.Android && Android.hatirlaticiKur);
function hatirlaticilar() {
  const l = [], bugunT = bugun(), sinir = (() => { const d = tarihNesne(bugunT); d.setDate(d.getDate() + 70); return tarihStr(d); })();
  const ekle = (gun, id, baslik, metin, yol) => { if (gun >= bugunT && gun <= sinir) l.push({gun, id, baslik, metin, yol}); };
  const gunOnce = (t, n) => { const d = tarihNesne(t); d.setDate(d.getDate() - n); return tarihStr(d); };
  const asil = D;
  try {
    for (const h of H.liste) {
      const v = h.id === H.aktif ? asil : (() => { try { return duzelt(JSON.parse(localStorage.getItem(veriAnahtari(h.id)))); } catch (e) { return null; } })();
      if (!v || !v.profil) continue;
      D = v;
      const hesap = H.liste.length > 1 ? ` · ${hesapAdi(h)}` : '';
      if (modulAcik('fatura')) for (const f of D.faturalar) if (faturaliMi(f) && !f.odendi && f.vade) {
        const alis = f.tur === 'alis', kalan = para(faturaKalan(f)), kim = faturaMusteri(f);
        ekle(gunOnce(f.vade, 3), `f3-${f.id}`, alis ? 'Ödeme yaklaşıyor' : 'Tahsilat yaklaşıyor', `${kim} · ${f.no} · ${kalan} · 3 gün sonra${hesap}`, `${h.id}|fatura/${f.id}`);
        ekle(f.vade, `f0-${f.id}`, alis ? 'Bugün ödenecek' : 'Bugün tahsil edilecek', `${kim} · ${f.no} · ${kalan}${hesap}`, `${h.id}|fatura/${f.id}`);
      }
      if (modulAcik('kdv')) for (let i = 0; i < 3; i++) for (const t of vergiTakvimi(ayKaydir(bugunT.slice(0, 7), i))) {
        ekle(gunOnce(t.tarih, 3), `v3-${h.id}-${t.tarih}-${t.ad}`, t.ad, `3 gün sonra son gün · ${t.alt}${hesap}`, `${h.id}|kdv`);
        ekle(t.tarih, `v0-${h.id}-${t.tarih}-${t.ad}`, t.ad, `Bugün son gün · ${t.alt}${hesap}`, `${h.id}|kdv`);
      }
    }
  } finally { D = asil; }
  return l.sort((a, b) => a.gun.localeCompare(b.gun));
}
let hatirlaticiZaman = 0;
function hatirlaticiPlanla() {
  if (!bildirimVar()) return;
  clearTimeout(hatirlaticiZaman);
  hatirlaticiZaman = setTimeout(() => { try { Android.hatirlaticiKur(JSON.stringify(bildirimAcik() ? hatirlaticilar() : [])); } catch (e) {} }, 1500);
}
/* Bildirime dokunulunca: "hesap|yol" biçiminde gelir; gerekirse hesaba geçip sayfayı açar */
window.bildirimAc = hedef => {
  const [id, yol] = String(hedef).split('|');
  if (id && id !== H.aktif && H.liste.some(h => h.id === id)) { H.aktif = id; hesapKaydet(); D = yukle(); ui = uiBaslangic(); }
  git(yol || 'panel', true);
};
/* ================= Ekran ölçeği =================
   Otomatik: ekran genişliğine göre büyütür/küçültür (dizüstü 1366 px'te %100, Full HD'de %115, 2K ve üstünde %130).
   Ayarlar > Görünüm'den sabit bir ölçek seçilebilir. Yazdırırken ölçek kaldırılır. */
const OLCEK_ANAHTAR = 'powerserv.olcek';
const olcekTercih = () => { try { return localStorage.getItem(OLCEK_ANAHTAR) || 'oto'; } catch (e) { return 'oto'; } };
function olcekHesapla() {
  const t = olcekTercih();
  if (t !== 'oto') return +t || 1;
  const w = window.innerWidth;
  return w < 360 ? .9 : w < 1440 ? 1 : w < 1700 ? 1.08 : w < 2200 ? 1.15 : 1.3;
}
/* Tema: açık (varsayılan), koyu ya da sistem. Koyu kurallar CSS'te prefers-color-scheme ile yazılı;
   tercihe göre o medya koşulları açılır/kapanır. */
const TEMA_ANAHTAR = 'powerserv.tema';
const temaTercih = () => { try { return localStorage.getItem(TEMA_ANAHTAR) || 'acik'; } catch (e) { return 'acik'; } };
function temaUygula() {
  const t = temaTercih(), kosul = t === 'koyu' ? 'all' : t === 'acik' ? 'not all' : '(prefers-color-scheme: dark)';
  const gez = kurallar => { for (const r of kurallar) {
    if (r.media && r.cssRules) { if (r.__koyu === undefined) r.__koyu = /prefers-color-scheme:\s*dark/.test(r.media.mediaText); if (r.__koyu) r.media.mediaText = kosul; }
    if (r.cssRules) gez(r.cssRules);
  } };
  for (const ss of document.styleSheets) { try { gez(ss.cssRules); } catch (e) {} }
  const koyu = t === 'koyu' || (t === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.style.colorScheme = koyu ? 'dark' : 'light';
  document.querySelectorAll('meta[name=theme-color]').forEach(m => { m.removeAttribute('media'); m.content = koyu ? '#22252a' : '#ffffff'; });
  try { if (window.Android && Android.tema) Android.tema(koyu); } catch (e) {}
}
temaUygula();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (temaTercih() === 'sistem') temaUygula(); }); } catch (e) {}
function olcekUygula() { document.documentElement.style.zoom = olcekHesapla() === 1 ? '' : String(olcekHesapla()); }
window.addEventListener('resize', olcekUygula);
window.addEventListener('beforeprint', () => { document.documentElement.style.zoom = ''; });
window.addEventListener('afterprint', olcekUygula);
olcekUygula();

/* ================= Başlat ================= */
hesaplariYukle();
D = yukle();
const buAy = bugun().slice(0, 7);
const uiBaslangic = () => ({ay: buAy, pAy: buAy, pSekme: 'liste', vSekme: 'ozet', bAy: buAy, kAy: buAy, rDonem: 'bu-ay', rSekme: 'genel', kasaTur: 'hepsi', kasaAra: '', kisiAra: '', cariTip: 'hepsi', urunAra: '', stokFiltre: 'hepsi', stokKat: '', faturaAra: '', faturaFiltre: 'hepsi', servisFiltre: 'acik', servisAra: ''});
ui = uiBaslangic();
if (!location.hash) history.replaceState(null, '', '#/panel');
ciz();
kilitle();
hatirlaticiPlanla();
</script>
