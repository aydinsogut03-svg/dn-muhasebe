<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>DN Muhasebe</title>
<style>
:root{
  --bg:#f2f2f7;--kart:#fff;--kart2:#f2f2f7;--dolgu:rgba(118,118,128,.12);--dolgu2:rgba(118,118,128,.2);
  --yazi:#000;--ikincil:rgba(60,60,67,.6);--ucuncul:rgba(60,60,67,.3);--ayirici:rgba(60,60,67,.18);
  --mavi:#007aff;--yesil:#34c759;--yesil-yazi:#248a3d;--kirmizi:#ff3b30;--turuncu:#ff9500;--sari:#ffcc00;
  --mor:#af52de;--pembe:#ff2d55;--indigo:#5856d6;--camgobegi:#32ade6;--nane:#00c7be;--kahve:#a2845e;--gri:#8e8e93;
  --cubuk:rgba(249,249,249,.86);--golge:0 1px 3px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--kart:#1c1c1e;--kart2:#2c2c2e;--dolgu:rgba(118,118,128,.24);--dolgu2:rgba(118,118,128,.32);
  --yazi:#fff;--ikincil:rgba(235,235,245,.6);--ucuncul:rgba(235,235,245,.3);--ayirici:rgba(84,84,88,.6);
  --mavi:#0a84ff;--yesil:#30d158;--yesil-yazi:#30d158;--kirmizi:#ff453a;--turuncu:#ff9f0a;--sari:#ffd60a;
  --mor:#bf5af2;--pembe:#ff375f;--indigo:#5e5ce6;--camgobegi:#64d2ff;--nane:#63e6e2;--kahve:#ac8e68;--gri:#8e8e93;
  --cubuk:rgba(22,22,24,.86);--golge:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sayi{font-variant-numeric:tabular-nums}
.gelir{color:var(--yesil-yazi)}.gider{color:var(--kirmizi)}.soluk{color:var(--ikincil)}.mavi{color:var(--mavi)}.turuncu{color:var(--turuncu)}
.gizli{display:none!important}

/* ---- Gezinme çubuğu (iOS nav bar) ---- */
header{position:sticky;top:0;z-index:30;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--bg);transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
header.kaydi{background:var(--cubuk);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--ayirici)}
header .orta-baslik{font-size:17px;font-weight:600;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
header.kaydi .orta-baslik{opacity:1}
header .sol,header .sag{display:flex;align-items:center;gap:4px}
header .sag{justify-content:flex-end}
.nav-btn{background:none;border:0;color:var(--mavi);display:flex;align-items:center;gap:2px;padding:8px;border-radius:10px;font-size:17px;white-space:nowrap}
.nav-btn:active{opacity:.4}
.nav-btn svg{width:24px;height:24px}
.nav-btn.geri svg{width:26px;height:26px;margin-left:-6px;stroke-width:2.4}
.nav-btn.kalin{font-weight:600}

main{max-width:720px;margin:0 auto;padding:0 16px 48px}
main.sekmesiz{padding-bottom:40px}
.buyuk-baslik{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 4px 14px;line-height:1.15;word-break:break-word}
.alt-baslik{color:var(--ikincil);font-size:15px;margin:-10px 4px 16px}

/* ---- Soldan açılan menü (çekmece) ---- */
#cekmece{position:fixed;top:0;bottom:0;left:0;width:min(84vw,310px);z-index:60;background:var(--bg);transform:translateX(-102%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) 0 env(safe-area-inset-bottom);overflow-y:auto;overscroll-behavior:contain}
body.cekmece-acik #cekmece{transform:none;box-shadow:0 0 50px rgba(0,0,0,.28)}
#cekmecePerde{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s}
body.cekmece-acik #cekmecePerde{opacity:1;pointer-events:auto}
.c-ust{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border:0;background:none;width:100%;text-align:left;color:inherit}
.c-ust .kare{width:48px;height:48px;border-radius:13px}
.c-ust .kare svg{width:26px;height:26px}
.c-ust b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ust small{color:var(--ikincil);font-size:14px}
.c-baslik{font-size:13px;color:var(--ikincil);text-transform:uppercase;letter-spacing:.02em;margin:14px 30px 6px}
.c-liste{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.c-liste a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:11px;color:var(--yazi);text-decoration:none;font-size:17px;min-height:46px}
.c-liste a:active{background:var(--dolgu)}
.c-liste .kare{width:30px;height:30px;border-radius:8px}
.c-liste .kare svg{width:18px;height:18px}
.c-liste a span.ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-liste .rozet{font-size:13px;color:var(--ikincil);font-variant-numeric:tabular-nums}
.c-liste .rozet.uyar{background:var(--kirmizi);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600;font-size:12px}
.c-liste a.secili{background:var(--kart);box-shadow:var(--golge);font-weight:600}
@media (prefers-color-scheme:dark){.c-liste a.secili{background:var(--kart2)}}
.c-alt{margin-top:auto;padding:22px 30px 18px;color:var(--ikincil);font-size:12.5px;line-height:1.5}
.menu-btn svg{width:26px;height:26px}
body.profilde #cekmece,body.profilde .menu-btn{display:none!important}
@media (min-width:960px){
  body:not(.profilde){padding-left:310px}
  body:not(.profilde) #cekmece{transform:none;border-right:.5px solid var(--ayirici);box-shadow:none}
  #cekmecePerde,.menu-btn{display:none!important}
}

/* ---- Gruplu listeler (inset grouped) ---- */
.bolum{font-size:13px;color:var(--ikincil);text-transform:uppercase;letter-spacing:.02em;margin:0 16px 7px;display:flex;justify-content:space-between;align-items:flex-end}
.bolum a,.bolum button{color:var(--mavi);text-transform:none;font-size:15px;letter-spacing:-.01em;text-decoration:none;background:none;border:0;padding:0}
.dipnot{font-size:13px;color:var(--ikincil);margin:-14px 16px 22px;line-height:1.4}
.grup{background:var(--kart);border-radius:12px;overflow:hidden;margin:0 0 24px;box-shadow:var(--golge)}
.hucre{--girinti:16px;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 16px;position:relative;width:100%;background:none;border:0;text-align:left;color:inherit;font:inherit;text-decoration:none}
.hucre+.hucre::before{content:"";position:absolute;top:0;left:var(--girinti);right:0;border-top:.5px solid var(--ayirici)}
button.hucre:active,a.hucre:active{background:var(--dolgu)}
.hucre .ic{flex:1;min-width:0;padding:11px 0}
.hucre .ic b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hucre .ic b.k{font-weight:600}
.hucre .ic small{display:block;color:var(--ikincil);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hucre .deger{color:var(--ikincil);white-space:nowrap;text-align:right}
.hucre .tutar{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.hucre .tutar small{display:block;font-size:13px;font-weight:400;color:var(--ikincil)}
.hucre .chev{width:15px;height:15px;color:var(--ucuncul);stroke-width:2.6;margin-right:-4px}
.hucre.kareli{--girinti:58px}
.hucre.avatarli{--girinti:68px}
.hucre.tehlike{color:var(--kirmizi);justify-content:center}
.hucre.eylem{color:var(--mavi)}
.kare{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.kare svg{width:18px;height:18px;stroke-width:2.2}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;color:#fff;background:linear-gradient(180deg,#a5abb8,#858994)}
.avatar svg{width:20px;height:20px;stroke-width:2.4}
.avatar.buyuk{width:64px;height:64px;font-size:24px;margin:0 auto 10px}
.r-mavi{background:var(--mavi)}.r-yesil{background:var(--yesil)}.r-kirmizi{background:var(--kirmizi)}.r-turuncu{background:var(--turuncu)}
.r-mor{background:var(--mor)}.r-pembe{background:var(--pembe)}.r-indigo{background:var(--indigo)}.r-camgobegi{background:var(--camgobegi)}
.r-kahve{background:var(--kahve)}.r-gri{background:var(--gri)}.r-nane{background:var(--nane)}.r-sari{background:var(--sari)}
.hap{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--dolgu);color:var(--ikincil);vertical-align:2px;margin-left:6px;letter-spacing:0}
.hap.yesil{background:rgba(52,199,89,.15);color:var(--yesil-yazi)}
.hap.kirmizi{background:rgba(255,59,48,.13);color:var(--kirmizi)}
.hap.turuncu{background:rgba(255,149,0,.15);color:var(--turuncu)}
.hap.mavi{background:rgba(0,122,255,.12);color:var(--mavi)}
.bos{text-align:center;color:var(--ikincil);padding:34px 24px 30px}
.bos .kare{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
.bos .kare svg{width:30px;height:30px}
.bos b{display:block;color:var(--yazi);font-size:17px;margin-bottom:4px}
.bos p{margin:0 0 16px;font-size:15px}

/* ---- Kartlar ---- */
.kart{background:var(--kart);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--golge)}
.kart-ust{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.kart-ust .kare{width:24px;height:24px;border-radius:6px}
.kart-ust .kare svg{width:15px;height:15px}
.kart-ust .sagda{margin-left:auto;font-weight:400;color:var(--ikincil);font-size:15px;display:flex}
.kart-ust .chev{width:15px;height:15px;color:var(--ucuncul);stroke-width:2.6}
a.kart{display:block;color:inherit;text-decoration:none}
a.kart:active{opacity:.7}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ozet div{min-width:0}
.ozet small{display:block;color:var(--ikincil);font-size:13px}
.ozet b{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dev{font-size:32px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.dev.orta{font-size:22px}
.dev .birim{font-size:15px;font-weight:500;color:var(--ikincil)}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ikili .kart{margin:0;min-width:0}
.k-alt{font-size:13px;color:var(--ikincil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-ust{font-size:14px;color:var(--ikincil)}

/* Hızlı işlem kutuları */
.hizli{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.hizli button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border:0;border-radius:16px;background:var(--kart);font-size:12.5px;font-weight:500;box-shadow:var(--golge);letter-spacing:0;min-width:0}
.hizli button:active{transform:scale(.96);opacity:.85}
.hizli .kare{width:42px;height:42px;border-radius:50%}
.hizli .kare svg{width:22px;height:22px}

/* İlerleme çubukları */
.ilerleme{height:8px;background:var(--dolgu);border-radius:99px;overflow:hidden;margin-top:7px}
.ilerleme i{display:block;height:100%;border-radius:99px;background:var(--yesil);transition:width .3s}
.ilerleme i.uyar{background:var(--turuncu)}.ilerleme i.asim{background:var(--kirmizi)}.ilerleme i.mor{background:var(--mor)}
.cubuk-satir{padding:10px 0;display:block;width:100%;border:0;background:none;text-align:left}
.cubuk-satir+.cubuk-satir{border-top:.5px solid var(--ayirici)}
.cubuk-satir .ust{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.cubuk-satir .ust span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Butonlar ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;min-height:50px;padding:0 18px;font-size:17px;font-weight:600;background:var(--mavi);color:#fff;width:100%}
.btn:active{opacity:.75}
.btn svg{width:20px;height:20px;stroke-width:2.4}
.btn.renkli{background:rgba(0,122,255,.13);color:var(--mavi)}
.btn.yesil-acik{background:rgba(52,199,89,.15);color:var(--yesil-yazi)}
.btn.kirmizi-acik{background:rgba(255,59,48,.12);color:var(--kirmizi)}
.btn.kucuk{min-height:38px;font-size:15px;border-radius:99px;width:auto;padding:0 16px;margin:0 auto}
.btn-grup{display:flex;gap:10px;margin-bottom:16px}
.btn-grup .btn{flex:1;min-width:0}
.btn-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px;margin-bottom:20px}
.btn-izgara button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--kart);border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:500;color:var(--mavi);box-shadow:var(--golge);letter-spacing:0}
.btn-izgara button:active{opacity:.6}
.btn-izgara button:disabled{opacity:.35}
.btn-izgara svg{width:24px;height:24px}

/* Segment kontrol */
.segment{display:flex;background:var(--dolgu);border-radius:9px;padding:2px;gap:2px;margin-bottom:16px}
.segment button,.segment label{flex:1;border:0;background:none;padding:6px 4px;border-radius:7px;font-weight:500;font-size:14px;text-align:center;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.segment input{display:none}
.segment label span{display:block;margin:-6px -4px;padding:6px 4px;border-radius:7px}
.segment .secili,.segment input:checked+span{background:var(--kart);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.segment .secili,.segment input:checked+span{background:#636366}}

/* Arama */
.arama{display:flex;align-items:center;gap:6px;background:var(--dolgu);border-radius:10px;padding:0 8px;margin-bottom:16px;height:38px}
.arama input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:17px;padding:0;-webkit-appearance:none;appearance:none}
.arama input::placeholder{color:var(--ikincil)}
.arama svg{color:var(--ikincil);width:18px;height:18px}

/* Ay seçici */
.ay-secici{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 14px}
.ay-secici b{font-size:17px;font-weight:600;text-transform:capitalize}
.ay-secici button{border:0;background:var(--dolgu);color:var(--mavi);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.ay-secici button svg{width:20px;height:20px;stroke-width:2.6}

/* ---- Formlar ---- */
.f-satir{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 16px;position:relative}
.f-satir+.f-satir::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--ayirici)}
.f-satir>span:first-child{flex:none;min-width:84px}
.f-satir input,.f-satir select,.f-satir textarea{flex:1;min-width:0;border:0;background:none;outline:0;text-align:right;padding:11px 0;font-size:17px;color:var(--yazi)}
.f-satir input::placeholder,.f-satir textarea::placeholder{color:var(--ucuncul)}
.f-satir.sol input,.f-satir.sol textarea{text-align:left}
.f-satir textarea{resize:none;min-height:72px;text-align:left}
.f-satir select{appearance:none;-webkit-appearance:none;color:var(--mavi);text-align:right;text-align-last:right}
.f-satir input[type=date],.f-satir input[type=month]{color:var(--mavi);text-align:right;min-height:44px}
.f-satir>input[type=checkbox]{display:none}
.tutar-kutu{background:var(--kart);border-radius:12px;padding:14px 16px 10px;margin-bottom:20px;text-align:center}
.tutar-kutu small{display:block;color:var(--ikincil);font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.tutar-giris{width:100%;border:0;background:none;outline:0;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.01em;padding:4px 0;font-variant-numeric:tabular-nums}
.tutar-giris::placeholder{color:var(--ucuncul)}
.cipler{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 22px}
.cip{border:0;background:var(--kart);padding:8px 14px;border-radius:99px;font-size:15px;box-shadow:var(--golge);letter-spacing:0}
.cip.secili{background:var(--mavi);color:#fff}
.anahtar{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.anahtar input{opacity:0;width:0;height:0;position:absolute}
.anahtar span{position:absolute;inset:0;background:var(--dolgu2);border-radius:99px;transition:.2s}
.anahtar span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.anahtar input:checked+span{background:var(--yesil)}
.anahtar input:checked+span:before{transform:translateX(20px)}

/* ---- Alt sayfalar (modal) ---- */
.perde{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.perde.acik{background:rgba(0,0,0,.4)}
.modal{background:var(--bg);width:100%;max-width:600px;max-height:94vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.perde.acik .modal{transform:none}
.modal.tam{height:94vh}
.modal-ust{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 6px;flex:none}
.modal-ust b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.modal-ust .sag{display:flex;justify-content:flex-end}
.modal-govde{overflow:auto;padding:10px 16px 28px;flex:1;-webkit-overflow-scrolling:touch}
.tutamak{width:36px;height:5px;border-radius:9px;background:var(--ucuncul);margin:6px auto 0}
/* Eylem sayfası (action sheet) */
.eylem-perde{padding:0 8px 10px}
.eylem{width:100%;max-width:560px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.perde.acik .eylem{transform:none}
.eylem .grup{margin-bottom:8px;border-radius:14px;background:var(--kart)}
.eylem .baslik{padding:14px 16px 12px;text-align:center;font-size:13px;color:var(--ikincil)}
.eylem .baslik b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.eylem button{display:block;width:100%;border:0;background:none;color:var(--mavi);font-size:19px;padding:16px;border-top:.5px solid var(--ayirici)}
.eylem button:active{background:var(--dolgu)}
.eylem button.ilk{border-top:0}
.eylem button.tehlike{color:var(--kirmizi)}
.eylem button.iptal{font-weight:600;border:0;background:var(--kart);border-radius:14px}

/* Profil seçimi */
.karsilama{text-align:center;padding:20px 8px 8px}
.logo{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#1d4f7a,#0f2a44);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-weight:800;font-size:26px;letter-spacing:.02em;box-shadow:0 6px 20px rgba(15,42,68,.3)}
.karsilama h2{margin:0 0 6px;font-size:28px;font-weight:700}
.karsilama p{margin:0 0 22px;color:var(--ikincil);font-size:16px}
.profil-kart{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--kart);border:2px solid transparent;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--golge)}
.profil-kart:active{transform:scale(.98)}
.profil-kart.secili{border-color:var(--mavi)}
.profil-kart .kare{width:46px;height:46px;border-radius:12px}
.profil-kart .kare svg{width:26px;height:26px}
.profil-kart b{display:block;font-size:18px;font-weight:600;margin-bottom:2px}
.profil-kart small{display:block;color:var(--ikincil);font-size:14.5px}
.profil-kart .etiketler{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.profil-kart .etiketler span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--dolgu);color:var(--ikincil);letter-spacing:0}
.kare.profil{width:46px;height:46px;border-radius:12px}

/* Menü ızgarası */
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:20px 8px;margin:4px 0 28px}
.izgara a{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--yazi);font-size:13px;text-align:center;letter-spacing:0}
.izgara a:active{opacity:.6}
.izgara .kare{width:62px;height:62px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.izgara .kare svg{width:30px;height:30px;stroke-width:2}

/* Grafik */
.grafik svg{width:100%;height:auto;display:block}
.grafik .ek{font-size:10px;fill:var(--ikincil)}
.lejant{display:flex;gap:14px;font-size:13px;color:var(--ikincil);margin-top:6px}
.lejant i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Fatura önizleme */
.kagit{background:#fff;color:#111;border-radius:12px;padding:20px 18px;margin-bottom:20px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
.kagit .ust{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.kagit h3{margin:0 0 4px;font-size:20px;letter-spacing:.04em}
.kagit .gri{color:#666;font-size:12.5px;line-height:1.45}
.kagit table{width:100%;border-collapse:collapse;margin:10px 0}
.kagit th{font-size:11.5px;text-transform:uppercase;color:#666;text-align:left;border-bottom:1px solid #ddd;padding:6px 4px;font-weight:600}
.kagit td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:top}
.kagit .sg{text-align:right;white-space:nowrap}
.kagit .toplamlar{margin-left:auto;width:min(100%,260px)}
.kagit .toplamlar div{display:flex;justify-content:space-between;padding:3px 0}
.kagit .toplamlar .genel{font-weight:700;font-size:16px;border-top:2px solid #111;margin-top:4px;padding-top:7px}
.kagit h4{margin:18px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#444}
.kagit .kutular{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kagit .kutular div{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.kagit .kutular small{display:block;color:#666;font-size:11px}
.kagit .kutular b{font-size:15px}
.kagit tr.top td{font-weight:700;border-top:2px solid #111}
.kagit.puantaj table{font-size:10px}
.kagit.puantaj td,.kagit.puantaj th{padding:3px 1px;text-align:center;border:1px solid #ddd}
.kagit.puantaj td:first-child{text-align:left;white-space:nowrap;padding-right:4px}
#yazdirAlani{display:none}
@media print{
  body>*:not(#yazdirAlani){display:none!important}
  #yazdirAlani{display:block!important}
  #yazdirAlani .kagit{box-shadow:none;padding:0;font-size:12pt}
  html,body{background:#fff}
  @page{size:A4;margin:12mm}
  .kagit h4,.kagit tr{break-inside:avoid}
}

/* Puantaj takvimi */
.takvim-ust,.takvim{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.takvim-ust{font-size:12px;color:var(--ikincil);text-align:center;margin-bottom:6px;font-weight:600}
.takvim{margin-bottom:14px}
.takvim button{border:0;border-radius:10px;height:48px;width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:600;color:var(--yazi);background:var(--kart);box-shadow:var(--golge);padding:0;letter-spacing:0}
.takvim button small{font-size:10px;font-weight:600;line-height:1}
.takvim button:active{opacity:.6}
.takvim-bos{visibility:hidden}
.d-C small{color:var(--yesil-yazi)}
.d-H,.d-T{background:var(--dolgu)!important;color:var(--ikincil)!important}
.d-I{background:rgba(0,122,255,.14)!important}.d-I small{color:var(--mavi)}
.d-R{background:rgba(255,149,0,.18)!important}.d-R small{color:var(--turuncu)}
.d-U,.d-D{background:rgba(255,59,48,.14)!important}.d-U small,.d-D small{color:var(--kirmizi)}
.d-Y{opacity:.35}
.puan-lejant{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ikincil);margin:0 4px 18px}
.puan-lejant b{font-weight:700;margin-right:3px}
.satir-ozet{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* Kalem düzenleyici */
.kalem{background:var(--kart);border-radius:12px;margin-bottom:10px;overflow:hidden}
.kalem .f-satir input{font-size:16px}
.kalem-alt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px 10px;font-size:14px;color:var(--ikincil)}
.kalem-alt button{border:0;background:none;color:var(--kirmizi);font-size:14px;padding:4px 0}
.kdv-sec{display:flex;gap:4px}
.kdv-sec button{border:0;background:var(--dolgu);color:var(--yazi);border-radius:7px;padding:4px 8px;font-size:13px;letter-spacing:0}
.kdv-sec button.secili{background:var(--mavi);color:#fff}

/* Bildirim (HUD) */
.bildirim{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px) scale(.96);opacity:0;background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:70;transition:.22s;max-width:calc(100% - 40px);text-align:center;pointer-events:none;display:flex;align-items:center;gap:8px}
.bildirim svg{width:20px;height:20px;stroke-width:2.6;color:var(--yesil)}
.bildirim.goster{opacity:1;transform:translateX(-50%)}
.bildirim.hata svg{color:var(--kirmizi)}
</style>
</head>

/* ================= Bordro motoru (tutarlar kuruş) =================
   Kaynak: 2026 bordro parametreleri (asgari ücret 33.030 TL brüt, SGK tavanı 9 kat, işveren %21,75). */
const BORDRO = {
  2025: {asgari: 2600550, tavanKat: 7.5, sgkIsci: 14, issizIsci: 1, sgkIsv: 20.75, issizIsv: 2, damga: .759,
    ucret: [[15800000, 15], [33000000, 20], [120000000, 27], [430000000, 35], [Infinity, 40]],
    diger: [[15800000, 15], [33000000, 20], [80000000, 27], [430000000, 35], [Infinity, 40]]},
  2026: {asgari: 3303000, tavanKat: 9, sgkIsci: 14, issizIsci: 1, sgkIsv: 21.75, issizIsv: 2, damga: .759,
    ucret: [[19000000, 15], [40000000, 20], [150000000, 27], [530000000, 35], [Infinity, 40]],
    diger: [[19000000, 15], [40000000, 20], [100000000, 27], [530000000, 35], [Infinity, 40]]}
};
const bordroParam = yil => { const y = Object.keys(BORDRO).map(Number).filter(x => x <= yil); return BORDRO[y.length ? Math.max(...y) : 2025]; };
function vergiDilim(matrah, dilimler) {
  let v = 0, alt = 0;
  for (const [ust, oran] of dilimler) {
    if (matrah <= alt) break;
    v += (Math.min(matrah, ust) - alt) * oran / 100;
    alt = ust;
  }
  return Math.round(v);
}
const marjinalOran = (matrah, dilimler) => (dilimler.find(([ust]) => matrah <= ust) || dilimler[dilimler.length - 1])[1];
/* Tek ayın bordrosu. kum: yılbaşından önceki ayların gelir vergisi matrahı toplamı; gun: SGK gün sayısı (eksik günler düşülmüş). */
function bordroAy(brut, ay, kum = 0, gun = 30, tesvik = D.bordroAyar.tesvik) {
  const P = bordroParam(+ay.slice(0, 4)), aySira = +ay.slice(5, 7);
  const sgkMatrah = Math.min(brut, Math.round(P.asgari * P.tavanKat * gun / 30));
  const sgkI = Math.round(sgkMatrah * P.sgkIsci / 100), issI = Math.round(sgkMatrah * P.issizIsci / 100);
  const gvMatrah = brut - sgkI - issI;
  const gvHam = vergiDilim(kum + gvMatrah, P.ucret) - vergiDilim(kum, P.ucret);
  // Asgari ücret istisnası: asgari ücretin (gün oranında) vergisi herkesin vergisinden düşülür.
  const au = Math.round(P.asgari * gun / 30), auMatrah = au - Math.round(au * (P.sgkIsci + P.issizIsci) / 100);
  const auKum = (P.asgari - Math.round(P.asgari * (P.sgkIsci + P.issizIsci) / 100)) * (aySira - 1);
  const gvIst = Math.min(gvHam, vergiDilim(auKum + auMatrah, P.ucret) - vergiDilim(auKum, P.ucret));
  const dvHam = Math.round(brut * P.damga / 100), dvIst = Math.min(dvHam, Math.round(au * P.damga / 100));
  const gv = gvHam - gvIst, dv = dvHam - dvIst;
  const net = brut - sgkI - issI - gv - dv;
  const isvSgk = Math.round(sgkMatrah * (P.sgkIsv - (tesvik || 0)) / 100), issV = Math.round(sgkMatrah * P.issizIsv / 100);
  return {brut, gun, sgkMatrah, sgkI, issI, gvMatrah, kum, gvHam, gvIst, gv, dvHam, dvIst, dv, net, isvSgk, issV,
    tesvikTutar: Math.round(sgkMatrah * (tesvik || 0) / 100), maliyet: brut + isvSgk + issV, oranIsv: P.sgkIsv - (tesvik || 0), marjinal: marjinalOran(kum + gvMatrah, P.ucret)};
}
/* Net ücreti verecek brütü bulur (ikili arama). */
function nettenBrut(net, ay, kum = 0, gun = 30) {
  if (!(net > 0)) return 0;
  let a = net, b = net * 3;
  for (let i = 0; i < 60 && b - a > 1; i++) { const m = Math.floor((a + b) / 2); bordroAy(m, ay, kum, gun).net < net ? a = m : b = m; }
  return bordroAy(a, ay, kum, gun).net >= net ? a : b;
}
/* Personelin o ayki bordrosu: ücret tipi (net/brüt), yılbaşından birikmiş matrah ve puantaj birlikte. */
function bordro(p, ay) {
  const yil = ay.slice(0, 4), giris = p.iseGiris && p.iseGiris.slice(0, 4) === yil ? +p.iseGiris.slice(5, 7) : 1;
  let kum = 0, b = null;
  for (let m = giris; m <= +ay.slice(5, 7); m++) {
    const a = `${yil}-${iki(m)}`, pu = puantajOzet(p, a);
    const tamBrut = p.ucretTip === 'brut' ? (p.maas || 0) : nettenBrut(p.maas || 0, a, kum);
    const gunluk = tamBrut / 30;
    const brut = Math.round(gunluk * pu.gun + gunluk / 7.5 * 1.5 * pu.mesai);
    b = bordroAy(brut, a, kum, pu.gun);
    b.tamBrut = tamBrut; b.mesaiUcret = Math.round(gunluk / 7.5 * 1.5 * pu.mesai); b.puantaj = pu;
    kum += b.gvMatrah;
  }
  return b || bordroAy(0, ay);
}

/* ================= Puantaj ================= */
const PUANTAJ = {
  C: {ad: 'Çalıştı', kisa: 'Ç'}, H: {ad: 'Hafta tatili', kisa: 'HT'}, T: {ad: 'Resmi tatil', kisa: 'RT'},
  I: {ad: 'Yıllık izin', kisa: 'İ'}, R: {ad: 'Raporlu', kisa: 'R', eksik: true}, U: {ad: 'Ücretsiz izin', kisa: 'Üİ', eksik: true},
  D: {ad: 'Devamsız', kisa: 'D', eksik: true}, Y: {ad: 'İşe başlamadı / ayrıldı', kisa: '–', eksik: true}
};
// Resmi tatiller (yarım günler hariç). Dini bayramlar yıllara göre eklenir.
const RESMI_TATIL = ['01-01', '04-23', '05-01', '05-19', '07-15', '08-30', '10-29'];
const DINI_TATIL = {2025: ['03-30', '03-31', '04-01', '06-06', '06-07', '06-08', '06-09'], 2026: ['03-20', '03-21', '03-22', '05-27', '05-28', '05-29', '05-30'], 2027: ['03-10', '03-11', '03-12', '05-16', '05-17', '05-18', '05-19']};
const resmiTatilMi = t => RESMI_TATIL.includes(t.slice(5)) || (DINI_TATIL[t.slice(0, 4)] || []).includes(t.slice(5));
function puantajGun(p, ay, g) {
  const t = `${ay}-${iki(g)}`, k = D.puantaj[ay]?.[p.id]?.g?.[iki(g)];
  if (k) return k;
  if ((p.iseGiris && t < p.iseGiris) || (p.cikis && t > p.cikis)) return 'Y';
  if (resmiTatilMi(t)) return 'T';
  return tarihNesne(t).getDay() === 0 ? 'H' : 'C';
}
function puantajOzet(p, ay) {
  const son = ayinSonGunu(ay), say = {};
  for (let g = 1; g <= son; g++) { const k = puantajGun(p, ay, g); say[k] = (say[k] || 0) + 1; }
  const eksik = Object.entries(say).filter(([k]) => PUANTAJ[k].eksik).reduce((s, [, v]) => s + v, 0);
  // SGK'da ay 30 gün sayılır; eksik gün yoksa 30, varsa 30 - eksik.
  return {say, eksik, gun: eksik >= son ? 0 : Math.max(0, 30 - eksik), mesai: D.puantaj[ay]?.[p.id]?.mesai || 0};
}

/* ================= Modal, eylem sayfası, onay ================= */
const yigin = [];
function perdeAc(icHtml, sinif = '') {
  const el = document.createElement('div');
  el.className = 'perde ' + sinif;
  el.innerHTML = icHtml;
  el.addEventListener('click', e => { if (e.target === el) kapat(); });
  document.body.appendChild(el);
  yigin.push(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('acik')));
  return el;
}
function kapat() {
  const el = yigin.pop();
  if (!el) return false;
  el.classList.remove('acik');
  if (el._kapaninca) el._kapaninca();
  setTimeout(() => el.remove(), 300);
  return true;
}
/* iOS tarzı form penceresi: Vazgeç | Başlık | Kaydet */
function modal(baslik, govde, {kaydet: kaydetFn, kaydetAd = 'Kaydet', tam = false, solAd = 'Vazgeç'} = {}) {
  const el = perdeAc(`<div class="modal ${tam ? 'tam' : ''}" role="dialog" aria-modal="true">
    <div class="tutamak"></div>
    <div class="modal-ust"><div><button class="nav-btn" data-sol>${esc(solAd)}</button></div><b>${esc(baslik)}</b>
      <div class="sag">${kaydetFn ? `<button class="nav-btn kalin" data-sag>${esc(kaydetAd)}</button>` : ''}</div></div>
    <div class="modal-govde">${govde}</div></div>`);
  const m = $('.modal', el);
  $('[data-sol]', m).onclick = () => kapat();
  if (kaydetFn) $('[data-sag]', m).onclick = () => { if (kaydetFn(m) !== false) kapat(); };
  anahtarBagla(m);
  return m;
}
function eylemSayfa(baslik, aciklama, eylemler) {
  return new Promise(coz => {
    let bitti = false;
    const sec = v => { if (!bitti) { bitti = true; coz(v); } };
    const ust = baslik || aciklama;
    const el = perdeAc(`<div class="eylem"><div class="grup">
      ${ust ? `<div class="baslik">${baslik ? `<b>${esc(baslik)}</b>` : ''}${esc(aciklama || '')}</div>` : ''}
      ${eylemler.map((e, i) => `<button data-i="${i}" class="${e.tehlike ? 'tehlike' : ''} ${!ust && !i ? 'ilk' : ''}">${esc(e.ad)}</button>`).join('')}
      </div><button class="iptal" data-iptal>Vazgeç</button></div>`, 'eylem-perde');
    el._kapaninca = () => sec(null);
    $$('[data-i]', el).forEach(b => b.onclick = () => { sec(eylemler[+b.dataset.i].deger ?? +b.dataset.i); kapat(); });
    $('[data-iptal]', el).onclick = () => kapat();
  });
}

let sonRota = '';

/* ================= Ortak hesaplar ================= */
function aralikToplam(bas, son) {
  let gelir = 0, gider = 0;
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son) i.tur === 'gelir' ? gelir += i.tutar : gider += i.tutar;
  return {gelir, gider, net: gelir - gider};
}
const ayAraligi = ym => [ym + '-01', ym + '-' + iki(ayinSonGunu(ym))];
const ayToplam = ym => aralikToplam(...ayAraligi(ym));
/* Cari hareket: borc/odeme bakiyeyi artırır (bize borçlu), tahsilat/alis azaltır (biz borçluyuz). */
const hareketArti = tur => tur === 'borc' || tur === 'odeme';
const hareketAd = (tur, t = T()) => ({borc: t.borcKisa, tahsilat: t.tahsilatKisa, alis: 'Alış faturası', odeme: 'Ödeme yapıldı'})[tur];
function kisiBakiye(id) {
  let b = 0;
  for (const h of D.hareketler) if (h.kisiId === id) b += hareketArti(h.tur) ? h.tutar : -h.tutar;
  return b;
}
const kisi = id => D.kisiler.find(k => k.id === id);
const islemOlustur = o => { const i = {id: kimlik(), olusturma: Date.now(), odeme: 'nakit', aciklama: '', ...o}; D.islemler.push(i); return i; };
/* Başka modülden türetilen kayıtlar "kaynak" taşır; kaynak değişince silinip yeniden oluşturulur. */
function turetilenleriSil(id) {
  D.islemler = D.islemler.filter(i => i.kaynak?.id !== id);
  D.hareketler = D.hareketler.filter(h => h.kaynak?.id !== id);
  D.stokHareket = D.stokHareket.filter(s => s.kaynak?.id !== id);
}
function kaynakBilgi(k) {
  if (!k) return null;
  if (k.tip === 'fatura') { const f = D.faturalar.find(x => x.id === k.id); return f && {ad: `${faturaTurAd(f)} ${f.no}`, yol: 'fatura/' + f.id}; }
  if (k.tip === 'personel') { const p = D.personeller.find(x => x.id === k.ust); return p && {ad: p.ad, yol: 'personel/' + p.id}; }
  if (k.tip === 'stok') { const u = D.urunler.find(x => x.id === k.ust); return u && {ad: u.ad, yol: 'stok/' + u.id}; }
  return null;
}
const kategoriBul = (liste, desen, yedek) => liste.find(k => desen.test(k)) || yedek;
const bosDurum = (simge, renk, baslik, metin, btn = '') => `<div class="grup bos">${kare(simge, renk)}<b>${esc(baslik)}</b><p>${esc(metin)}</p>${btn}</div>`;
const kucukKart = (yol, simge, renk, baslik, deger, alt, altSinif = '') => `<a class="kart" href="#/${yol}"><div class="kart-ust">${kare(simge, renk)}${esc(baslik)}</div>
  <div class="dev orta">${deger}</div><div class="k-alt ${altSinif}">${esc(alt)}</div></a>`;

function kasaListe() {

function faturaHesap(f) {
  let ara = 0, kdv = 0; const oranlar = {};
  for (const k of f.kalemler || []) {
    const t = Math.round((k.miktar || 0) * (k.fiyat || 0));
    const kd = Math.round(t * (k.kdv || 0) / 100);
    ara += t; kdv += kd;
    if (k.kdv) oranlar[k.kdv] = (oranlar[k.kdv] || 0) + kd;
  }
  return {ara, kdv, oranlar, toplam: ara + kdv};
}

  if (f.tur === 'teklif') return f.donustu ? ['Faturalandı', 'yesil'] : ['Teklif', 'mavi'];
  if (f.durum === 'taslak') return ['Taslak', ''];
  if (f.odendi) return ['Ödendi', 'yesil'];
  if (f.vade && f.vade < bugun()) return ['Vadesi geçti', 'kirmizi'];
  return ['Ödenmedi', 'turuncu'];
}

function faturaTiklari(kok = document) { $$('[data-fatura]', kok).forEach(b => b.onclick = () => git('fatura/' + b.dataset.fatura)); }
function sonrakiNo(tur) {

function kdvAy(ay) {

  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kdv && i.kaynak?.tip !== 'fatura') i.tur === 'gelir' ? digerGelir += i.kdv : digerGider += i.kdv;

  if (m === 3) l.push({tarih: `${ay}-31`, ad: 'Yıllık gelir vergisi beyannamesi', alt: `${y - 1} yılı`});
  if (m === 4) l.push({tarih: `${ay}-30`, ad: 'Kurumlar vergisi beyannamesi', alt: `${y - 1} yılı`});
  if (m === 1 || m === 7) l.push({tarih: son, ad: 'Motorlu taşıtlar vergisi', alt: m === 1 ? '1. taksit' : '2. taksit'});
  if (m === 5 || m === 11) l.push({tarih: son, ad: 'Emlak vergisi', alt: m === 5 ? '1. taksit' : '2. taksit'});

/* Dönem kârı (KDV hariç): kesilen ve alınan faturalar fatura tarihinde, faturasız kasa kayıtları kayıt tarihinde sayılır. */
function donemKar(bas, son) {
  let gelir = 0, gider = 0, satisF = 0, alisF = 0;
  for (const f of D.faturalar) if (faturaliMi(f) && f.tarih >= bas && f.tarih <= son) { const a = faturaHesap(f).ara; f.tur === 'alis' ? alisF += a : satisF += a; }
  for (const i of D.islemler) if (i.tarih >= bas && i.tarih <= son && i.kaynak?.tip !== 'fatura') { const t = i.tutar - (i.kdv || 0); i.tur === 'gelir' ? gelir += t : gider += t; }
  return {gelir: gelir + satisF, gider: gider + alisF, satisF, alisF, kar: gelir + satisF - gider - alisF};
}
function geciciVergiler(yil) {
  const kurum = vergiTuru() === 'kurum', oran = kurum ? 25 : 15;
  let odenen = 0;
  return [3, 6, 9].map((m, i) => {
    const k = donemKar(`${yil}-01-01`, `${yil}-${iki(m)}-${ayinSonGunu(`${yil}-${iki(m)}`)}`);
    const hesap = Math.max(0, Math.round(k.kar * oran / 100)), odenecek = Math.max(0, hesap - odenen);
    odenen += odenecek;
    return {donem: i + 1, son: `${yil}-${iki(m)}`, kar: k.kar, oran, hesap, odenecek, vade: `${yil}-${iki(m + 2)}-17`};
  });
}
function kdvEkrani() {

  h += `<div class="segment" id="vSek">${[['ozet', 'Bu ay'], ['kdv', 'KDV'], ['gelir', vergiTuru() === 'kurum' ? 'Kurumlar V.' : 'Gelir V.'], ['arac', 'Araçlar']].map(([v, a]) => `<button data-v="${v}" class="${sekme === v ? 'secili' : ''}">${a}</button>`).join('')}</div>`;
  if (sekme !== 'arac') h += ayBtnler;
  h += sekme === 'kdv' ? kdvBolum(ay) : sekme === 'gelir' ? gelirVergisiBolum(ay) : sekme === 'arac' ? vergiAraclari() : vergiOzet(ay);
  $('#icerik').innerHTML = h;
  if (sekme !== 'arac') ayBagla('kAy', kdvEkrani);
  $$('#vSek button').forEach(b => b.onclick = () => { ui.vSekme = b.dataset.v; kdvEkrani(); });
  $$('#vTur button').forEach(b => b.onclick = () => { D.vergiAyar.tur = b.dataset.t; kaydet(); kdvEkrani(); });
  $$('[data-git]').forEach(b => b.onclick = () => { ui.vSekme = b.dataset.git; kdvEkrani(); });
  if (sekme === 'arac') vergiAraclariBagla();
}

function vergiAraclariBagla() {

    const t = tutarOku($('#hTutar').value) || 0, oran = +sec('hOran').o, haric = sec('hTip').t === 'haric';

}

    if (f.length) ekler.push(`<div class="hucre"><div class="ic"><b>Kesilen faturalar</b><small>${f.length} adet</small></div><span class="deger">${para(f.reduce((s, x) => s + faturaHesap(x).toplam, 0))}</span></div>`);
    const al = D.faturalar.filter(x => x.tur === 'alis' && x.durum === 'gonderildi' && x.tarih >= bas && x.tarih <= son);
    if (al.length) ekler.push(`<div class="hucre"><div class="ic"><b>Alınan faturalar</b><small>${al.length} adet</small></div><span class="deger">${para(al.reduce((s, x) => s + faturaHesap(x).toplam, 0))}</span></div>`);
  }
  if (modulAcik('personel')) {
    const p = D.personelOdeme.filter(x => x.tarih >= bas && x.tarih <= son);
    if (p.length) ekler.push(`<div class="hucre"><div class="ic"><b>Personel ödemeleri</b><small>${p.length} ödeme</small></div><span class="deger">${para(p.reduce((s, x) => s + x.tutar, 0))}</span></div>`);
  }
  if (modulAcik('stok') && D.urunler.length) ekler.push(`<div class="hucre"><div class="ic"><b>Güncel stok değeri</b><small>${D.urunler.length} ürün, alış fiyatıyla</small></div><span class="deger">${para(stokDegeri())}</span></div>`);
  if (ekler.length) h += `<div class="bolum">Diğer</div><div class="grup">${ekler.join('')}</div>`;
  $('#icerik').innerHTML = h;
  kisiTiklari();
  $$('#dSec button').forEach(b => b.onclick = () => { ui.rDonem = b.dataset.v; raporEkrani(); });
  $('#csvBtn').onclick = async () => {
    const s = await eylemSayfa('Raporu dışa aktar', `${ad} · ${liste.length} kayıt`, [{ad: 'PDF rapor (yazdır / kaydet)', deger: 'pdf'}, {ad: 'Excel tablosu (CSV) paylaş', deger: 'csv'}]);
    if (s === 'pdf') return yazdir(`DN Muhasebe rapor ${ad}`, raporKagit(bas, son, ad, liste));
    if (s !== 'csv') return;
    if (!liste.length) return bildir('Bu dönemde dışa aktarılacak kayıt yok', true);
    const csv = csvYap(['Tarih', 'Tür', 'Kategori', 'Açıklama', 'Ödeme', 'Tutar', 'KDV'], [...liste].sort((a, b) => a.tarih.localeCompare(b.tarih)).map(i =>
      [i.tarih, i.tur === 'gelir' ? 'Gelir' : 'Gider', i.kategori, i.aciklama, odemeAdi[i.odeme] || '', csvTL((i.tur === 'gelir' ? 1 : -1) * i.tutar), csvTL(i.kdv)]));
    try { bildir('Kaydedildi: ' + dosyaPaylas(`dn-muhasebe-${bas}_${son}.csv`, csv, 'text/csv')); } catch (e) { bildir('Kaydedilemedi', true); }
  };
}
/* Yazdırılabilir dönem raporu (PDF) */
function raporKagit(bas, son, ad, liste) {
  const o = aralikToplam(bas, son);
  const dag = tur => {
    const g = {};
    for (const i of liste) if (i.tur === tur) g[i.kategori] = (g[i.kategori] || 0) + i.tutar;
    const s = Object.entries(g).sort((a, b) => b[1] - a[1]), top = s.reduce((a, [, v]) => a + v, 0);
    return s.length ? `<h4>${tur === 'gelir' ? 'Gelir' : 'Gider'} dağılımı</h4><table><tbody>${s.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="sg">%${Math.round(v / top * 100)}</td><td class="sg">${para(v)}</td></tr>`).join('')}<tr class="top"><td>Toplam</td><td></td><td class="sg">${para(top)}</td></tr></tbody></table>` : '';
  };
  const aylar = [];
  for (let a = bas.slice(0, 7); a <= son.slice(0, 7); a = ayKaydir(a, 1)) aylar.push(a);
  const ekler = [];
  if (modulAcik('veresiye')) { const t = D.kisiler.reduce((s, k) => s + Math.max(0, kisiBakiye(k.id)), 0); if (t) ekler.push([T().alacakToplam + ' (bugün)', para(t)]); }
  if (modulAcik('fatura')) { const f = D.faturalar.filter(x => x.tur === 'fatura' && x.durum === 'gonderildi' && x.tarih >= bas && x.tarih <= son); if (f.length) ekler.push([`Kesilen faturalar (${f.length})`, para(f.reduce((s, x) => s + faturaHesap(x).toplam, 0))]);
    const al = D.faturalar.filter(x => x.tur === 'alis' && x.durum === 'gonderildi' && x.tarih >= bas && x.tarih <= son); if (al.length) ekler.push([`Alınan faturalar (${al.length})`, para(al.reduce((s, x) => s + faturaHesap(x).toplam, 0))]); }
  if (modulAcik('personel')) { const p = D.personelOdeme.filter(x => x.tarih >= bas && x.tarih <= son); if (p.length) ekler.push([`Personel ödemeleri (${p.length})`, para(p.reduce((s, x) => s + x.tutar, 0))]); }
  if (modulAcik('stok') && D.urunler.length) ekler.push(['Stok değeri (bugün, alış fiyatıyla)', para(stokDegeri())]);
  if (modulAcik('kdv')) { let h = 0, i = 0; for (const a of aylar) { const k = kdvAy(a); h += k.hesaplanan; i += k.indirilecek; } if (h || i) ekler.push(['Hesaplanan / indirilecek KDV', `${para(h)} / ${para(i)}`]); }
  return `<div class="kagit">${firmaBaslik('GELİR - GİDER RAPORU', `<span style="text-transform:capitalize">${esc(ad)}</span><br>${esc(tarihYaz(bas, true))} – ${esc(tarihYaz(son, true))}<br>Hazırlanma: ${esc(tarihYaz(bugun(), true))}`)}
    <div class="kutular"><div><small>Gelir</small><b>${para(o.gelir)}</b></div><div><small>Gider</small><b>${para(o.gider)}</b></div><div><small>Net ${o.net < 0 ? 'zarar' : 'kâr'}</small><b>${para(o.net)}</b></div><div><small>Kayıt</small><b>${liste.length}</b></div></div>
    ${aylar.length > 1 ? `<h4>Aylık özet</h4><table><thead><tr><th>Ay</th><th class="sg">Gelir</th><th class="sg">Gider</th><th class="sg">Net</th></tr></thead><tbody>
      ${aylar.map(a => { const t = ayToplam(a); return `<tr><td style="text-transform:capitalize">${esc(ayAdi(a))}</td><td class="sg">${para(t.gelir)}</td><td class="sg">${para(t.gider)}</td><td class="sg">${para(t.net)}</td></tr>`; }).join('')}</tbody></table>` : ''}
    ${dag('gelir')}${dag('gider')}
    ${ekler.length ? `<h4>Diğer</h4><table><tbody>${ekler.map(([a, v]) => `<tr><td>${esc(a)}</td><td class="sg">${v}</td></tr>`).join('')}</tbody></table>` : ''}
    <h4>Kayıtlar</h4>
    ${liste.length ? `<table style="font-size:11px"><thead><tr><th>Tarih</th><th>Kategori</th><th>Açıklama</th><th>Ödeme</th><th class="sg">Tutar</th></tr></thead><tbody>
      ${[...liste].sort((a, b) => a.tarih.localeCompare(b.tarih)).map(i => `<tr><td style="white-space:nowrap">${esc(tarihYaz(i.tarih, true))}</td><td>${esc(i.kategori)}</td><td>${esc(i.aciklama || '')}</td><td>${esc(odemeAdi[i.odeme] || '')}</td><td class="sg" style="color:${i.tur === 'gelir' ? '#1e7b34' : '#c62828'}">${i.tur === 'gelir' ? '' : '−'}${para(i.tutar)}</td></tr>`).join('')}</tbody></table>` : '<div class="gri">Bu dönemde kayıt yok.</div>'}
  </div>`;
}

/* ================= Ayarlar ================= */
function ayarlarEkrani() {
  const p = PROFILLER[D.profil];
  let h = sayfa('Ayarlar');
  h += `<div class="grup"><button class="hucre avatarli" id="profilDegis" style="--girinti:74px">${kare(p.simge, p.renk, 'profil')}
      <div class="ic"><b class="k">${esc(D.ad || 'İsimsiz')}</b><small>${esc(p.ad)} profili</small></div><span class="deger">Değiştir</span>${CHEV}</button></div>
    <div class="bolum">${modulAcik('fatura') ? 'İşletme bilgileri' : 'Ad'}</div>
    <div class="grup">
      <label class="f-satir sol"><input type="text" data-ayar="ad" value="${esc(D.ad)}" placeholder="Ad / işletme adı"></label>
      ${modulAcik('fatura') ? [['adres','Adres'],['vd','Vergi dairesi'],['vno','Vergi / TC no'],['tel','Telefon'],['eposta','E-posta'],['iban','IBAN']].map(([a, p]) =>
        `<label class="f-satir sol"><input type="text" data-firma="${a}" value="${esc(D.firma[a])}" placeholder="${p}"></label>`).join('') : ''}
    </div>
    ${modulAcik('fatura') ? '<p class="dipnot">Bu bilgiler fatura ve tekliflerin üst kısmında görünür.</p>' : ''}
    <div class="bolum">Modüller</div>
    <div class="grup">${MODULLER.map(m => `<div class="hucre kareli">${kare(m.simge, m.renk)}<div class="ic"><b>${esc(modulAdi(m))}</b><small>${esc(m.aciklama)}</small></div>
      ${m.zorunlu ? '<span class="deger" style="font-size:14px">Her zaman</span>' : `<label class="anahtar"><input type="checkbox" data-mod="${m.id}" ${modulAcik(m.id) ? 'checked' : ''}><span></span></label>`}</div>`).join('')}</div>
    <p class="dipnot">Kapalı modülün verisi silinmez. Açık modüller soldaki menüde görünür.</p>
    <div class="bolum">Yedekleme</div>
    <div class="grup">
      <button class="hucre kareli" id="disaAktar">${kare('indir', 'mavi')}<div class="ic"><b>Yedeği kaydet ve paylaş</b><small>${D.sonYedek ? 'Son yedek ' + esc(tarihYaz(D.sonYedek.slice(0, 10), true)) : 'Henüz yedek alınmadı'}</small></div>${CHEV}</button>
      <button class="hucre kareli" id="iceAktar">${kare('yukle', 'yesil')}<div class="ic"><b>Yedekten geri yükle</b><small>Mevcut verilerin yerine geçer</small></div>${CHEV}</button>
    </div>
    <p class="dipnot">Veriler yalnızca bu cihazda saklanır. Telefonu değiştirmeden veya uygulamayı silmeden önce yedek alın.</p>
    <div class="grup"><button class="hucre tehlike" id="hepsiniSil">Tüm verileri sil</button></div>
    <p class="soluk" style="text-align:center;font-size:13px;margin:8px 0 0">DN Muhasebe ${VERSIYON}<br>DN Marine Makine ve Güç Sistemleri</p>`;
  $('#icerik').innerHTML = h;
  $('#profilDegis').onclick = () => git('profil');
  $$('[data-ayar]').forEach(i => i.onchange = () => { D[i.dataset.ayar] = i.value.trim(); kaydet(); bildir('Kaydedildi'); });
  $$('[data-firma]').forEach(i => i.onchange = () => { D.firma[i.dataset.firma] = i.value.trim(); kaydet(); bildir('Kaydedildi'); });
  $$('[data-mod]').forEach(c => c.onchange = () => {
    (D.modulAyar[D.profil] ||= {})[c.dataset.mod] = c.checked;
    kaydet(); menuCiz('menu');
    bildir(`${modulAdi(c.dataset.mod)} ${c.checked ? 'açıldı' : 'kapatıldı'}`);
  });
  $('#disaAktar').onclick = yedekAl;
  $('#iceAktar').onclick = () => $('#dosya').click();
  $('#hepsiniSil').onclick = async () => {
    if (!await onay('Tüm veriler silinsin mi?', 'Bütün kayıtlar kalıcı olarak silinir. Bu işlem geri alınamaz.', 'Hepsini sil')) return;
    D = yeniDurum(); kaydet(); bildir('Tüm veriler silindi'); git('panel', true);
  };
}
function yedekAl() {
  const simdi = new Date();
  const ad = `dn-muhasebe-yedek-${bugun()}-${iki(simdi.getHours())}${iki(simdi.getMinutes())}.json`;
  try {
    const yer = dosyaPaylas(ad, JSON.stringify({uygulama: 'dn-muhasebe', surum: VERSIYON, tarih: simdi.toISOString(), veri: D}), 'application/json');
    D.sonYedek = simdi.toISOString(); kaydet();
    bildir('Yedek kaydedildi: ' + yer);
    if (rota()[0] === 'ayarlar') ayarlarEkrani();
  } catch (e) { bildir('Yedek kaydedilemedi', true); }
}
$('#dosya').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const v = j.veri || j;
    if (!Array.isArray(v.islemler) || !Array.isArray(v.kisiler)) throw new Error('biçim');
    if (!await onay('Yedek geri yüklensin mi?', `Yedekte ${v.islemler.length} gelir-gider, ${v.kisiler.length} kişi, ${(v.faturalar || []).length} fatura var. Mevcut verilerin yerine geçer.`, 'Geri yükle')) return;
    D = duzelt(v); kaydet(); bildir('Yedek geri yüklendi');
    git(D.profil ? 'panel' : 'profil', true);
  } catch (err) { bildir('Dosya okunamadı. DN Muhasebe yedeği seçin.', true); }
};

/* ================= Başlat ================= */
D = yukle();
const buAy = bugun().slice(0, 7);
ui = {ay: buAy, pAy: buAy, pSekme: 'liste', vSekme: 'ozet', bAy: buAy, kAy: buAy, rDonem: 'bu-ay', kasaTur: 'hepsi', kasaAra: '', kisiAra: '', urunAra: '', stokFiltre: 'hepsi', faturaAra: '', faturaFiltre: 'hepsi'};
if (!location.hash) history.replaceState(null, '', '#/panel');
ciz();
</script>
</body>
</html>
