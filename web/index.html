<style>
:root{
  --bg:#f3f5f8;--kart:#fff;--kart2:#f6f8fb;--kenar:#e3e8ef;--dolgu:rgba(18,53,91,.07);--dolgu2:rgba(18,53,91,.16);
  --yazi:#1b2533;--ikincil:#6b7686;--ucuncul:#a9b2bf;--ayirici:#e9edf2;
  --marka:#12355b;--marka2:#0f2c4c;--marka-yazi:#fff;
  --mavi:#1f7ae0;--yesil:#1e9e5a;--yesil-yazi:#168a4c;--kirmizi:#e5484d;--turuncu:#f08c00;--sari:#e8b100;
  --mor:#8e4ec6;--pembe:#e5427a;--indigo:#4f5bd5;--camgobegi:#1c9fd6;--nane:#12a594;--kahve:#9a7650;--gri:#7a8696;
  --cubuk:var(--marka);--golge:0 1px 2px rgba(16,32,56,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141b;--kart:#161e27;--kart2:#1c2631;--kenar:#243040;--dolgu:rgba(255,255,255,.07);--dolgu2:rgba(255,255,255,.14);
  --yazi:#e8edf3;--ikincil:#8e9aab;--ucuncul:#5b6778;--ayirici:#222c38;
  --marka:#0b1f35;--marka2:#0a1a2c;
  --mavi:#4a9bf0;--yesil:#2fbf71;--yesil-yazi:#3fcf80;--kirmizi:#f2555a;--turuncu:#f5a524;--sari:#f2c94c;
  --mor:#a875e0;--pembe:#f06292;--indigo:#7c86f0;--camgobegi:#4cc2f0;--nane:#2ec4b0;--kahve:#c09a6b;--gri:#8e9aab;
  --golge:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sayi{font-variant-numeric:tabular-nums}
.gelir{color:var(--yesil-yazi)}.gider{color:var(--kirmizi)}.soluk{color:var(--ikincil)}.mavi{color:var(--mavi)}.turuncu{color:var(--turuncu)}
.gizli{display:none!important}

/* ---- Gezinme çubuğu (iOS nav bar) ---- */
header{position:sticky;top:0;z-index:30;height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--bg);transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
header.kaydi{background:var(--cubuk);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--ayirici)}
header .orta-baslik{font-size:15px;font-weight:600;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
header.kaydi .orta-baslik{opacity:1}
header .sol,header .sag{display:flex;align-items:center;gap:4px}
header .sag{justify-content:flex-end}
.nav-btn{background:none;border:0;color:var(--mavi);display:flex;align-items:center;gap:2px;padding:8px;border-radius:10px;font-size:15px;white-space:nowrap}
.nav-btn:active{opacity:.4}
.nav-btn svg{width:22px;height:22px}
.nav-btn.geri svg{width:26px;height:26px;margin-left:-6px;stroke-width:2.4}
.nav-btn.kalin{font-weight:600}

main{max-width:720px;margin:0 auto;padding:0 16px 48px}
main.sekmesiz{padding-bottom:40px}
.buyuk-baslik{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0 4px 14px;line-height:1.15;word-break:break-word}
.alt-baslik{color:var(--ikincil);font-size:13px;margin:-10px 4px 16px}

/* ---- Soldan açılan menü (çekmece) ---- */
#cekmece{position:fixed;top:0;bottom:0;left:0;width:min(84vw,310px);z-index:60;background:var(--bg);transform:translateX(-102%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) 0 env(safe-area-inset-bottom);overflow-y:auto;overscroll-behavior:contain}
body.cekmece-acik #cekmece{transform:none;box-shadow:0 0 50px rgba(0,0,0,.28)}
#cekmecePerde{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s}
body.cekmece-acik #cekmecePerde{opacity:1;pointer-events:auto}
.c-ust{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border:0;background:none;width:100%;text-align:left;color:inherit}
.c-ust .kare{width:42px;height:42px;border-radius:12px}
.c-ust .kare svg{width:22px;height:22px}
.c-ust b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ust small{color:var(--ikincil);font-size:12.5px}
.c-ust .chev{width:16px;height:16px;color:var(--ucuncul);stroke-width:2.6}
.c-hesaplar{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px}
.c-hesaplar button{display:flex;align-items:center;gap:7px;border:0;background:var(--dolgu);border-radius:99px;padding:4px 12px 4px 4px;font-size:13px;color:var(--yazi);max-width:100%}
.c-hesaplar .kare{width:22px;height:22px;border-radius:50%}
.c-hesaplar .kare svg{width:13px;height:13px}
.c-hesaplar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-baslik{font-size:11.5px;color:var(--ikincil);text-transform:uppercase;letter-spacing:.02em;margin:14px 30px 6px}
.c-liste{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.c-liste a{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:10px;color:var(--yazi);text-decoration:none;font-size:15px;min-height:42px}
.c-liste a:active{background:var(--dolgu)}
.c-liste .kare{width:28px;height:28px;border-radius:8px}
.c-liste .kare svg{width:16px;height:16px}
.c-liste a span.ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-liste .rozet{font-size:12px;color:var(--ikincil);font-variant-numeric:tabular-nums}
.c-liste .rozet.uyar{background:var(--kirmizi);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600;font-size:12px}
.c-liste a.secili{background:var(--kart);box-shadow:var(--golge);font-weight:600}
@media (prefers-color-scheme:dark){.c-liste a.secili{background:var(--kart2)}}
.c-alt{margin-top:auto;padding:22px 30px 18px;color:var(--ikincil);font-size:12.5px;line-height:1.5}
.menu-btn svg{width:26px;height:26px}
body.profilde #cekmece,body.profilde .menu-btn{display:none!important}
@media (min-width:960px){
  body:not(.profilde){padding-left:310px}
  body:not(.profilde) #cekmece{transform:none;border-right:.5px solid var(--ayirici);box-shadow:none}
  #cekmecePerde,.menu-btn{display:none!important}
}

/* ---- Gruplu listeler (inset grouped) ---- */
.bolum{font-size:11.5px;font-weight:600;color:var(--ikincil);text-transform:uppercase;letter-spacing:.04em;margin:0 14px 6px;display:flex;justify-content:space-between;align-items:flex-end}
.bolum a,.bolum button{color:var(--mavi);text-transform:none;font-size:13px;font-weight:500;letter-spacing:-.01em;text-decoration:none;background:none;border:0;padding:0}
.dipnot{font-size:12px;color:var(--ikincil);margin:-10px 14px 20px;line-height:1.45}
.grup{background:var(--kart);border-radius:12px;overflow:hidden;margin:0 0 20px;box-shadow:var(--golge)}
.hucre{--girinti:14px;display:flex;align-items:center;gap:11px;min-height:44px;padding:0 14px;position:relative;width:100%;background:none;border:0;text-align:left;color:inherit;font:inherit;text-decoration:none}
.hucre+.hucre::before{content:"";position:absolute;top:0;left:var(--girinti);right:0;border-top:.5px solid var(--ayirici)}
button.hucre:active,a.hucre:active{background:var(--dolgu)}
.hucre .ic{flex:1;min-width:0;padding:9px 0}
.hucre .ic b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hucre .ic b.k{font-weight:600}
.hucre .ic small{display:block;color:var(--ikincil);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hucre .deger{color:var(--ikincil);white-space:nowrap;text-align:right}
.hucre .tutar{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hucre .tutar small{display:block;font-size:12px;font-weight:400;color:var(--ikincil)}
.hucre .chev{width:15px;height:15px;color:var(--ucuncul);stroke-width:2.6;margin-right:-4px}
.hucre.kareli{--girinti:53px}
.hucre.avatarli{--girinti:59px}
.hucre.tehlike{color:var(--kirmizi);justify-content:center}
.hucre.eylem{color:var(--mavi)}
.kare{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.kare svg{width:16px;height:16px;stroke-width:2.2}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:#fff;background:linear-gradient(180deg,#a5abb8,#858994)}
.avatar svg{width:17px;height:17px;stroke-width:2.4}
.avatar.buyuk{width:54px;height:54px;font-size:20px;margin:0 auto 8px}
.r-mavi{background:var(--mavi)}.r-yesil{background:var(--yesil)}.r-kirmizi{background:var(--kirmizi)}.r-turuncu{background:var(--turuncu)}
.r-mor{background:var(--mor)}.r-pembe{background:var(--pembe)}.r-indigo{background:var(--indigo)}.r-camgobegi{background:var(--camgobegi)}
.r-kahve{background:var(--kahve)}.r-gri{background:var(--gri)}.r-nane{background:var(--nane)}.r-sari{background:var(--sari)}
/* Simge kareleri ve avatarlar: dolgu yerine açık ton + renkli simge (daha sakin) */
.r-mavi{--c:var(--mavi)}.r-yesil{--c:var(--yesil)}.r-kirmizi{--c:var(--kirmizi)}.r-turuncu{--c:var(--turuncu)}.r-mor{--c:var(--mor)}.r-pembe{--c:var(--pembe)}
.r-indigo{--c:var(--indigo)}.r-camgobegi{--c:var(--camgobegi)}.r-kahve{--c:var(--kahve)}.r-gri{--c:var(--gri)}.r-nane{--c:var(--nane)}.r-sari{--c:var(--sari)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  .kare[class*=r-],.avatar[class*=r-]{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
  .r-yesil.kare,.r-yesil.avatar{color:var(--yesil-yazi)}
  @media (prefers-color-scheme:dark){.kare[class*=r-],.avatar[class*=r-]{background:color-mix(in srgb,var(--c) 28%,transparent)}}
}
.hap{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--dolgu);color:var(--ikincil);vertical-align:2px;margin-left:6px;letter-spacing:0}
.hap.yesil{background:rgba(52,199,89,.15);color:var(--yesil-yazi)}
.hap.kirmizi{background:rgba(255,59,48,.13);color:var(--kirmizi)}
.hap.turuncu{background:rgba(255,149,0,.15);color:var(--turuncu)}
.hap.mavi{background:rgba(0,122,255,.12);color:var(--mavi)}
.bos{text-align:center;color:var(--ikincil);padding:28px 22px 24px}
.bos .kare{width:48px;height:48px;border-radius:14px;margin:0 auto 10px}
.bos .kare svg{width:24px;height:24px}
.bos b{display:block;color:var(--yazi);font-size:15px;margin-bottom:4px}
.bos p{margin:0 0 14px;font-size:13px;line-height:1.45}

/* ---- Kartlar ---- */
.kart{background:var(--kart);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--golge)}
.kart-ust{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px;color:var(--ikincil)}
.kart-ust .kare{width:22px;height:22px;border-radius:6px}
.kart-ust .kare svg{width:13px;height:13px}
.kart-ust .sagda{margin-left:auto;font-weight:400;color:var(--ikincil);font-size:13px;display:flex}
.kart-ust .chev{width:15px;height:15px;color:var(--ucuncul);stroke-width:2.6}
a.kart{display:block;color:inherit;text-decoration:none}
a.kart:active{opacity:.7}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.ozet>div+div{border-left:.5px solid var(--ayirici);padding-left:12px}
.ozet div{min-width:0}
.ozet small{display:block;color:var(--ikincil);font-size:12px;margin-bottom:2px}
.ozet b{display:block;font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dev{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.dev.orta{font-size:18px}
.dev .birim{font-size:13px;font-weight:500;color:var(--ikincil)}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ikili .kart{margin:0;min-width:0}
.k-alt{font-size:12px;color:var(--ikincil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-ust{font-size:12.5px;color:var(--ikincil)}

/* Hızlı işlem kutuları */
.hizli{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.hizli button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border:0;border-radius:14px;background:var(--kart);font-size:11.5px;font-weight:500;box-shadow:var(--golge);letter-spacing:0;min-width:0}
.hizli button:active{transform:scale(.96);opacity:.85}
.hizli .kare{width:36px;height:36px;border-radius:50%}
.hizli .kare svg{width:19px;height:19px}

/* İlerleme çubukları */
.ilerleme{height:6px;background:var(--dolgu);border-radius:99px;overflow:hidden;margin-top:7px}
.ilerleme i{display:block;height:100%;border-radius:99px;background:var(--yesil);transition:width .3s}
.ilerleme i.uyar{background:var(--turuncu)}.ilerleme i.asim{background:var(--kirmizi)}.ilerleme i.mor{background:var(--mor)}
.cubuk-satir{padding:10px 0;display:block;width:100%;border:0;background:none;text-align:left}
.cubuk-satir+.cubuk-satir{border-top:.5px solid var(--ayirici)}
.cubuk-satir .ust{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cubuk-satir .ust span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Butonlar ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;min-height:42px;padding:0 14px;font-size:15px;font-weight:600;background:var(--mavi);color:#fff;width:100%}
.btn:active{opacity:.75}
.btn svg{width:17px;height:17px;stroke-width:2.4}
.btn.renkli{background:rgba(0,122,255,.13);color:var(--mavi)}
.btn.yesil-acik{background:rgba(52,199,89,.15);color:var(--yesil-yazi)}
.btn.kirmizi-acik{background:rgba(255,59,48,.12);color:var(--kirmizi)}
.btn.kucuk{min-height:34px;font-size:13.5px;border-radius:99px;width:auto;padding:0 16px;margin:0 auto}
.btn-grup{display:flex;gap:8px;margin-bottom:14px}
.btn-grup .btn{flex:1;min-width:0}
.btn-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin-bottom:18px}
.btn-izgara button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:var(--kart);border-radius:12px;padding:10px 4px;font-size:11.5px;font-weight:500;color:var(--mavi);box-shadow:var(--golge);letter-spacing:0}
.btn-izgara button:active{opacity:.6}
.btn-izgara button:disabled{opacity:.35}
.btn-izgara svg{width:21px;height:21px}

/* Segment kontrol */
.segment{display:flex;background:var(--dolgu);border-radius:9px;padding:2px;gap:2px;margin-bottom:14px}
.segment button,.segment label{flex:1;border:0;background:none;padding:5px 4px;border-radius:7px;font-weight:500;font-size:13px;text-align:center;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.segment input{display:none}
.segment label span{display:block;margin:-5px -4px;padding:5px 4px;border-radius:7px}
.segment .secili,.segment input:checked+span{background:var(--kart);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.segment .secili,.segment input:checked+span{background:#636366}}

/* Arama */
.arama{display:flex;align-items:center;gap:6px;background:var(--dolgu);border-radius:10px;padding:0 8px;margin-bottom:14px;height:36px}
.arama input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:15px;padding:0;-webkit-appearance:none;appearance:none}
.arama input::placeholder{color:var(--ikincil)}
.arama svg{color:var(--ikincil);width:16px;height:16px}

/* Ay seçici */
.ay-secici{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.ay-secici b{font-size:15px;font-weight:600;text-transform:capitalize}
.ay-secici button{border:0;background:var(--dolgu);color:var(--mavi);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ay-secici button svg{width:17px;height:17px;stroke-width:2.6}

/* ---- Formlar ---- */
.f-satir{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;position:relative}
.f-satir+.f-satir::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--ayirici)}
.f-satir>span:first-child{flex:none;min-width:84px}
.f-satir input,.f-satir select,.f-satir textarea{flex:1;min-width:0;border:0;background:none;outline:0;text-align:right;padding:10px 0;font-size:15.5px;color:var(--yazi)}
.f-satir input::placeholder,.f-satir textarea::placeholder{color:var(--ucuncul)}
.f-satir.sol input,.f-satir.sol textarea{text-align:left}
.f-satir textarea{resize:none;min-height:72px;text-align:left}
.f-satir select{appearance:none;-webkit-appearance:none;color:var(--mavi);text-align:right;text-align-last:right}
.f-satir input[type=date],.f-satir input[type=month]{color:var(--mavi);text-align:right;min-height:44px}
.f-satir>input[type=checkbox]{display:none}
.tutar-kutu{background:var(--kart);border-radius:12px;padding:12px 14px 8px;margin-bottom:18px;text-align:center}
.tutar-kutu small{display:block;color:var(--ikincil);font-size:11.5px;text-transform:uppercase;letter-spacing:.02em}
.tutar-giris{width:100%;border:0;background:none;outline:0;text-align:center;font-size:32px;font-weight:700;letter-spacing:-.01em;padding:4px 0;font-variant-numeric:tabular-nums}
.tutar-giris::placeholder{color:var(--ucuncul)}
.cipler{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 18px}
.cip{border:0;background:var(--kart);padding:6px 12px;border-radius:99px;font-size:13.5px;box-shadow:var(--golge);letter-spacing:0}
.cip.secili{background:var(--mavi);color:#fff;border-color:var(--mavi)}
.cip{display:inline-flex;align-items:center;gap:5px}
.cip svg{width:15px;height:15px;color:var(--ikincil)}
.cip.secili svg{color:#fff}
.anahtar{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.anahtar input{opacity:0;width:0;height:0;position:absolute}
.anahtar span{position:absolute;inset:0;background:var(--dolgu2);border-radius:99px;transition:.2s}
.anahtar span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.anahtar input:checked+span{background:var(--yesil)}
.anahtar input:checked+span:before{transform:translateX(20px)}

/* ---- Alt sayfalar (modal) ---- */
.perde{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.perde.acik{background:rgba(0,0,0,.4)}
.modal{background:var(--bg);width:100%;max-width:600px;max-height:94vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.perde.acik .modal{transform:none}
.modal.tam{height:94vh}
.modal-ust{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 6px;flex:none}
.modal-ust b{font-size:15px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.modal-ust .sag{display:flex;justify-content:flex-end}
.modal-govde{overflow:auto;padding:10px 16px 28px;flex:1;-webkit-overflow-scrolling:touch}
.tutamak{width:36px;height:5px;border-radius:9px;background:var(--ucuncul);margin:6px auto 0}
/* Eylem sayfası (action sheet) */
.eylem-perde{padding:0 8px 10px}
.eylem{width:100%;max-width:560px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.perde.acik .eylem{transform:none}
.eylem .grup{margin-bottom:8px;border-radius:14px;background:var(--kart)}
.eylem .baslik{padding:14px 16px 12px;text-align:center;font-size:13px;color:var(--ikincil)}
.eylem .baslik b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.eylem button{display:block;width:100%;border:0;background:none;color:var(--mavi);font-size:17px;padding:14px;border-top:.5px solid var(--ayirici)}
.eylem button:active{background:var(--dolgu)}
.eylem button.ilk{border-top:0}
.eylem button.tehlike{color:var(--kirmizi)}
.eylem button.iptal{font-weight:600;border:0;background:var(--kart);border-radius:14px}

/* Profil seçimi */
.karsilama{text-align:center;padding:20px 8px 8px}
.logo{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#1d4f7a,#0f2a44);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-weight:800;font-size:26px;letter-spacing:.02em;box-shadow:0 6px 20px rgba(15,42,68,.3)}
.karsilama h2{margin:0 0 6px;font-size:28px;font-weight:700}
.karsilama p{margin:0 0 22px;color:var(--ikincil);font-size:16px}
.profil-kart{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--kart);border:2px solid transparent;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--golge)}
.profil-kart:active{transform:scale(.98)}
.profil-kart.secili{border-color:var(--mavi)}
.profil-kart .kare{width:40px;height:40px;border-radius:11px}
.profil-kart .kare svg{width:22px;height:22px}
.profil-kart b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.profil-kart small{display:block;color:var(--ikincil);font-size:13px}
.profil-kart .etiketler{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.profil-kart .etiketler span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--dolgu);color:var(--ikincil);letter-spacing:0}
.kare.profil{width:46px;height:46px;border-radius:12px}

/* Menü ızgarası */
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:20px 8px;margin:4px 0 28px}
.izgara a{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--yazi);font-size:13px;text-align:center;letter-spacing:0}
.izgara a:active{opacity:.6}
.izgara .kare{width:62px;height:62px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.izgara .kare svg{width:30px;height:30px;stroke-width:2}

/* Grafik */
.grafik svg{width:100%;height:auto;display:block}
.grafik .ek{font-size:10px;fill:var(--ikincil)}
.lejant{display:flex;gap:14px;font-size:13px;color:var(--ikincil);margin-top:6px}
.lejant i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Fatura önizleme */
.kagit{background:#fff;color:#111;border-radius:12px;padding:20px 18px;margin-bottom:20px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
.kagit .ust{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.kagit h3{margin:0 0 4px;font-size:20px;letter-spacing:.04em}
.kagit .gri{color:#666;font-size:12.5px;line-height:1.45}
.kagit table{width:100%;border-collapse:collapse;margin:10px 0}
.kagit th{font-size:11.5px;text-transform:uppercase;color:#666;text-align:left;border-bottom:1px solid #ddd;padding:6px 4px;font-weight:600}
.kagit td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:top}
.kagit .sg{text-align:right;white-space:nowrap}
.kagit .toplamlar{margin-left:auto;width:min(100%,260px)}
.kagit .toplamlar div{display:flex;justify-content:space-between;padding:3px 0}
.kagit .toplamlar .genel{font-weight:700;font-size:16px;border-top:2px solid #111;margin-top:4px;padding-top:7px}
.kagit h4{margin:18px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#444}
.kagit .kutular{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kagit .kutular div{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.kagit .kutular small{display:block;color:#666;font-size:11px}
.kagit .kutular b{font-size:15px}
.kagit tr.top td{font-weight:700;border-top:2px solid #111}
.kagit.puantaj table{font-size:10px}
.kagit.puantaj td,.kagit.puantaj th{padding:3px 1px;text-align:center;border:1px solid #ddd}
.kagit.puantaj td:first-child{text-align:left;white-space:nowrap;padding-right:4px}
#yazdirAlani{display:none}
@media print{
  body>*:not(#yazdirAlani){display:none!important}
  #yazdirAlani{display:block!important}
  #yazdirAlani .kagit{box-shadow:none;padding:0;font-size:12pt}
  html,body{background:#fff}
  @page{size:A4;margin:12mm}
  .kagit h4,.kagit tr{break-inside:avoid}
}

.secim{cursor:pointer}
.secim>input{display:none}
.secim .tik{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ucuncul);flex:none;display:grid;place-items:center}
.secim>input:checked~.tik{background:var(--mavi);border-color:var(--mavi)}
.secim>input:checked~.tik::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* Puantaj takvimi */
.takvim-ust,.takvim{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.takvim-ust{font-size:12px;color:var(--ikincil);text-align:center;margin-bottom:6px;font-weight:600}
.takvim{margin-bottom:14px}
.takvim button{border:0;border-radius:10px;height:48px;width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:600;color:var(--yazi);background:var(--kart);box-shadow:var(--golge);padding:0;letter-spacing:0}
.takvim button small{font-size:10px;font-weight:600;line-height:1}
.takvim button:active{opacity:.6}
.takvim-bos{visibility:hidden}
.d-C small{color:var(--yesil-yazi)}
.d-H,.d-T{background:var(--dolgu)!important;color:var(--ikincil)!important}
.d-I{background:rgba(0,122,255,.14)!important}.d-I small{color:var(--mavi)}
.d-R{background:rgba(255,149,0,.18)!important}.d-R small{color:var(--turuncu)}
.d-U,.d-D{background:rgba(255,59,48,.14)!important}.d-U small,.d-D small{color:var(--kirmizi)}
.d-Y{opacity:.35}
.puan-lejant{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ikincil);margin:0 4px 18px}
.puan-lejant b{font-weight:700;margin-right:3px}
.satir-ozet{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* Kalem düzenleyici */
.kalem{background:var(--kart);border-radius:12px;margin-bottom:10px;overflow:hidden}
.kalem .f-satir input{font-size:16px}
.kalem-alt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px 10px;font-size:14px;color:var(--ikincil)}
.kalem-alt button{border:0;background:none;color:var(--kirmizi);font-size:14px;padding:4px 0}
.kdv-sec{display:flex;gap:4px}
.kdv-sec button{border:0;background:var(--dolgu);color:var(--yazi);border-radius:7px;padding:4px 8px;font-size:13px;letter-spacing:0}
.kdv-sec button.secili{background:var(--mavi);color:#fff}

/* Bildirim (HUD) */
.bildirim{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px) scale(.96);opacity:0;background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:70;transition:.22s;max-width:calc(100% - 40px);text-align:center;pointer-events:none;display:flex;align-items:center;gap:8px}
.bildirim svg{width:20px;height:20px;stroke-width:2.6;color:var(--yesil)}
.bildirim.goster{opacity:1;transform:translateX(-50%)}
.bildirim.hata svg{color:var(--kirmizi)}

/* ================= Tema: lacivert üst çubuk ve kenar menü, düz kartlar ================= */
header{display:flex;gap:4px;height:52px;background:var(--marka);color:var(--marka-yazi);border-bottom:0;padding:0 6px;margin-bottom:14px}
header.kaydi{background:var(--marka);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header .orta-baslik{opacity:1;flex:1;min-width:0;max-width:none;font-size:17px;font-weight:600;padding-left:4px}
header .sol,header .sag{flex:none}
header .nav-btn{color:#fff}
header .nav-btn.geri span{display:none}
.buyuk-baslik{display:none}
.alt-baslik{margin:-4px 2px 14px;font-size:13px}
.grup,.kart,.tutar-kutu,.btn-izgara button,.hizli button,.cip,.profil-kart,.takvim button{border:1px solid var(--kenar);box-shadow:none}
.grup{border-radius:10px}
.kart{border-radius:10px}
.eylem .grup{border:0}
.hucre+.hucre::before{left:0}
.bolum{margin:0 4px 6px;color:var(--ikincil)}
.dipnot{margin-left:4px;margin-right:4px}
/* Sekmeler: alt çizgili */
.segment{background:none;border-bottom:1px solid var(--kenar);border-radius:0;padding:0;gap:0}
.segment button,.segment label{border-radius:0;padding:9px 4px;color:var(--ikincil);font-weight:600}
.segment label span{margin:-9px -4px;padding:9px 4px;border-radius:0}
.segment .secili,.segment input:checked+span{background:none!important;box-shadow:inset 0 -2px 0 var(--mavi);color:var(--mavi)}
/* Düğmeler */
.btn{border-radius:8px}
.btn.renkli{background:var(--kart);color:var(--mavi);border:1px solid var(--kenar)}
.btn.yesil-acik{background:var(--yesil);color:#fff}
.btn.kirmizi-acik{background:var(--kart);color:var(--kirmizi);border:1px solid var(--kenar)}
.ay-secici button{background:var(--kart);border:1px solid var(--kenar)}
.arama{background:var(--kart);border:1px solid var(--kenar)}
/* Kenar menü: lacivert */
#cekmece{background:var(--marka2);color:rgba(255,255,255,.88)}
.c-ust{color:#fff;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.c-ust small{color:rgba(255,255,255,.55)}
.c-ust .chev{color:rgba(255,255,255,.4)}
.c-ust .kare[class*=r-]{background:rgba(255,255,255,.12);color:#fff}
.c-hesaplar button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.c-hesaplar .kare[class*=r-]{background:rgba(255,255,255,.14);color:#fff}
.c-baslik{color:rgba(255,255,255,.42);margin:16px 26px 4px}
.c-liste{padding:0 10px}
.c-liste a{color:rgba(255,255,255,.86);border-radius:8px;position:relative}
.c-liste a:active{background:rgba(255,255,255,.06)}
.c-liste .kare[class*=r-]{background:none;color:rgba(255,255,255,.75);width:24px}
.c-liste .kare svg{width:19px;height:19px;stroke-width:1.9}
.c-liste .rozet{color:rgba(255,255,255,.55)}
.c-liste a.secili{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.c-liste a.secili .kare[class*=r-]{color:#6db3ff}
.c-liste a.secili::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#6db3ff}
.c-alt{color:rgba(255,255,255,.4)}
@media (prefers-color-scheme:dark){.c-liste a.secili{background:rgba(255,255,255,.1)}}
/* Özet ekranı: metrik kutuları */
.metrikler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metrik{display:block;background:var(--kart);border:1px solid var(--kenar);border-radius:10px;padding:12px 12px 11px;color:inherit;text-decoration:none;min-width:0;border-top:3px solid var(--c,var(--mavi))}
.metrik:active{opacity:.7}
.metrik .ust{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ikincil);text-transform:uppercase;letter-spacing:.03em}
.metrik .ust svg{width:15px;height:15px;color:var(--c,var(--mavi))}
.metrik b{display:block;font-size:19px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrik small{display:block;font-size:12px;color:var(--ikincil);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yeni-satir{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.yeni-satir::-webkit-scrollbar{display:none}
.yeni-satir button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--kenar);background:var(--kart);border-radius:99px;padding:7px 13px 7px 9px;font-size:13.5px;font-weight:600;color:var(--yazi)}
.yeni-satir button svg{width:16px;height:16px;color:var(--c,var(--mavi))}
.yeni-satir button:active{opacity:.6}
.vade{font-size:12px;font-weight:600}
svg.kucuk-simge{width:16px;height:16px;color:var(--ikincil)}

/* PIN kilidi */
#kilitEkran{position:fixed;inset:0;z-index:90;background:var(--marka,#12355b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
#kilitEkran .logo{box-shadow:none;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:20px}
#kilitEkran h3{margin:0;font-size:17px;font-weight:600}
#kilitEkran p{margin:-10px 0 0;font-size:13px;opacity:.7;min-height:18px;text-align:center}
.pin-nokta{display:flex;gap:16px;margin:4px 0 10px}
.pin-nokta i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}
.pin-nokta i.dolu{background:#fff}
.pin-nokta.salla{animation:salla .35s}
@keyframes salla{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.tus-takim{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.tus-takim button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:400;font-family:inherit}
.tus-takim button:active{background:rgba(255,255,255,.25)}
.tus-takim button.bos{background:none;font-size:14px}
.tus-takim button.bos:empty{visibility:hidden}

/* Fatura özeti (Paraşüt tarzı) */
.fatura-ozet .fo-ust{display:flex;gap:10px;align-items:flex-start}
.fatura-ozet small{display:block;font-size:12px;color:var(--ikincil)}
.fatura-ozet .fo-ad{display:block;font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fatura-ozet .fo-vade{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ikincil);margin-top:4px}
.fatura-ozet .fo-vade.gider{color:var(--kirmizi)}
.fatura-ozet .fo-tutar{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:12px 0 10px;font-variant-numeric:tabular-nums}
.fo-cubuk{height:8px;border-radius:99px;background:var(--dolgu);overflow:hidden}
.fo-cubuk i{display:block;height:100%;background:var(--yesil);border-radius:99px}
.fo-alt{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.fo-alt small{display:block;font-size:12px;color:var(--ikincil)}
.fo-alt b{font-size:15px;font-variant-numeric:tabular-nums}
.cubuk{height:6px;border-radius:99px;background:var(--dolgu);overflow:hidden;margin-top:6px}
.cubuk i{display:block;height:100%;border-radius:99px}

/* ================= Tema 0.9: mürekkep ve kâğıt =================
   Sıcak kâğıt zemin, mürekkep laciverti, pirinç vurgu. Rakamlar Fraunces, arayüz Manrope. */
:root{
  --bg:#f4f0e8;--kart:#fffdf8;--kart2:#faf6ee;--kenar:#e6dfd2;--ayirici:#ede7dc;--dolgu:rgba(40,36,28,.06);--dolgu2:rgba(40,36,28,.13);
  --yazi:#1c2130;--ikincil:#736d63;--ucuncul:#b0a99c;
  --marka:#16213a;--marka2:#111a2e;--altin:#a8823d;--altin2:#d2ad66;
  --mavi:#2d5c99;--yesil:#2e7a58;--yesil-yazi:#28704f;--kirmizi:#bf4f3a;--turuncu:#c4842a;--sari:#c9a13a;
  --mor:#7a5aa6;--pembe:#b4536f;--indigo:#4a5a9c;--camgobegi:#2f7f9b;--nane:#2f8a7c;--kahve:#8c6a48;--gri:#80796e;
  --yazi-ui:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;--yazi-sayi:"Fraunces",Georgia,"Times New Roman",serif;
  --golge:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(28,33,48,.04),0 12px 28px -18px rgba(28,33,48,.22);
  --golge-derin:0 1px 2px rgba(0,0,0,.12),0 18px 40px -20px rgba(17,26,46,.55);
  --egri:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1118;--kart:#161a23;--kart2:#1b202b;--kenar:#262c38;--ayirici:#222835;--dolgu:rgba(236,230,218,.07);--dolgu2:rgba(236,230,218,.14);
  --yazi:#ece6da;--ikincil:#9c958a;--ucuncul:#5e6470;
  --marka:#0c1019;--marka2:#0a0d15;--altin:#d2a95f;--altin2:#e8c785;
  --mavi:#86aee6;--yesil:#5db78c;--yesil-yazi:#6cc398;--kirmizi:#e2806a;--turuncu:#e3a54f;--sari:#e2c46a;
  --mor:#b294dc;--pembe:#df8aa3;--indigo:#93a1e0;--camgobegi:#6bb6cf;--nane:#63c2b2;--kahve:#c39d77;--gri:#9c958a;
  --golge:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -20px rgba(0,0,0,.7);
}}
html,body{font-family:var(--yazi-ui);font-size:14.5px;letter-spacing:0;word-spacing:.05em;font-feature-settings:"ss01"}
body{background:var(--bg) radial-gradient(900px 420px at 110% -8%,rgba(168,130,61,.09),transparent 62%) no-repeat}
::selection{background:rgba(168,130,61,.28)}
/* Rakamlar: zarif serif, eşit genişlik */
.dev,.metrik b,.ozet b,.tutar,.fo-tutar,.fo-alt b,.tutar-giris,.kahraman .k-tutar,.cubuk-satir .sayi{font-family:var(--yazi-sayi);font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto;letter-spacing:-.01em}
.tutar{font-weight:560}
.tutar small,.tutar .hap{font-family:var(--yazi-ui);letter-spacing:0}
.dev{font-weight:560;letter-spacing:-.02em}
/* Üst çubuk: mürekkep, ince pirinç çizgi */
header,header.kaydi{background:linear-gradient(165deg,#1c2a48 0%,var(--marka) 55%,var(--marka2) 100%);box-shadow:inset 0 -1px 0 rgba(210,173,102,.32),0 6px 18px -12px rgba(10,14,24,.6)}
@media (prefers-color-scheme:dark){header,header.kaydi{background:linear-gradient(165deg,#151c2c,#0c1019 70%)}}
header .orta-baslik{font-family:var(--yazi-sayi);font-weight:560;font-size:19px;letter-spacing:-.01em}
/* Kartlar ve gruplar: kâğıt, yumuşak derinlik */
.grup,.kart,.metrik,.tutar-kutu,.btn-izgara button,.cip,.profil-kart,.arama,.ay-secici button{border:1px solid var(--kenar);box-shadow:var(--golge)}
.grup,.kart,.metrik{border-radius:16px}
.kart,.grup,.metrik{background:var(--kart)}
.bolum{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ikincil);margin:22px 6px 8px;align-items:center}
.bolum::before{content:"";display:inline-block;width:14px;height:1.5px;background:var(--altin);margin-right:8px;vertical-align:middle;border-radius:2px;flex:none}
.bolum{justify-content:flex-start}
.bolum a,.bolum>button{margin-left:auto;color:var(--altin);font-weight:600;letter-spacing:0;font-size:12.5px}
.hucre b,.ic b{font-weight:600}
.k-ust,.ozet small,.metrik .ust,.kart-ust{letter-spacing:.02em}
/* Simge kareleri: renkli cam */
@supports (background:color-mix(in srgb,red 10%,transparent)){
  .kare[class*=r-]{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent)}
  .avatar[class*=r-]{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
  .hap.yesil{background:color-mix(in srgb,var(--yesil) 14%,transparent)}.hap.kirmizi{background:color-mix(in srgb,var(--kirmizi) 14%,transparent)}
  .hap.turuncu{background:color-mix(in srgb,var(--turuncu) 16%,transparent)}.hap.mavi{background:color-mix(in srgb,var(--mavi) 14%,transparent)}
}
.kare{border-radius:11px}
.hap{font-weight:700;font-size:10.5px;letter-spacing:.02em;padding:2px 8px}
/* Sekmeler */
.segment .secili,.segment input:checked+span{box-shadow:inset 0 -2px 0 var(--altin);color:var(--yazi)}
/* Düğmeler */
.btn{border-radius:12px;font-weight:700;letter-spacing:.005em}
.btn:not(.renkli):not(.yesil-acik):not(.kirmizi-acik){background:linear-gradient(170deg,#22325a,var(--marka));color:#fff;box-shadow:0 8px 18px -10px rgba(17,26,46,.7)}
.btn.yesil-acik{background:linear-gradient(170deg,#368a64,var(--yesil));box-shadow:0 8px 18px -10px rgba(46,122,88,.7)}
.btn.renkli,.btn.kirmizi-acik{background:var(--kart);box-shadow:var(--golge)}
.btn.renkli{color:var(--yazi)}
.btn-izgara button{border-radius:14px;color:var(--yazi);font-weight:600}
.btn-izgara button svg{color:var(--altin)}
@media (prefers-color-scheme:dark){.btn:not(.renkli):not(.yesil-acik):not(.kirmizi-acik){background:linear-gradient(170deg,#2a3a63,#1a2440)}}
.yeni-satir button{border-radius:99px;box-shadow:var(--golge);padding:8px 14px 8px 10px;font-size:13px}
/* Metrik kutuları: köşede renk ışığı */
.metrik{border-top:1px solid var(--kenar);padding:13px 14px 12px;position:relative;overflow:hidden}
@supports (background:color-mix(in srgb,red 10%,transparent)){.metrik{background:radial-gradient(140px 90px at 105% -10%,color-mix(in srgb,var(--c) 13%,transparent),transparent 70%),var(--kart)}}
.metrik .ust{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.metrik b{font-size:21px;font-weight:560;margin-top:8px}
.metrik:last-child:nth-child(odd){grid-column:1/-1}
/* Özet: kahraman kartı */
.kahraman{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px 0;margin-bottom:14px;color:#f3ecdf;
  background:radial-gradient(260px 160px at 100% 0%,rgba(210,173,102,.24),transparent 70%),linear-gradient(160deg,#22325a 0%,#16213a 60%,#0f1729 100%);box-shadow:var(--golge-derin)}
.kahraman::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);pointer-events:none}
.kahraman .k-ust{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:rgba(243,236,223,.66);letter-spacing:.01em}
.kahraman .k-ust b{color:#f3ecdf;font-weight:600}
.kahraman .k-surum{font-size:10.5px;letter-spacing:.08em;color:rgba(210,173,102,.8)}
.kahraman .k-etiket{margin-top:14px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--altin2)}
.kahraman .k-tutar{font-size:34px;font-weight:480;line-height:1.1;margin-top:4px;white-space:nowrap;letter-spacing:-.025em}
.kart-ust .sagda a.mavi{color:var(--altin)!important;font-weight:600}
.kahraman .k-tutar.eksi{color:#f1a08c}
.kahraman .k-satir{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:rgba(243,236,223,.7)}
.kahraman .k-satir b{font-family:var(--yazi-sayi);font-weight:560;color:#f3ecdf;margin-left:4px}
.kahraman .k-satir i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kahraman svg{display:block;width:calc(100% + 36px);margin:6px -18px 0;height:58px}
@media (prefers-color-scheme:dark){.kahraman{background:radial-gradient(260px 160px at 100% 0%,rgba(210,173,102,.18),transparent 70%),linear-gradient(160deg,#1a2338,#111725 70%)}}
/* Başlarken */
.adim{font-family:var(--yazi-sayi);font-size:20px;font-weight:400;color:var(--altin);width:32px;flex:none;text-align:center;font-style:italic}
/* Boş durumlar: halkalı çizim */
.bos{padding:30px 24px 26px}
.bos-cizim{position:relative;width:96px;height:96px;margin:0 auto 14px;display:grid;place-items:center;color:var(--c,var(--altin))}
.bos-cizim svg.halka{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor}
.bos-cizim .kare{position:relative;margin:0;width:46px;height:46px;border-radius:14px}
.bos b{font-family:var(--yazi-sayi);font-weight:560;font-size:17px;letter-spacing:-.01em}
.bos p{max-width:270px;margin-left:auto;margin-right:auto}
.grafik-bos{height:118px;display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--ikincil);border-radius:12px;
  background:repeating-linear-gradient(0deg,transparent 0 27px,var(--ayirici) 27px 28px)}
.grafik-bos span{background:var(--kart);padding:4px 10px;border-radius:99px}
/* Kenar menü */
#cekmece{background:linear-gradient(175deg,#1a2644,#111a2e 55%,#0d1424)}
@media (prefers-color-scheme:dark){#cekmece{background:linear-gradient(175deg,#141b2b,#0b0f18)}}
.c-ust b{font-family:var(--yazi-sayi);font-weight:560;font-size:18px}
.c-liste a.secili::before{background:var(--altin2)}
.c-liste a.secili .kare[class*=r-]{color:var(--altin2)}
.c-baslik{letter-spacing:.14em;font-size:10px}
/* Fatura özeti ve PIN */
.fatura-ozet .fo-tutar{font-weight:500;font-size:30px}
.fo-cubuk i{background:linear-gradient(90deg,var(--yesil),#4aa77c)}
#kilitEkran{background:radial-gradient(300px 220px at 50% 18%,rgba(210,173,102,.2),transparent 70%),linear-gradient(170deg,#1c2a48,#0d1424)}
#kilitEkran h3{font-family:var(--yazi-sayi);font-weight:500;font-size:21px}
#kilitEkran .logo,.karsilama .logo{font-family:var(--yazi-sayi);font-style:italic;font-weight:500;color:var(--altin2);background:linear-gradient(160deg,#22325a,#111a2e);box-shadow:inset 0 0 0 1px rgba(210,173,102,.35),0 14px 30px -14px rgba(17,26,46,.7)}
.karsilama h2{font-family:var(--yazi-sayi);font-weight:500;letter-spacing:-.02em}
.tus-takim button{font-family:var(--yazi-sayi);font-weight:400}
.modal-ust b,.eylem .baslik b{font-family:var(--yazi-sayi);font-weight:560;font-size:17px}
.tutar-giris{font-weight:500}
.bildirim{border-radius:16px;background:rgba(22,33,58,.94)}
/* Hareket: sayfa girişi, basma, grafik büyümesi */

/* Formlar: tam ekran ayrı sayfa (arkadaki ekranla karışmaz) */
.perde.sayfa-perde{align-items:stretch;background:transparent!important}
.sayfa-modal{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;transform:translateX(100%);transition:transform .32s var(--egri);box-shadow:-20px 0 40px -20px rgba(0,0,0,.35)}
.perde.acik .sayfa-modal{transform:none}
.sayfa-modal .modal-ust{display:flex;align-items:center;gap:6px;min-height:52px;padding:env(safe-area-inset-top) 8px 0 4px;color:#fff;
  background:linear-gradient(165deg,#1c2a48 0%,var(--marka) 55%,var(--marka2) 100%);box-shadow:inset 0 -1px 0 rgba(210,173,102,.32)}
@media (prefers-color-scheme:dark){.sayfa-modal .modal-ust{background:linear-gradient(165deg,#151c2c,#0c1019 70%)}}
.sayfa-modal .modal-ust .nav-btn{color:#fff;padding:8px}
.sayfa-modal .modal-ust b{flex:1;text-align:left;max-width:none;font-size:18px;color:#fff}
.sayfa-modal .modal-govde{padding:16px 16px 24px;background:var(--bg) radial-gradient(700px 300px at 110% -10%,rgba(168,130,61,.07),transparent 60%) no-repeat}
.modal-alt{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--kart);border-top:1px solid var(--kenar);box-shadow:0 -10px 24px -18px rgba(0,0,0,.35)}
.modal-alt .btn{min-height:48px;font-size:15.5px;border-radius:14px}
@media (prefers-reduced-motion:no-preference){
  #icerik>*{animation:belir .38s var(--egri) both}
  #icerik>*:nth-child(2){animation-delay:.025s}#icerik>*:nth-child(3){animation-delay:.05s}#icerik>*:nth-child(4){animation-delay:.075s}
  #icerik>*:nth-child(5){animation-delay:.1s}#icerik>*:nth-child(6){animation-delay:.125s}#icerik>*:nth-child(n+7){animation-delay:.15s}
  .metrikler .metrik{animation:belir .45s var(--egri) both}
  .metrikler .metrik:nth-child(2){animation-delay:.06s}.metrikler .metrik:nth-child(3){animation-delay:.12s}.metrikler .metrik:nth-child(4){animation-delay:.18s}
  rect.bar{transform-box:fill-box;transform-origin:50% 100%;animation:buyu .75s var(--egri) both}
  .kahraman path.cizgi{stroke-dasharray:1000;stroke-dashoffset:1000;animation:ciz 1.2s .15s var(--egri) forwards}
  .kahraman path.alan{animation:solgun .9s .5s both}
  .hucre,.metrik,.btn,.btn-izgara button,.yeni-satir button,.profil-kart,a.kart{transition:transform .14s var(--egri),background-color .2s}
  .hucre:active,.metrik:active,.btn:active,.btn-izgara button:active,.yeni-satir button:active,.profil-kart:active,a.kart:active{transform:scale(.982)}
  .bos-cizim svg.halka{animation:don 40s linear infinite}
}
@keyframes belir{from{opacity:0;transform:translateY(5px)}}
@keyframes buyu{from{transform:scaleY(0)}}
@keyframes ciz{to{stroke-dashoffset:0}}
@keyframes solgun{from{opacity:0}}
@keyframes don{to{transform:rotate(360deg)}}

/* ================= Bordro motoru (tutarlar kuruş) =================
   Kaynak: 2026 bordro parametreleri (asgari ücret 33.030 TL brüt, SGK tavanı 9 kat, işveren %21,75). */
const BORDRO = {
  2025: {asgari: 2600550, tavanKat: 7.5, sgkIsci: 14, issizIsci: 1, sgkIsv: 20.75, issizIsv: 2, damga: .759,
    ucret: [[15800000, 15], [33000000, 20], [120000000, 27], [430000000, 35], [Infinity, 40]],
    diger: [[15800000, 15], [33000000, 20], [80000000, 27], [430000000, 35], [Infinity, 40]]},
  2026: {asgari: 3303000, tavanKat: 9, sgkIsci: 14, issizIsci: 1, sgkIsv: 21.75, issizIsv: 2, damga: .759,
    ucret: [[19000000, 15], [40000000, 20], [150000000, 27], [530000000, 35], [Infinity, 40]],
    diger: [[19000000, 15], [40000000, 20], [100000000, 27], [530000000, 35], [Infinity, 40]]}
};
const bordroParam = yil => { const y = Object.keys(BORDRO).map(Number).filter(x => x <= yil); return BORDRO[y.length ? Math.max(...y) : 2025]; };
function vergiDilim(matrah, dilimler) {
  let v = 0, alt = 0;
  for (const [ust, oran] of dilimler) {
    if (matrah <= alt) break;
    v += (Math.min(matrah, ust) - alt) * oran / 100;
    alt = ust;
  }
  return Math.round(v);
}
const marjinalOran = (matrah, dilimler) => (dilimler.find(([ust]) => matrah <= ust) || dilimler[dilimler.length - 1])[1];
/* Tek ayın bordrosu. kum: yılbaşından önceki ayların gelir vergisi matrahı toplamı; gun: SGK gün sayısı (eksik günler düşülmüş). */
function bordroAy(brut, ay, kum = 0, gun = 30, tesvik = D.bordroAyar.tesvik) {
  const P = bordroParam(+ay.slice(0, 4)), aySira = +ay.slice(5, 7);
  const sgkMatrah = Math.min(brut, Math.round(P.asgari * P.tavanKat * gun / 30));
  const sgkI = Math.round(sgkMatrah * P.sgkIsci / 100), issI = Math.round(sgkMatrah * P.issizIsci / 100);
  const gvMatrah = brut - sgkI - issI;
  const gvHam = vergiDilim(kum + gvMatrah, P.ucret) - vergiDilim(kum, P.ucret);
  // Asgari ücret istisnası: asgari ücretin (gün oranında) vergisi herkesin vergisinden düşülür.
  const au = Math.round(P.asgari * gun / 30), auMatrah = au - Math.round(au * (P.sgkIsci + P.issizIsci) / 100);
  const auKum = (P.asgari - Math.round(P.asgari * (P.sgkIsci + P.issizIsci) / 100)) * (aySira - 1);
  const gvIst = Math.min(gvHam, vergiDilim(auKum + auMatrah, P.ucret) - vergiDilim(auKum, P.ucret));
  const dvHam = Math.round(brut * P.damga / 100), dvIst = Math.min(dvHam, Math.round(au * P.damga / 100));
  const gv = gvHam - gvIst, dv = dvHam - dvIst;
  const net = brut - sgkI - issI - gv - dv;
  const isvSgk = Math.round(sgkMatrah * (P.sgkIsv - (tesvik || 0)) / 100), issV = Math.round(sgkMatrah * P.issizIsv / 100);
  return {brut, gun, sgkMatrah, sgkI, issI, gvMatrah, kum, gvHam, gvIst, gv, dvHam, dvIst, dv, net, isvSgk, issV,
    tesvikTutar: Math.round(sgkMatrah * (tesvik || 0) / 100), maliyet: brut + isvSgk + issV, oranIsv: P.sgkIsv - (tesvik || 0), marjinal: marjinalOran(kum + gvMatrah, P.ucret)};
}
/* Net ücreti verecek brütü bulur (ikili arama). */
function nettenBrut(net, ay, kum = 0, gun = 30) {
  if (!(net > 0)) return 0;
  let a = net, b = net * 3;
  for (let i = 0; i < 60 && b - a > 1; i++) { const m = Math.floor((a + b) / 2); bordroAy(m, ay, kum, gun).net < net ? a = m : b = m; }
  return bordroAy(a, ay, kum, gun).net >= net ? a : b;
}
/* Personelin o ayki bordrosu: ücret tipi (net/brüt), yılbaşından birikmiş matrah ve puantaj birlikte. */
function bordro(p, ay) {
  const yil = ay.slice(0, 4), giris = p.iseGiris && p.iseGiris.slice(0, 4) === yil ? +p.iseGiris.slice(5, 7) : 1;
  let kum = 0, b = null;
  for (let m = giris; m <= +ay.slice(5, 7); m++) {
    const a = `${yil}-${iki(m)}`, pu = puantajOzet(p, a);
    const tamBrut = p.ucretTip === 'brut' ? (p.maas || 0) : nettenBrut(p.maas || 0, a, kum);
    const gunluk = tamBrut / 30;
    const brut = Math.round(gunluk * pu.gun + gunluk / 7.5 * 1.5 * pu.mesai);
    b = bordroAy(brut, a, kum, pu.gun);
    b.tamBrut = tamBrut; b.mesaiUcret = Math.round(gunluk / 7.5 * 1.5 * pu.mesai); b.puantaj = pu;
    kum += b.gvMatrah;
  }
  return b || bordroAy(0, ay);
}

/* ================= Puantaj ================= */
const PUANTAJ = {
  C: {ad: 'Çalıştı', kisa: 'Ç'}, H: {ad: 'Hafta tatili', kisa: 'HT'}, T: {ad: 'Resmi tatil', kisa: 'RT'},
  I: {ad: 'Yıllık izin', kisa: 'İ'}, R: {ad: 'Raporlu', kisa: 'R', eksik: true}, U: {ad: 'Ücretsiz izin', kisa: 'Üİ', eksik: true},
  D: {ad: 'Devamsız', kisa: 'D', eksik: true}, Y: {ad: 'İşe başlamadı / ayrıldı', kisa: '–', eksik: true}
};
// Resmi tatiller (yarım günler hariç). Dini bayramlar yıllara göre eklenir.
const RESMI_TATIL = ['01-01', '04-23', '05-01', '05-19', '07-15', '08-30', '10-29'];
const DINI_TATIL = {2025: ['03-30', '03-31', '04-01', '06-06', '06-07', '06-08', '06-09'], 2026: ['03-20', '03-21', '03-22', '05-27', '05-28', '05-29', '05-30'], 2027: ['03-10', '03-11', '03-12', '05-16', '05-17', '05-18', '05-19']};
const resmiTatilMi = t => RESMI_TATIL.includes(t.slice(5)) || (DINI_TATIL[t.slice(0, 4)] || []).includes(t.slice(5));
function puantajGun(p, ay, g) {
  const t = `${ay}-${iki(g)}`, k = D.puantaj[ay]?.[p.id]?.g?.[iki(g)];
  if (k) return k;
  if ((p.iseGiris && t < p.iseGiris) || (p.cikis && t > p.cikis)) return 'Y';
  if (resmiTatilMi(t)) return 'T';
  return tarihNesne(t).getDay() === 0 ? 'H' : 'C';
}
function puantajOzet(p, ay) {
  const son = ayinSonGunu(ay), say = {};
  for (let g = 1; g <= son; g++) { const k = puantajGun(p, ay, g); say[k] = (say[k] || 0) + 1; }
  const eksik = Object.entries(say).filter(([k]) => PUANTAJ[k].eksik).reduce((s, [, v]) => s + v, 0);
  // SGK'da ay 30 gün sayılır; eksik gün yoksa 30, varsa 30 - eksik.
  return {say, eksik, gun: eksik >= son ? 0 : Math.max(0, 30 - eksik), mesai: D.puantaj[ay]?.[p.id]?.mesai || 0};
}

/* ================= Modal, eylem sayfası, onay ================= */
const yigin = [];
function perdeAc(icHtml, sinif = '') {
  const el = document.createElement('div');
  el.className = 'perde ' + sinif;
  el.innerHTML = icHtml;
  el.addEventListener('click', e => { if (e.target === el) kapat(); });
  document.body.appendChild(el);
  yigin.push(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('acik')));
  return el;
}
function kapat() {
  const el = yigin.pop();
  if (!el) return false;
  el.classList.remove('acik');
  if (el._kapaninca) el._kapaninca();
  setTimeout(() => el.remove(), 300);
  return true;
}
/* iOS tarzı form penceresi: Vazgeç | Başlık | Kaydet */
function modal(baslik, govde, {kaydet: kaydetFn, kaydetAd = 'Kaydet', tam = false, solAd = 'Vazgeç'} = {}) {
  // Formlar ayrı, tam ekran bir sayfa olarak sağdan açılır; kaydet düğmesi altta sabittir.
  const el = perdeAc(`<div class="modal sayfa-modal" role="dialog" aria-modal="true">
    <div class="modal-ust"><button class="nav-btn geri" data-sol aria-label="${esc(solAd)}">${ikon('geri')}</button><b>${esc(baslik)}</b><div class="sag"></div></div>
    <div class="modal-govde">${govde}</div>
    ${kaydetFn ? `<div class="modal-alt"><button class="btn" data-sag>${esc(kaydetAd)}</button></div>` : ''}</div>`, 'sayfa-perde');
  const m = $('.modal', el);
  $('[data-sol]', m).onclick = () => kapat();
  if (kaydetFn) $('[data-sag]', m).onclick = () => { if (kaydetFn(m) !== false) kapat(); };
  anahtarBagla(m);
  return m;
}
function eylemSayfa(baslik, aciklama, eylemler) {
  return new Promise(coz => {
    let bitti = false;
    const sec = v => { if (!bitti) { bitti = true; coz(v); } };
    const ust = baslik || aciklama;
    const el = perdeAc(`<div class="eylem"><div class="grup">
      ${ust ? `<div class="baslik">${baslik ? `<b>${esc(baslik)}</b>` : ''}${esc(aciklama || '')}</div>` : ''}
      ${eylemler.map((e, i) => `<button data-i="${i}" class="${e.tehlike ? 'tehlike' : ''} ${!ust && !i ? 'ilk' : ''}">${esc(e.ad)}</button>`).join('')}
      </div><button class="iptal" data-iptal>Vazgeç</button></div>`, 'eylem-perde');
    el._kapaninca = () => sec(null);
    $$('[data-i]', el).forEach(b => b.onclick = () => { sec(eylemler[+b.dataset.i].deger ?? +b.dataset.i); kapat(); });
    $('[data-iptal]', el).onclick = () => kapat();
  });
}
const onay = (baslik, metin, evet = 'Sil') => eylemSayfa(baslik, metin, [{ad: evet, tehlike: true, deger: true}]).then(v => v === true);
/* iOS anahtarı: satırdaki gizli checkbox ile görünür anahtarı eşler */

/* Seçilen kayıtları (bağlı otomatik kayıtlarıyla birlikte) açık hesaptan başka bir hesaba taşır */
async function kayitTasi() {

  if (!hedefId) return;

  try { hedef = duzelt(JSON.parse(localStorage.getItem(veriAnahtari(hedefId)) || 'null') || yeniDurum()); } catch (e) { hedef = yeniDurum(); }
  const serbest = D.islemler.filter(i => !i.kaynak && !i.hareketId).sort(islemSirala);
  const bolumler = [
    ['islem', 'Gelir / gider kayıtları', serbest.map(i => ({id: i.id, ad: i.aciklama || i.kategori, alt: `${tarihYaz(i.tarih, true)} · ${i.kategori}`, sag: (i.tur === 'gelir' ? '+' : '−') + para(i.tutar), simge: i.tur === 'gelir' ? 'giris' : 'cikis', renk: i.tur === 'gelir' ? 'yesil' : 'kirmizi'}))],
    ['kisi', 'Cariler (hareketleri ve faturalarıyla)', D.kisiler.map(k => ({id: k.id, ad: k.ad, alt: `${D.hareketler.filter(x => x.kisiId === k.id).length} hareket`, sag: para(kisiBakiye(k.id)), simge: 'defter', renk: 'turuncu'}))],
    ['fatura', 'Faturalar', D.faturalar.filter(f => !D.kisiler.length || true).map(f => ({id: f.id, ad: faturaMusteri(f), alt: `${faturaTurAd(f)} ${f.no}`, sag: para(faturaHesap(f).toplam), simge: 'dosya', renk: 'indigo'}))],
    ['personel', 'Personel (ödemeleri ve puantajıyla)', D.personeller.map(p => ({id: p.id, ad: p.ad, alt: p.gorev || 'Personel', sag: `${D.personelOdeme.filter(o => o.personelId === p.id).length} ödeme`, simge: 'kisiler', renk: 'camgobegi'}))],
    ['urun', 'Stok ürünleri (hareketleriyle)', D.urunler.map(u => ({id: u.id, ad: u.ad, alt: `${sayiFmt(urunMiktar(u.id))} ${u.birim}`, sag: '', simge: 'kutu', renk: 'kahve'}))]
  ].filter(([, , l]) => l.length);
  if (!bolumler.length) return bildir('Bu hesapta taşınacak kayıt yok', true);
  const m = modal(`${hesapAdi(H.liste.find(x => x.id === hedefId))} hesabına`, `
    <p class="dipnot" style="margin:0 4px 16px">Seçtiklerinizi işaretleyin. Faturaların, maaşların ve tahsilatların kasadaki otomatik kayıtları da birlikte taşınır.</p>
    ${bolumler.map(([tip, baslik, l]) => `<div class="bolum">${esc(baslik)}<button data-hepsi="${tip}">Tümü</button></div>
      <div class="grup">${l.map(x => `<label class="hucre kareli secim"><input type="checkbox" data-tip="${tip}" value="${x.id}">${kare(x.simge, x.renk)}<div class="ic"><b>${esc(x.ad)}</b><small>${esc(x.alt)}</small></div><span class="deger">${esc(x.sag)}</span><span class="tik"></span></label>`).join('')}</div>`).join('')}`,
    {kaydet: () => {
      const sec = tip => $$(`input[data-tip=${tip}]:checked`, m).map(c => c.value);
      const n = tasi(hedef, {islem: sec('islem'), kisi: sec('kisi'), fatura: sec('fatura'), personel: sec('personel'), urun: sec('urun')});
      if (!n) { bildir('Kayıt seçin', true); return false; }
      localStorage.setItem(veriAnahtari(hedefId), JSON.stringify(hedef));
      kaydet(); bildir(`${n} kayıt taşındı`); setTimeout(ciz, 10);
    }, kaydetAd: 'Taşı', tam: true});
  $$('[data-hepsi]', m).forEach(b => b.onclick = () => { const l = $$(`input[data-tip=${b.dataset.hepsi}]`, m); const hepsi = l.every(c => c.checked); l.forEach(c => c.checked = !hepsi); });
}
function tasi(hedef, sec) {
  let n = 0;
  const al = (dizi, kosul) => { const t = D[dizi].filter(kosul); if (t.length) { D[dizi] = D[dizi].filter(x => !kosul(x)); hedef[dizi].push(...t); } return t; };
  const kopyala = (dizi, id) => { if (id && !hedef[dizi].some(x => x.id === id)) { const x = D[dizi].find(y => y.id === id); if (x) hedef[dizi].push(JSON.parse(JSON.stringify(x))); } };
  const turetilen = id => { al('islemler', i => i.kaynak?.id === id); al('hareketler', h => h.kaynak?.id === id); al('stokHareket', x => x.kaynak?.id === id); };
  const faturaTasi = f => { for (const k of f.kalemler) kopyala('urunler', k.urunId); if (f.kisiId && !sec.kisi.includes(f.kisiId)) kopyala('kisiler', f.kisiId); al('faturalar', x => x.id === f.id); turetilen(f.id); n++; };
  for (const id of sec.kisi) {
    const hr = D.hareketler.filter(h => h.kisiId === id && !h.kaynak);
    al('islemler', i => hr.some(h => h.id === i.hareketId));
    al('hareketler', h => h.kisiId === id && !h.kaynak);
    for (const f of D.faturalar.filter(f => f.kisiId === id)) faturaTasi(f);
    al('kisiler', k => k.id === id); n++;
  }
  for (const id of sec.fatura) { const f = D.faturalar.find(x => x.id === id); if (f) faturaTasi(f); }
  for (const id of sec.personel) {
    const od = D.personelOdeme.filter(o => o.personelId === id).map(o => o.id);
    al('islemler', i => i.kaynak?.tip === 'personel' && (od.includes(i.kaynak.id) || i.kaynak.ust === id));
    al('personelOdeme', o => o.personelId === id);
    for (const a in D.puantaj) if (D.puantaj[a][id]) { (hedef.puantaj[a] ||= {})[id] = D.puantaj[a][id]; delete D.puantaj[a][id]; }
    al('personeller', p => p.id === id); n++;
  }
  for (const id of sec.urun) {
    al('islemler', i => i.kaynak?.tip === 'stok' && i.kaynak.ust === id);
    al('stokHareket', x => x.urunId === id && !x.kaynak);
    al('urunler', u => u.id === id); n++;
  }
  n += al('islemler', i => sec.islem.includes(i.id)).length;
  return n;
}

  const doldur = () => {

}

/* ================= Fatura / Teklif ================= */
function faturaHesap(f) {
  let ara = 0, kdv = 0; const oranlar = {};
  for (const k of f.kalemler || []) {
    const t = Math.round((k.miktar || 0) * (k.fiyat || 0));
    const kd = Math.round(t * (k.kdv || 0) / 100);
    ara += t; kdv += kd;
    if (k.kdv) oranlar[k.kdv] = (oranlar[k.kdv] || 0) + kd;
  }
  return {ara, kdv, oranlar, toplam: ara + kdv};
}
const faturaTurAd = f => ({teklif: 'Teklif', alis: 'Alış faturası'})[f.tur] || 'Fatura';
const faturaliMi = f => (f.tur === 'fatura' || f.tur === 'alis') && f.durum === 'gonderildi';
const faturaOdenen = f => (f.odemeler || []).reduce((s, o) => s + o.tutar, 0);
const faturaKalan = f => Math.max(0, faturaHesap(f).toplam - faturaOdenen(f));
/* odendi / odemeTarihi alanları ödemelerden türetilir (eski kodla uyum için tutulur) */
function odemeDurumu(f) {
  f.odemeler ||= [];
  const od = faturaOdenen(f);
  f.odendi = od > 0 && od >= faturaHesap(f).toplam;
  const son = [...f.odemeler].sort((a, b) => a.tarih.localeCompare(b.tarih)).pop();
  if (son) { f.odemeTarihi = son.tarih; f.odemeSekli = son.odeme; } else delete f.odemeTarihi;
}
/* Vadeye kalan (+) ya da vadeden geçen (−) gün */
const vadeGun = f => f.vade ? Math.round((tarihNesne(f.vade) - tarihNesne(bugun())) / 864e5) : null;
function faturaDurum(f) {
  if (f.durum === 'iptal') return ['İptal', 'kirmizi'];
  if (f.tur === 'alis' && f.durum !== 'taslak') return f.odendi ? ['Ödendi', 'yesil'] : f.vade && f.vade < bugun() ? ['Vadesi geçti', 'kirmizi'] : faturaOdenen(f) ? ['Kısmen ödendi', 'mavi'] : ['Ödenecek', 'turuncu'];
  if (f.tur === 'teklif') return f.donustu ? ['Faturalandı', 'yesil'] : ['Teklif', 'mavi'];
  if (f.durum === 'taslak') return ['Taslak', ''];
  if (f.odendi) return ['Ödendi', 'yesil'];
  if (f.vade && f.vade < bugun()) return ['Vadesi geçti', 'kirmizi'];
  if (faturaOdenen(f)) return ['Kısmen ödendi', 'mavi'];
  return ['Ödenmedi', 'turuncu'];
}
const faturaMusteri = f => (f.kisiId && kisi(f.kisiId)?.ad) || f.musteriAd || (f.tur === 'alis' ? 'Satıcı belirtilmedi' : 'Müşteri belirtilmedi');
function faturaSatiri(f) {
  const [d, r] = faturaDurum(f);

    <div class="ic"><b>${esc(faturaMusteri(f))}</b><small>${f.tur === 'alis' ? 'Alış · ' : ''}${esc(f.no)} · ${esc(tarihYaz(f.tarih))}</small></div>
    <span class="tutar">${para(faturaHesap(f).toplam)}<small><span class="hap ${r}" style="margin:0">${d}</span>${faturaliMi(f) && !f.odendi && faturaOdenen(f) ? `<br>kalan ${para(faturaKalan(f))}` : ''}</small></span>${CHEV}</button>`;
}

}
